[project]
name = "opik-sdk-driver"
version = "0.0.1"
description = "Lean FastAPI service wrapping the Opik Python SDK for E2E test flows."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "opik>=2.0.0",
    # `Readability` is the one metric the estate drives whose backend is an
    # OPTIONAL opik dependency: without textstat the constructor raises
    # ImportError rather than scoring. The SDK declares it the same way, in
    # tests/unit/test_requirements.txt, and deliberately leaves it unpinned —
    # so the readability spec asserts locale SEPARATION and error type, never
    # absolute Flesch numbers, which drift with textstat/pyphen releases.
    "textstat",
    # The third-party client `opik.integrations.ollama` wraps. Needed to
    # import the integration at all, and the only integration dependency
    # here: the tracker is driven against a mock /api/chat served by this
    # app, so no model and no running Ollama are involved.
    "ollama>=0.4.0",
]

# Resolve `opik` from this repo rather than PyPI. The bridge exists so SDK
# regressions surface as E2E failures, and the released wheel cannot show a
# regression in code that has not shipped yet — so a spec covering an
# in-flight SDK change (here: `evaluate_threads(trace_context_transform=...)`)
# is unrunnable against PyPI by construction. This is the same choice the
# repo's Python SDK E2E job already makes (`uv pip install --system .` from
# sdks/python in python_sdk_e2e_tests.yml).
[tool.uv.sources]
opik = { path = "../../../../sdks/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opik_sdk_driver"]
