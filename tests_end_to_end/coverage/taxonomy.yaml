# Opik QA capability taxonomy
#
# This file defines "100%". Coverage % of an area = capabilities with >=1 recent
# passing test / total capabilities in that area. Adding a capability here lowers
# coverage until a test covers it — that is the point: it makes a known gap
# visible instead of silently absent.
#
# It is a REVIEWED file. Changes to the denominator are a QA-owned decision, not
# an implementation detail. See ../TESTING-TAGS.md for the tag grammar and the
# process for adding areas and capabilities.
#
# Enforced by coverage/tag_lint.py, which runs on every PR touching
# tests_end_to_end/ (.github/workflows/tag_lint.yml).
#
# SCOPE: tests_end_to_end/ only — e2e (Playwright) + visual-tests. Nothing else.
#
# Every `specs:` list is kept in sorted order, and a new spec goes in its sorted
# position rather than at the end. Appending put every concurrent addition on the
# same last line, so two open spec PRs in one area always conflicted here — this
# file was the single most-conflicted in the QA queue, touched by 4 of 4 open spec
# PRs at one point. Sorted insertion lands them on different lines, which git
# merges without a conflict. Nothing reads the order, so it costs nothing.
#
# Verified against main @ c54a6a99d7 (2026-07-29):
#   24 e2e specs across 13 dirs, 3 visual specs.
#
# ---------------------------------------------------------------------------
# TAG GRAMMAR (two orthogonal dimensions — see PHASE-1-FINDINGS.md Q2')
#
#   tier    exactly one of @t1-smoke | @t2-cuj | @t3-nightly     -> drives coverage %
#   suites  zero or more of @t1-stsaas | @provider-sanity |
#           @llm-daily                                       -> drives WHERE it runs
#   area    exactly one @area:<area>                             -> from `areas:` keys below
#   caps    one or more @cap:<area>.<capability>                 -> from `capabilities:` keys
#
# Why the split: optimization-studio.spec.ts is @t2-cuj + @t1-stsaas — t2 depth,
# but included in the STSaaS sanity set (deliberate: it was unstable on client
# envs) and excluded from the 3x/day t1 prod runs because each run incurs real
# LLM cost. A flat tag enum would model t1-stsaas as a fifth tier and mis-report
# this spec. Confirmed: `test:t1` greps @t1-smoke only.
#
# Allure note: Allure strips the leading `@`. `@cap:prompts.create-text` arrives
# as tag `cap:prompts.create-text` and is queryable via AQL `tag = "..."`.
# No allure.label() calls needed — verified live against project 1.
# ---------------------------------------------------------------------------

version: 1
product: opik

# ---------------------------------------------------------------------------
# DIMENSIONS — coverage is not one number
#
# A capability can be covered functionally, visually, and under load. These are
# independent questions ("does it work?" / "does it look right?" / "does it hold
# up?"), so each capability carries a per-dimension coverage state and each area
# reports one % per dimension. Never blended into a single figure.
#
# Rationale for keeping them in ONE file rather than three: the *denominator*
# (area -> capability) is shared. Splitting the file would fork the taxonomy and
# guarantee drift. Splitting the *percentages* is the actual requirement.
#
# `applicability` is what stops the load column from being dishonest. Most UI
# capabilities are not load-bearing; counting them as "0% load covered" would
# invent a 180-capability gap that nobody intends to close. Only capabilities
# marked applicable enter that dimension's denominator.
# ---------------------------------------------------------------------------

dimensions:

  functional:
    label: Functional
    source: tests_end_to_end/e2e
    tag_prefix: "@cap:"
    applicability: all            # every capability should work
    status: active

  visual:
    label: Visual
    source: tests_end_to_end/visual-tests
    tag_prefix: "@vcap:"
    applicability: opt_in         # only capabilities with `visual: {...}`
    status: active
    # Visual coverage is page/state-shaped, not behaviour-shaped: one screenshot
    # asserts a whole page renders. So visual capabilities are coarser than
    # functional ones and get their own sub-keys (see `visual:` blocks below)
    # rather than being forced onto functional capability names.
    states: [default, empty, loading, error]

  load:
    label: Load / performance
    source: tests_load            # NOTE: outside tests_end_to_end/ — see below
    tag_prefix: "@lcap:"
    applicability: opt_in         # only capabilities with `load: {...}`
    status: planned               # long-term goal; denominator defined, not yet wired
    # Load coverage is dimension-shaped, not capability-shaped. A load test
    # exercises an *axis* against a capability, so a covered load capability
    # declares which axes are exercised. Axes derived from the existing
    # tests_load/suite/python_sdk scenarios.
    axes:
      ingestion-rate:   "sustained writes/sec (test_many_traces_one_span_each)"
      fan-out:          "many children per parent (test_many_spans_per_trace)"
      payload-size:     "large single payloads (test_traces_with_one_megabyte_payload)"
      burstiness:       "spike then idle (test_burst_single_loop, test_spread_over_time)"
      concurrency:      "parallel writers sharing a client (test_concurrent_writers_share_one_client)"
      attachments:      "binary/media upload paths (test_traces_with_explicit_attachments)"
      retrieval:        "read-path latency under volume (test_trace_span_retrieval)"
      versioning-depth: "many versions of one entity (test_dataset_insert_many_versions)"

# ---------------------------------------------------------------------------
# SCOPE NOTE ON tests_load/
#
# The agreed estate is tests_end_to_end/ only, and that remains true for the
# functional and visual dimensions — the two this task ships.
#
# `tests_load/` is a real third estate in the opik repo (5 pytest scenario files
# under suite/python_sdk, run weekly by .github/workflows/load_tests.yml, cron
# '0 4 * * 0', on ubuntu-latest-m against a docker-compose stack). It reports to
# JUnit XML, NOT to Allure, so it is invisible to the Allure-joined builder.
#
# It is declared here so the schema is ready, but the load dimension is
# `status: planned` and the v1 builder MUST skip it. Wiring it up needs a
# separate decision (does tests_load report to Allure? does it get @lcap: tags?)
# and is not in scope for OPIK-7532. Flagging rather than assuming.
# ---------------------------------------------------------------------------

# Legacy bare area tags that no longer map to exactly one area. The retro-tagging
# pass replaces each with the right @area:/@cap: pair per spec, so these are
# recorded for the lint's benefit (clear message instead of "unrecognised") and
# then removed once the pass lands.
#
# @trace-explore is the interesting one: it predates the split of the Logs surface
# into `traces` and `threads`, which are distinct nav toggles with distinct
# capabilities. The three specs carrying it divide cleanly —
#   trace-explore-smoke.spec.ts  -> @area:traces
#   trace-spans-depth.spec.ts    -> @area:traces
#   thread-logging-smoke.spec.ts -> @area:threads
retired_tags:
  trace-explore:
    reason: "split into `traces` and `threads` — resolve per spec, not by rename"
    replaced_by: [traces, threads]

# Coverage-counting rules the builder must apply.
rules:
  # A capability counts as covered when a test carrying its tag passed
  # within this window. Tunable; 7d matches the dashboard's pass-rate window.
  recent_window_days: 7
  # Specs in these dirs are infrastructure, not product coverage. Excluded from
  # both numerator and denominator, and exempt from the area/cap tag lint.
  exempt_dirs:
    - _seed          # sdk-clients.spec.ts — harness self-test
  # Capabilities flagged `cloud_only: true` are excluded from the self-hosted
  # coverage view but counted in the cloud view. They depend on the out-of-tree
  # `comet` frontend plugin (PluginsStore) and cannot run self-hosted.
  cloud_only_separate_view: true
  # Report one % per dimension per area. Never a blended figure.
  report_per_dimension: true
  # What counts as PRODUCT SURFACE when attributing a release's changed files to
  # areas (consumed by the release-coverage skill in comet-ml/qa-plugin).
  # Declared here rather than in tooling because both lists are scope decisions
  # this file already owns.
  #
  # The path->area mapping ITSELF is not here: it is derived by joining the V2
  # router tree (routes resolved transitively through getParentRoute) with the
  # `routes:` on each area below, so it follows a page rename automatically and
  # is never hand-maintained.
  #
  # That join is NOT literal string equality — the two spellings diverge by
  # design, and the resolver normalises both sides before comparing:
  #   * `$param` -> `*`, so this file's `/annotation-queues/$id` matches the
  #     router's `.../annotation-queues/$annotationQueueId`
  #   * the query string is DROPPED, which is what lets one component serve two
  #     areas: `/logs?type=traces` and `/logs?type=threads` are one route
  #     (LogsPage) and two areas (traces, threads)
  #   * the `/opik` basepath is stripped
  #   * comparison is suffix-based, so a route written relative to a project
  #     matches the router's workspace-prefixed form
  # Measured against main: all 18 areas join to at least one component, and no
  # component resolves to more than two areas.
  release_surface:
    # Never product surface. A change confined to these is not a coverage gap;
    # counting them manufactures gaps and buries the real ones.
    not_surface:
      - .github/
      - tests_end_to_end/
      - .agents/
      - apps/opik-documentation/
      - sdks/code_generation/
      - scripts/
      - version.txt
      - .pre-commit-config.yaml
      - CONTRIBUTING.md
      - README.md
      - .gitignore
      - Makefile
    # Real product surface this taxonomy does not enumerate AS ITS OWN AREA — it
    # covers 18 UI areas. Changes here are reported by name, never mapped to a UI
    # area, and never scored as zero.
    #
    # "Not enumerated" is not the same as "not exercised". The e2e estate drives
    # the SDKs and the API heavily as fixtures — 11 specs use the SDK or the
    # backend client, and five capabilities are explicitly SDK-shaped
    # (datasets.create-dataset-sdk, datasets.sdk-round-trip,
    # test-suites.create-suite-sdk, test-suites.run-suite-sdk,
    # prompts.sdk-seeded-visible), all covered. What is untracked is each of
    # these as a product surface in ITS OWN RIGHT: SDK ergonomics and options
    # (num_threads, retries, error handling), REST contract details, and
    # deployment behaviour. Report those as **coverage not measured here**, and
    # say what the estate does exercise incidentally rather than implying zero.
    untracked:
      - prefix: sdks/python
        label: Python SDK
      - prefix: sdks/typescript
        label: TypeScript SDK
      - prefix: apps/opik-backend/
        label: Backend (Java API / internal)
      - prefix: apps/opik-python-backend/
        label: Python backend
      - prefix: apps/opik-guardrails-backend/
        label: Guardrails backend
      - prefix: apps/opik-sandbox-executor-python/
        label: Sandbox executor
      - prefix: deployment/
        label: Deployment / Helm
  # Tag-lint enforcement. All three are hard CI failures, not warnings.
  enforce:
    # every non-exempt e2e spec declares exactly one tier and one @area:
    tier_and_area_required: true
    # @area:/@cap:/@vcap: values must exist in this file
    tags_must_exist_in_taxonomy: true
    # every `state:` in a visual: block must be one of dimensions.visual.states
    visual_state_enum: true

# ---------------------------------------------------------------------------
# AREAS
#
# Spine = the app's own v2 nav grouping (getMenuItems.ts), which is what users
# see. `nav_group` records it so the Notion dashboard can order areas the way
# the product does.
#
# `specs:` lists CURRENT covering specs (informational — the tags are the real
# source of truth once Phase 3 lands). `covered: false` capabilities are the
# gap list the radar ranks.
# ---------------------------------------------------------------------------

areas:

  # ===================== OBSERVABILITY =====================

  traces:
    label: Traces & Spans
    nav_group: Observability
    routes: ["/projects/$projectId/logs?type=traces", "/logs?type=spans"]
    spec_dir: trace-explore   # NOTE: dir name != product vocabulary ("Logs")
    specs:
      - trace-explore/agent-graph-node-click.spec.ts
      - trace-explore/dataset-item-field-mappings.spec.ts
      - trace-explore/logs-filter-persistence.spec.ts
      - trace-explore/mcp-hint.spec.ts
      - trace-explore/sdk-track-non-error-throw.spec.ts
      - trace-explore/span-cached-token-cost.spec.ts
      - trace-explore/span-cost-resolution.spec.ts
      - trace-explore/span-kpi-cards.spec.ts
      - trace-explore/spans-view-pagination.spec.ts
      - trace-explore/trace-attachments.spec.ts
      - trace-explore/trace-bulk-tag.spec.ts
      - trace-explore/trace-delete.spec.ts
      - trace-explore/trace-explore-smoke.spec.ts
      - trace-explore/trace-filters.spec.ts
      - trace-explore/trace-id-time-window.spec.ts
      - trace-explore/trace-partial-update-merge.spec.ts
      - trace-explore/trace-spans-depth.spec.ts

    # ---- functional dimension ----
    capabilities:
      # OPEN, needs a human call: the TypeScript SDK's trace LIFECYCLE has no
      # capability of its own, and no SDK area exists to hang one on.
      # sdk-track-non-error-throw.spec.ts rides on list-traces for want of a
      # better key — what it actually asserts is that `track()` re-throws the
      # caller's own value for three non-Error throws, and still closes both
      # spans with an end_time and an errorInfo. Either add a capability for it
      # (candidate: traces.sdk-trace-lifecycle, or a new sdk area) or drop that
      # spec's tag, which today means dropping the spec — tag_lint requires at
      # least one @cap: per spec.
      list-traces:            { covered: true,  tier: t1-smoke, note: "the Logs table listing seeded traces with their count and ordering. RECORDED GAP, not a claim: sdk-track-non-error-throw.spec.ts also tags this key, and its Logs-table step asserts only that three tracked traces are listed and render a numeric duration rather than \"NA\". Do not read this key's `covered: true` as evidence about the SDK trace lifecycle those traces were written by — see the OPEN note above." }
      trace-ordering:         { covered: true,  tier: t1-smoke }
      open-trace-panel:       { covered: true,  tier: t1-smoke }
      span-tree-expand:       { covered: true,  tier: t2-cuj }
      span-model-cost-tokens: { covered: true,  tier: t2-cuj, note: "model/tokens/cost in the span panel, plus server-side price resolution: spans logged with usage and no total_cost, asserted at the API and in the panel, with two undated look-alike model ids as negative controls; also reasoning-token billing on perplexity/sonar-deep-research (the only shipped-price-table model that can observe it) — the reasoning rate applied and subtracted from the standard-output bucket, the bare OTel usage key as a fallback for the original_usage one, and both clamps; also a non-token price key (mistral/voxtral-mini-tts-latest, priced per input character) billed from usage.input_characters, against an identical span carrying the same token counts and no character count as the negative control; also the cache-read branch of resolveCalculator, as two with/without-cached-tokens pairs — one on a model that publishes no cache_read rate (gpt-5.5-pro, re-priced in 2.2.60), where the pair must price identically because every cached token is billed at the full input rate, and one on a model that does (gpt-4.1), where the discount must be exactly the rate difference; also audio INPUT tokens on gemini/gemini-embedding-2-preview (one of the six gemini-embedding-2* rows re-priced in 2.2.65), as a with/without-audio-count pair over identical token totals — the audio rate applied, the audio tokens subtracted from the standard prompt bucket rather than billed at both rates, and the premium between the pair asserted as exactly the rate difference; asserted at the API and rendered in the panel. Six more vectors land for 2.2.106 (opik#8941 and opik#8987), each a hand-seeded span read back at the API and then re-read in the trace panel against the amount the server resolved: span-cache-write-ttl-tier.spec.ts (an Anthropic cache WRITE billed at the TTL it was made at, as a 5m/1h pair either side of the 200k prompt tier — the above-tier test is test.fail(), a reproduced product defect where cache_creation_input_token_cost_above_1hr is read untiered and inverts which TTL is dearer, across 16 shipped price rows); span-cache-dialect-parity.spec.ts (one Anthropic cache usage in every client dialect, native and OTLP-ingested, surviving the write verbatim and resolving the same price); span-cross-shape-cache-keys.spec.ts (a cache key read from a shape its own provider never writes is still priced at the table rate and discounts against its twin by exactly the rate difference); span-input-includes-cache.spec.ts (two spans with identical provider usage price differently according to the SDK's outer prompt total alone, which is what says whether the input already contains the cache); span-litellm-zero-cache-read.spec.ts (a cache read reported beside another client's explicit zero is billed once, at the cache rate, rather than shadowed by the zero); span-native-usage-shape-cost.spec.ts (each provider in its own native usage dialect — Bedrock Converse camelCase priced identically to the same usage under the `bedrock` sibling, and Gemini usageMetadata pricing its cache and its thinking tokens with the google_ai alias resolving the identical amount); span-new-provider-pricing.spec.ts (six providers the removed whitelist used to drop, each priced from its own row, with a provider in no price row as the unpriced control and the trace roll-up asserted as the sum). One more vector lands for 2.2.119 (opik#9132): openrouter-span-cost.spec.ts, the first cost spec in the estate to use an OpenRouter model at all — `model_prices_openrouter.json` is now the only source for those 468 rows since LiteLLM stopped listing them, so a build that stopped reading that file entirely passed the whole estate before this. Two OpenRouter models spelled as the file keys them (`openrouter/<vendor>/<model>`) are each billed at their own row's published rates, asserted to differ from each other so neither amount is a constant and so both `resolveCalculator` branches are taken (aion-2.0 publishes a cache-read rate, nova-lite-v1 does not), beside a same-shaped model in no row as the unpriced control, at the API and then in the span panel and the Logs Estimated cost column. Its second test is test.fail(), a reproduced defect: `CostService.parseModelName` strips to the FIRST slash on the price-file key and on the span's model alike, so a row keyed three-segment lands two-segment and the TWO-segment id Opik itself writes (the picker stores the bare registry id and `ExperimentTracePersistence` writes it verbatim) strips one segment too far and matches nothing — an OpenRouter run started from Opik gets no cost, while the trace above it still rolls up a plausible-looking half of the bill. Not introduced by 9132 (LiteLLM keyed the same rows the same way) but 9132 is what made this file the source. The displayed-amount helper these share is core/money.ts, which mirrors the frontend's floor-to-cents formatCost rather than rounding" }
      # New for 2.2.111, from opik#9036. No key here covered WHICH project an
      # ingested span lands in: span-model-cost-tokens reaches the same endpoint
      # but asserts provider/cost mapping, and projects.create-project names the
      # Projects-page control, which nothing here touches — tagging it would make
      # an untested UI dialog read as covered for good.
      otel-project-routing:   { covered: false, note: "Which project an OTLP export's spans land in — the `opik.project_name` resource/span attribute, with the `projectName` header demoted to a fallback (OPIK-8888 / opik#9036). otel-project-name-routing.spec.ts covers: a resource-level name get-or-creating its project and holding the export on one trace; per-span names splitting one export across two projects; the exact 150-code-point limit, with 151 and 224 refused and falling back to the header; no attribute at all following the header; NFC and NFD spellings of one name collapsing to a single project holding one trace; the attribute being dropped from stored span metadata rather than kept; and the auto-created project's Logs Spans view agreeing with GET /v1/private/spans on both the footer total and the rendered row ids. The header-named project is read back as a bystander in every case, so a span written to BOTH projects fails. Distinct from span-model-cost-tokens, which also reaches this endpoint but asserts the pre-PR HEADER path and pins its spans to a caller-minted trace via opik.trace_id — the one thing a routing assertion must not do. NOT covered, deliberately: a multi-project export sharing ONE OTLP trace id, which on 2.2.111 intermittently answers 409 and silently drops spans (7 of 8 four-project exports lost 14 of 32 spans in exploration). It is a race rather than a shape, so every multi-project export in the spec gives each span its own OTLP trace id; the collision is reported as a defect instead of pinned, because a spec that asserts a race fails at random." }
      trace-tag-add-remove:   { covered: true,  tier: t2-cuj, note: "single-trace tagging from the panel, plus bulk tagging from the Logs table through the Manage shared tags dialog — a different endpoint (PATCH /traces/batch, not /traces/{id}) and the only one whose failure modes are about scope: the outgoing request asserted to be a single batch PATCH naming exactly the selected ids and carrying tags_to_add rather than a replacement list, three of five non-contiguous rows selected, every trace seeded with a tag of its own so a replace can be told from a merge, both bystanders asserted unchanged (one of them inside the selection's span), and the whole project swept so an over-reaching batch cannot hide behind the five named traces" }
      manual-feedback-score:  { covered: true,  tier: t2-cuj }
      score-reason-render:    { covered: true,  tier: t2-cuj, note: "how a feedback score's `reason` is RENDERED in the trace panel,  where an LLM judge's reason became newline-joined text instead of a Python list literal: the parser has SDK unit tests, the display half had nothing. Asserted as rendered text (innerText through the reason tooltip), so a collapsed newline fails; the empty-list sentinel is the single-line control beside it." }
      toggle-spans-view:      { covered: true,  tier: t2-cuj, note: "the Spans toggle and paging the table it renders: 130 seeded spans read back as an exact set through offset paging, through the /spans/search cursor and through the rendered table, plus a span whose UUIDv7 id embeds mid-2200 used as the cursor. Also the four KPI cards above the Spans table — count, error rate, avg duration and total cost — and their period-over-period deltas, asserted against the kpi-cards read for both periods" }
      # New for 2.2.90, from opik#8685's harvest (pending/8685.yaml).
      #
      # The Logs page's OPEN-ENDED window: every date-range preset ends today,
      # so `calculateIntervalStartAndEnd` returns `intervalEnd: undefined` and
      # the page sends no `interval_end` — a branch on which the read has no
      # upper id bound and a far-future UUIDv7 id counts in the current period.
      #
      # Its own key rather than folded into a neighbour. `toggle-spans-view`
      # already carries the Spans KPI cards, but it names the Spans toggle and a
      # window that ends now: its spec sends no `interval_end` yet seeds only
      # past rows, so the branch is never observable there, and the key says
      # nothing about the Traces or Threads tabs. `list-traces` names the
      # table's listing, ordering and count — not the cards above it, and not
      # their agreement with the footer, which is the regression here. Folding
      # this under either would retire the question permanently.
      logs-open-ended-window: { covered: false, note: "A date-range preset ending today sends no interval_end, on the kpi-cards read and on the chart's metrics read alike: the KPI cards, their period-over-period deltas and the table footer then report one population including a row whose UUIDv7 id instant is mid-2200, on the Traces, Spans and Threads tabs. Pinned against the same seed read with interval_end = now, where every current-period number differs and the prior period is identical" }
      filter-traces:          { covered: true,  tier: t2-cuj }
      # New for 2.2.94, from the release pass's own exploration of opik#8797.
      #
      # Where the trace panel's tree puts a span whose `parent_span_id` names a
      # span that is NOT in the loaded set. `TraceTreeViewer` attached such a
      # span to nothing and rendered it nowhere, while "Spans (n)" went on
      # counting it — a panel that says five and shows four, with no error.
      #
      # Its own key rather than folded into `span-tree-expand`, which the
      # exploration's candidate came closest to. That key is the tree's
      # expand/collapse behaviour over a connected hierarchy, and it is already
      # `covered: true` — carried by trace-spans-depth.spec.ts and by
      # span-read-mapping-and-parent-guard.spec.ts, BOTH of which seed fully
      # connected trees and so have no orphan to lose. Folding this under it
      # would retire the question permanently while nothing had tested it. Not
      # `toggle-spans-view` either, which the candidate proposed: that names the
      # Logs page's Spans TAB and the table it pages, a different surface from
      # the panel's span tree.
      #
      # Deliberately names the tree's SHAPE and not the hidden-spans toggle. The
      # eye control is driven here only because the two tree modes are the two
      # code paths the fix unified; what a reader should take from this key is
      # that an unresolvable parent lands at the trace root, in both modes.
      orphan-span-at-trace-root: { covered: false, note: "A span whose parent_span_id names an id that was never written renders at the TRACE root rather than vanishing, in both tree modes, with the Spans (n) label agreeing with the tree in each. Asserted as a depth map over the whole tree read from each node's paddingLeft (the row element is absolute left-0, so every node reports the same bounding-box x and a position-based measure would find the whole tree at depth 0), compared whole so a missing node — the regression — an extra node, and a tree flattened to the root all fail distinctly. The fixture proves it can discriminate before the browser opens: it asserts over the API that the server stored the dangling parent VERBATIM, since a backend that nulled it would make the orphan an ordinary second root span and the tree builder would never reach the branch under test. Show-all is the discriminating half — pre-fix, excludeHiddenSpans blanked a missing parent as a side effect, so hide mode reached the root anyway; the hiding test guards that removed side effect, plus the re-parenting of a hidden span's child to its nearest visible ancestor, and the round trip back through the toggle. Not covered: an orphan whose own parent chain is several unwritten levels deep, and the tree's search/filter modes" }
      # New for 2.2.93, from the release pass's own exploration of opik#8767.
      #
      # The Logs page's "Search by anything" box and the `search` param behind
      # it — `ilike('%term%')` across a trace's id/name/input/output/metadata/
      # error_info/tags/thread_id and a span's id/trace_id/name/type/input/
      # output/metadata/tags/model/provider — plus the week pre-pass opik#8767
      # put in front of it, which bounds the scan to the weeks the project
      # actually holds rows in.
      #
      # Its own key rather than folded into `filter-traces`, which the
      # exploration's candidate reached for. That key is the structured filter
      # CHIPS: its three specs (trace-filters, trace-source-merge,
      # span-quick-filter-routing) build `traces_filters` entries and never
      # render `search_text`, so they cannot reach this branch at all — and
      # `filter-traces` is already `covered: true`, so folding search under it
      # would retire the question permanently while nothing had tested it.
      #
      # Deliberately names BOTH surfaces, because one spec drives each: the two
      # API-level tests assert the listing, the page walk and the stats on
      # traces and on spans, and the third types into the box and asserts the
      # table agrees with the API for the identical term.
