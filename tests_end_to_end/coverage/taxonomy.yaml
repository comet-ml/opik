      configure-model-settings:  { covered: true,  tier: t2-cuj, note: "PromptModelSettings / providerConfigs. Anthropic sampling (playground-model-parameters.spec.ts): the sampling pair is a single choice with exactly one mounted slider, and the displayed Top P and a non-default Thinking effort are asserted against the outbound chat/completions body, which must carry top_p, no temperature, the effort under custom_parameters.output_config.effort and no flat thinking_effort. As of 2.2.106 the panel is also covered on other providers, all on the Max output tokens control and the OpenAI/OpenRouter parameter gates: playground-max-output-tokens-range.spec.ts (the ceiling comes from the selected model rather than one flat per-provider cap — asserted as a RELATION, since the pricing artifact is generated — and typing past it commits to exactly the ceiling in the panel AND sends it in the body; the fallback case for a model the pricing data omits is marked test.fail() because no dropdown-visible OpenAI model reaches that branch); playground-max-output-tokens-model-switch.spec.ts (a stored value re-clamped when the switched-to model has a lower ceiling); playground-max-output-tokens-no-limit.spec.ts (0 means no limit on the providers that take it, and the cap is dropped from the body rather than sent as 0); playground-openai-effort-pipeline-mode.spec.ts (the Max reasoning effort is offered only while the key is on the Responses API); playground-openrouter-native-model-parameters.spec.ts (an OpenRouter-routed OpenAI reasoning model loses both sampling and both penalty controls, Gemini 3 loses sampling and keeps the penalties, a :batch routing suffix is stripped for the native lookup and kept in the request, and the gate keys off the native model list rather than the registry's reasoning flag). Still uncovered: the throttling/concurrency sliders, settings surviving a prompt reload, and the proxy-to-Anthropic hop" }
