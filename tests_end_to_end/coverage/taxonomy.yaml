      free-text-search:        { covered: false, note: "Free-text `search` over threads, asserted as EXACTNESS rather than membership on a seeded 12-thread project (7 carrying one marker in their trace's input and a DIFFERENT marker in its output, 5 decoys carrying neither, one trace and one usage-carrying llm span per thread): the thread-id SET and the envelope's `total` both pinned, each marker asserted separately because each sits on one column only — so a clause that lost `input` or `output` fails one step and passes the other — each thread's own per-column token resolving to exactly its one thread, /traces/threads/stats agreeing with the listing under each search and without one (an independently written query, read through numericStat so an empty stats list cannot pass as a zero), and a trace NAME searched as the negative control, which must return nothing because the thread clause does not read it. The fixture proves it can discriminate before writing: the clause matches `thread_id`, and the ids are built from the run prefix and the test's own title, so it asserts no marker occurs in any thread id and that each token occurs in exactly one thread's searchable text. Searched rows are also asserted to still carry number_of_messages, duration, total_estimated_cost and usage, since the right ids with empty aggregates is a blank table no count assertion would notice. The UI half types into the box and asserts the footer total, the rendered row set and every decoy's absence against the API's answer for the same term, then that clearing it restores the project; and pins, as the one place two numbers on this page legitimately disagree, that the KPI count card above the table does NOT narrow — `useProjectKpiCards` takes the chip filters and the window and no `search`, so it stays a project-level overview while the footer is the searched total. NOT covered, and not claimed: the week bound itself — the Threads tab excludes the `alltime` preset so its read is always windowed, and an environment running UUIDv7 validation in reject mode with a sub-week window (staging: PT24H) refuses backdated ids, so every row is seeded at `now`; driving the bound needs uuidValidation.auditOnly=true. Also not covered: search composed with a thread filter chip, and a multi-turn thread's aggregate under a search" }
