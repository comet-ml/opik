      message-role-media:        { covered: false, note: "Media lives only on user messages, and the two doors to that rule agree. Library load (playground-load-media-prompt-by-role.spec.ts): loading a version whose content is text plus an image, a video and an audio part keeps the whole content on a User row with no toast, and lands the text alone — as a plain string, with no media tag and the editor showing it — on a System and on an Assistant row, each raising exactly one 'Media not loaded' toast. Role switch (playground-media-prompt-role-switch.spec.ts): switching an already-loaded User row to System strips the media parts in place, keeps both rows, and stays silent. Both specs assert the loaded-version chip shows NO unsaved-changes dot and the save tooltip still reads 'Save to prompt library' — the dirty check is role-aware, so a drop the user did not ask for is not reported as their unsaved edit — and both prove that absence can flip by typing into the row. Both also read the version back over the API to show the drop is client-side only. Not covered: what SAVING a system row after the drop writes to the library (changed behaviour the exploration flagged for a product decision, deliberately not pinned), the media-only and text-only content variants, and the Optimizations new-run composer, which mounts the same component with `disableMedia` and keeps media invisibly on a user row (pre-existing, unchanged by this PR). Riding on this key since 2.2.119, and NOT what it names — see the OPEN note above: playground-openrouter-media-gate.spec.ts (opik#9132), the MODEL-side gate. A native vision model takes an image-only prompt and a genuinely non-vision OpenRouter model refuses it, so the gate is shown to be on and discriminating, and the vision model's own token ceiling is read out of the parameters panel to establish that this build really does hold its price row (the ceiling and the modality flags come from the same row of the same file, and `getOpenRouterMaxTokensLimit` falls back to a flat 10000 when it finds no row). Its second test is test.fail(), a reproduced defect: opik#9132 gave `getMaxOutputTokens` an OpenRouter-aware `getOpenRouterMaxOutputTokens` that prepends `openrouter/` before the lookup, but `supportsImageInput` got no such sibling, so a row keyed `openrouter/amazon/nova-lite-v1` is never found, `supports_vision: true` is read as false, and a vision model will not take a picture with no hint that the refusal is wrong. The image is seeded as an image and nothing else because `hasUnsupportedMedia` is a disjunction over images, videos and audio, so the all-three mediaPrompt fixture is refused by every model alive including the control." }
