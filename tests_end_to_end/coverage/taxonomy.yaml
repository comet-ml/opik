      #   Tagging navigation onto it would read as that axis being covered.
      #
      # Both would have been stretched, and a capability counted as covered is
      # never re-derived — so the UI nobody tested would read as tested for
      # good. The thing actually asserted is the ROUND TRIP, which spans both
      # call sites and is one implementation (parseExperimentReturnHref +
      # ViewInExperimentButton), so it is one key covered by two specs rather
      # than two keys.
      return-to-experiment:    { covered: false, note: "Getting back to the experiment from an evaluation item (OPIK-8600). Both call sites: the compare row-detail panel's dataset-item tag (CompareExperimentsPanel, dataset method) and the evaluation-suite sidebar's 'View evaluation item' tag (TestSuiteExperimentPanel) each carry the originating compare view in `from`; the items page that lands reads it back as a 'Back to experiment' button restoring that view's WHOLE search, and the item side panel grows an 'Experiment' button that reopens the compare view on the item the PANEL is showing rather than the one `from` was built with. Asserted on exact search params, since a back button that returns to a compare view with its filters or search dropped looks perfectly healthy. Reject path covered on both pages: an absent, off-site, protocol-relative or in-app-non-compare `from` falls back to 'Back to datasets'/'Back to test suites' with no Experiment button, against a good `from` on the same page as the control; plus the valid-compare-`from`-carrying-no-`experiments` middle case, where the back button still resolves while the Experiment button is correctly hidden. Pins both tooltip branches — plural over two experiments on the dataset side, singular over one on the suite side. The non-root-basepath branch of parseExperimentReturnHref is covered too, as of the 2.2.93 release pass: on a deployment served under a path prefix whose workspace name STARTS WITH that prefix (staging's opik-testing under /opik — the 'opik-demo under /opik' shape the helper's own comment names), the honoured href is asserted VERBATIM, so a basepath stripped by string prefix cannot pass as a plausible-looking one; beside it the reject cases a basepath makes possible — the same compare route with the basepath stripped, a protocol-relative URL whose host is the basepath segment, a backslash-escaped off-site URL, and an in-app non-compare path under the basepath as the discriminator — each asserted on the label AND on the href staying inside the app origin, since a button labelled 'Back to datasets' that still pointed off-site would satisfy a label-only check. That test states the deployment shape as a precondition and skips where it does not hold, because on a root-served install the guard never evaluates its basepath check at all and every case would be decided for another reason. NOT covered, and not claimed: the canViewExperiments: false permission gate (this OSS install grants everything), which has vitest coverage." }
      insights-tab:            { covered: false }
      configuration-tab:       { covered: false }
      # Whether a scoring metric in an evaluate() run computes with the LOCALE
      # it was configured with, and rejects one it cannot honour. Its own
      # capability rather than part of per-item-scores, which is about scores
      # reaching an experiment's items and rendering against them — that key is
      # satisfied by any number at all, whereas this one is about the number
      # being RIGHT, and its failure mode is silent: before opik#8318 every
      # Readability locale quietly scored as en_US, so a regression changes
      # stored score values without any error. Scoped to the metric's own
      # contract, asserted through the Python SDK: several locales scored in
      # ONE evaluate() run (which is what reaches textstat's module-wide locale
      # state from the scoring thread pool) stay distinct from each other AND
      # equal to their own uncontended sequential score, and an unknown locale
      # raises a MetricComputationError naming the language instead of pyphen's
      # bare KeyError. Deliberately NOT asserted on absolute Flesch numbers,
      # which drift with textstat/pyphen releases.
      metric-locale-scoring:   { covered: false }
      # Reading an experiment's items back through the Python SDK
      # (`Experiment.get_items()`), as opposed to writing them or reading them
      # through the compare grid. Its own capability rather than part of
      # per-item-scores: the read carries no scores, and OPIK-8274 rewrote it
      # into concurrent paged waves, which is a correctness surface — dropped,
      # duplicated or reordered rows — that no score assertion would reach.
      experiment-item-read:    { covered: true,  tier: t2-cuj }
      # Walking the compare Results tab's paged read
      # (GET /v1/private/datasets/{id}/items/experiments/items) across every page
      # of a large experiment. Its own capability rather than part of
      # experiment-item-read, whose note scopes that key to the Python SDK's
      # Experiment.get_items(), and rather than part of compare-side-by-side,
      # which is about two experiments in one row: what is asserted here is that
      # consecutive pages are an exact, correctly-paired, correctly-ordered
      # partition at the SHIPPED DEFAULT page size (2,000) and at a non-zero
      # OFFSET — the un-aggregated (push_top_limit_raw) branch opik#8575/#8578
      # rewrote, where a row silently dropped at a page boundary renders as
      # plausible data on the view people read to pick an experiment.
      compare-deep-paging:     { covered: false }
      # The compare grid's LAYOUT, as opposed to the data in it — added for
      # opik#8510, which pins the experiment-name column beside the select
      # column. Not part of compare-side-by-side, which is about two experiments
      # agreeing or disagreeing in one row, and NOT the same thing as the visual
      # `compare-view` key below: that one is a screenshot baseline owned by the
      # visual suite, while this is asserted as computed style and geometry — the
      # Name cells' x unchanged through a horizontal scroll that is itself proven
      # to have moved the columns, and the inset border drawn by the pinned cell
      # AND by each sub-row band inside it (main.scss extends the rule to
      # `.comet-pinned-last-left [data-virtual-row-id]` because an inset shadow
      # paints beneath its element's children).
      compare-name-pinning:    { covered: false }
      # Hovering one experiment's sub-row in the compare grid highlights that
      # sub-row and not its sibling — the other half of opik#8510, and a
      # different code path from the pinning above
      # (`VerticallySplitCellWrapper`'s onMouseEnter/onMouseLeave, driven through
      # the table's `subRowHighlightColor` meta). Its own key because a reader
      # can lose track of which experiment a band belongs to either way, but only
      # one of the two is about scrolling. Asserted as "the hovered band is
      # painted and the sibling is not", in both directions, rather than against
      # a literal design token.
      compare-sub-row-hover:   { covered: false }
      logs-tab:                { covered: true,  tier: t1-smoke, note: "experiment traces inline; replaced the Go to logs tag" }
      export-comparison:       { covered: true,  tier: t2-cuj, note: "browser export off the compare Results tab, asserted on the downloaded file: an unscoped export covers the whole result set untruncated and carries both compared experiments' outputs, filter/search/sort scope and order it, a row selection narrows it and clearing restores it. NOT covered: the over-the-cap disabled state (EXPORT_ROW_LIMIT is 2,000, and seeding past it costs far more than the assertion is worth), and the CSV format — only JSON is read back" }
      # New for 2.2.122, from the release pass's own staging exploration of
      # opik#9211. `coverage/pending/` held nothing this release.
      #
      # Its own key because no experiments capability named status or cancel at
      # all — the 2.2.122 release coverage report flagged exactly that under
      # "Denominator notes", and the exploration withheld its candidate for want
      # of an honest tag rather than stretch a covered one.
      #
      # Not folded under `list-experiments` or `logs-tab`: both are already
      # `covered: true` at t1 and are about an experiment being LISTED, which
      # any status at all satisfies. Not `delete-experiment` below either — a
      # stop is not a removal; the run keeps its items and the outcome it
      # earned up to the mark, which is the whole difference. And not an
      # `experiment-item-read` matter: that key is scoped by its own note to
      # `Experiment.get_items()`, and nothing it asserts reads the run's
      # lifecycle.
      #
      # The backend behaviour predates 2.2.121; what 9211 shipped is the
      # generated client surface over it, which is what makes it this release's.
      cancel-run:              { covered: false, note: "Stopping a run and the lifecycle a stop writes — status, finished_at, and the generated client bindings opik#9211 added over them (`cancel_experiments(ids)`, `Experiment.finished_at`, the fourth `ExperimentStatus` member `failed`). Driven as two variants of ONE `/experiments/execute` dispatch over a 120-item dataset so the sibling is a bystander from the same queue: the stopped one settles `cancelled` with a finished_at at or after its created_at and strictly fewer items run than it was given, while the sibling runs every item to `completed` — which is what tells 'the stop took the experiment it named' apart from 'the stop took the whole dispatch'. Also pins that a 204 from the endpoint is NOT confirmation: against an experiment stored as `running` that this service never queued (`itemPublisher.isTracked` false), the stop is accepted and the status is unchanged after a settling window. The status field is asserted on the WIRE before the SDK is asked the same question, since `ExperimentStatus.fromString` falls back to COMPLETED for an unrecognised value — so a member dropped from the enum would be accepted on write and read back as `completed` with no error anywhere. NOT covered, and not claimed: any UI. The Experiments table has no status column (it consumes `status` only to decide whether a row's metric cells shimmer), and the Stop control itself is the Playground's, covered by playground/playground-stop-run.spec.ts. Also NOT covered: the TypeScript half of 9211's regen — the estate pins `opik@^2.2.74` from npm, 48 patch versions behind the client this release ships, so `sdkClient.typescript` has neither binding; bumping that pin is 160 specs' seeding path and stays on the manual list. And not the `failed` status as a run REACHES it — it is seeded here, because what a run whose items all error lands on is the product's decision rather than the seed's." }
      delete-experiment:       { covered: true,  tier: t2-cuj }

    visual:
      experiments-page:   { covered: true,  state: default, spec: "visual-comparison.spec.ts 06" }
      experiments-empty:  { covered: true,  state: empty,   spec: "empty-states.spec.ts E05" }
      compare-view:       { covered: false, state: default }

    load:
      experiment-item-bulk:
        covered: false
        axes: [ingestion-rate, payload-size]
        note: "backend exposes ExperimentItemBulkUpload; no load scenario yet"

  annotation-queues:
    label: Annotation queues
    nav_group: Evaluation
    routes: ["/projects/$projectId/annotation-queues", "/annotation-queues/$id", "/$workspaceName/sme"]
    spec_dir: annotation-queues
    # Was the one dir<->tag mismatch (@annotation-queue singular). Normalised to
    # plural @annotation-queues so dir == area == tag holds everywhere.
    # opik PR #7676.
    #
    # BUILDER: Allure results predating that merge carry tag "annotation-queue";
    # results after it carry "annotation-queues". Accept both when querying, or a
    # 7-day window spanning the merge reports a false gap.
    tag_aliases: [annotation-queue]
    specs:
      - annotation-queues/annotation-queue-automation-config.spec.ts
      - annotation-queues/annotation-queue-delete.spec.ts
      - annotation-queues/annotation-queue-item-search.spec.ts
      - annotation-queues/annotation-queue-scoring.spec.ts
    capabilities:
      score-queue-item:        { covered: true,  tier: t2-cuj }
      score-with-reason:       { covered: true,  tier: t2-cuj }
      skip-item:               { covered: true,  tier: t2-cuj }
      scores-reach-traces:     { covered: true,  tier: t2-cuj, note: "SDK-verified" }
      list-queues:             { covered: false }
      create-queue:            { covered: true,  tier: t2-cuj }
      edit-queue:              { covered: false }
      # Second case in this spec is a test.fail() known failure for OPIK-7903
      # (deleted-queue URL loads forever instead of showing a not-found state).
      # Fixing that bug turns the run red until the annotation is removed.
      delete-queue:            { covered: true,  tier: t2-cuj, note: "row-actions delete; sibling queue + source traces asserted to survive; deleted-queue URL known-failure OPIK-7903" }
      queue-configuration-tab: { covered: false }
      add-traces-to-queue:     { covered: true,  tier: t2-cuj }
      # New for 2.2.90, from opik#8687's harvest (pending/8687.yaml).
      #
      # Both name the AUTOMATED fill, which is what #8687 turned on by default.
      # `add-traces-to-queue` and `create-queue` above are already covered by
      # the manual-add and config round-trip specs, and neither says anything
      # about automation: a queue that stopped filling itself would leave both
      # green. Folding these under them would retire the question permanently.
      automated-queue-fill:    { covered: false, note: "A feedback score matching the queue's condition routes its trace in with source 'automated', and a non-matching score keeps its trace out" }
      automation-max-items:    { covered: false, note: "max_items_in_queue caps automated adds (deterministically, lowest ids first) while a manual add still bypasses the ceiling; the list's Automation cell reads 'Cap reached'" }
      # New for 2.2.120, from the release pass's own exploration of opik#9079.
      #
      # Its own key, and deliberately NOT `sme-flow`. That key is the SME route
      # rendering a queue's items, and it is where the trace-queue annotation
      # journey is now asserted; this is the SandboxedView + v1-kit layer
      # underneath it — a stored HTML view, its fallback when it cannot render,
      # and the Trusted Types block that stops it writing markup. Those have
      # three different failure modes from "the route renders", and two of them
      # are silent, so folding them under `sme-flow` would retire the question
      # permanently while nothing had tested the sandbox.
      #
      # Not an `ollie` key either, though `assistantBridge` shares the same
      # SandboxedView: the authoring path is Ollie's, the rendering contract is
      # the annotation queue's, and this covers only the second.
      custom-annotator-view:   { covered: false, note: "A queue's `annotator_view`: a stored kit v1 view renders inside iframe[title=\"Annotator view\"] (sandbox=allow-scripts) showing that item's own input/output fields and REPLACING the default Input/Output blocks, with the queue-detail header carrying the 'Custom annotator view' tag; a view that never calls kit.mount is replaced by the default view with the 'custom view failed to load' alert rather than left as a blank frame; a view that assigns innerHTML is blocked and replaced, with the same marker asserted to render first through the kit's safe `text:` path as the control, so the marker's absence is the block rather than an unrenderable value; and `html: ''` reads back as null with the header tag gone and no failure alert. Views are PATCHed over REST, not authored: the dialog's only authoring path is Ollie, so 'can a human write one' is NOT covered, and neither is the create/edit dialog's annotator-view card, the thread surface's SandboxedAnnotatorThreadView, the Ollie proposal path, or the preview page." }
      sme-flow:                { covered: false, note: "/sme route, dedicated layout. Two specs reach /sme. sme-thread-internal-traces.spec.ts asserts the route's own layout on a THREAD queue — the welcome page naming the queue, Start annotating, and the thread view's internal-trace toggle and Internal badge (opik#9073). sme-trace-queue-annotation.spec.ts asserts the TRACE queue path (opik#9079), which mounts a different viewer: each stop shows the item's own input/output and no sibling's, the Trace: header names that item, and the scores a reviewer submits are read back off the source traces by id — exactly the graded items, at the values given, with the skipped one carrying none and the queue still holding every item. That spec also carries score-queue-item and scores-reach-traces, so the submit path through the SME layout is no longer invisible. STILL NOT covered here: score-with-reason and skip-item through this layout (both are asserted only on the project-scoped admin route, annotation-queue-scoring.spec.ts — the middle stop above is advanced past with Next, which is not the Skip action), and the completion view after the last item. Read this key as 'the SME route renders and a trace queue can be graded through it', not 'the whole SME journey works'." }
      export-annotated-data:   { covered: false }

  # ===================== PRODUCTION =====================

    visual:
      annotation-queues-empty: { covered: true,  state: empty,   spec: "empty-states.spec.ts E10" }
      annotation-queues-list:  { covered: false, state: default }
      queue-detail:            { covered: false, state: default }

  online-evaluation:
    label: Online evaluation
    nav_group: Production
    routes: ["/projects/$projectId/online-evaluation", "/$workspaceName/automation-logs"]
    spec_dir: online-evaluation
    specs:
      - online-evaluation/online-evaluation-delete-rule.spec.ts
      - online-evaluation/online-evaluation-edit-rule-preserves-model-parameters.spec.ts
      - online-evaluation/online-evaluation-enable-disable-rule.spec.ts
      - online-evaluation/online-evaluation-experiment-scope-hidden-filters.spec.ts
      - online-evaluation/online-evaluation-json-looking-judge-prompts.spec.ts
      - online-evaluation/online-evaluation-judge-prompt-round-trip.spec.ts
      - online-evaluation/online-evaluation-llm-judge-provider-failure.spec.ts
      - online-evaluation/online-evaluation-non-object-sections.spec.ts
      - online-evaluation/online-evaluation-oversized-payload.spec.ts
      - online-evaluation/online-evaluation-provider-error-classification.spec.ts
      - online-evaluation/online-evaluation-python-metric-errors.spec.ts
      - online-evaluation/online-evaluation-python-score-usability.spec.ts
      - online-evaluation/online-evaluation-sampling-rate.spec.ts
      - online-evaluation/online-evaluation-smoke.spec.ts
      - online-evaluation/online-evaluation-thread-judge-provider-failure.spec.ts
      - online-evaluation/online-evaluation-thread-scope-batch-close.spec.ts
    capabilities:
      create-llm-judge-rule:   { covered: true,  tier: t1-smoke }
      llm-judge-scores:        { covered: true,  tier: t1-smoke, note: "bimodal safe/unsafe; t2 also covers provider-failure classification (OPIK-8262) — a permanent status costs exactly one upstream call, a transient one the whole retry budget, and neither writes a score; t2 also pins the no-score half on EVERY deployment (online-evaluation-llm-judge-provider-failure.spec.ts), where a refused judge leaves the trace carrying its control rule's score and nothing else — the classification spec needs the host-run mock gateway and so can only make that claim on oss" }
      create-python-rule:      { covered: true,  tier: t1-smoke }
      python-rule-scores:      { covered: true,  tier: t1-smoke, note: "deterministic 3x1.0 / 2x0.0; t2 also covers sub-path mappings over non-object sections and the 400-class classification of a metric that exits 0 without a result line; t3 covers a span-scope rule still scoring the spans logged AFTER a 21M-character span, which is the OPIK-8164 wedge — the oversized span's own score is deliberately not asserted, since whether it is scored depends on the deployment's Jackson stream-read limits; t2 also covers the THREAD-scope metric contract, where the runner hands the metric the whole conversation positionally instead of a mapped argument map (online-evaluation-thread-scope-batch-close.spec.ts); t2 also covers per-score USABILITY (online-evaluation-python-score-usability.spec.ts), which is a different question from every clause above — those all ask whether the evaluator ran, this asks which of a run's scores survived: four rules judge one trace, so a ScoreResult(value=None) and a scoring_failed=True 0.0 each answer 400 once and store nothing, a mixed list keeps its usable score while naming each dropped one by its own cause on the rule log, and a deliberate 0.0 still lands — the flagged and the deliberate zero being the same number on the same trace is what separates over-dropping from under-dropping; t2 also covers the RUNTIME the metric runs in rather than its logic (online-evaluation-python-dependency-imports.spec.ts), which every clause above is silent on — they all send metrics importing nothing but opik's own lightweight stubs, so none asks whether the interpreter executing one can import its own dependency set. That metric imports at module scope the eight pins the sandbox-executor image ships for the first time at 2.2.108 (the aiohttp/yarl pair #9072 fixed, plus multidict, idna, urllib3, fsspec, pydantic_settings, pytest), which is where a broken pin aborts the module and the rule stores NO score at all rather than an error — the trace panel just renders one fewer row. Deployment-agnostic by construction and needs no configuration to be: on PYTHON_CODE_EXECUTOR_STRATEGY=process it pins the python-backend's dependency set, on docker (what Opik Cloud runs) the sandbox executor's, which nothing else in the estate reaches at all. It asserts no version number — the runtime fingerprint is attached as a diagnostic, since every field in it moves on a routine pin bump. litellm and the real opik package are deliberately outside the import set: neither completes inside the 3s PYTHON_CODE_EXECUTOR_EXEC_TIMEOUT_IN_SECS, so importing either asserts the timeout rather than importability" }
      scores-in-trace-panel:   { covered: true,  tier: t1-smoke, note: "t1 reads an LLM-judge score's value back off the panel; t2 also pins the row set by EXHAUSTION on a trace whose rules dropped scores server-side (online-evaluation-python-score-usability.spec.ts) — exactly two rows for two stored scores, addressed by data-row-id, with no row for any of the four dropped names, so a panel that rendered a score the backend refused fails here; t2 also reads the panel row back for a metric whose module-scope imports are themselves the thing under test (online-evaluation-python-dependency-imports.spec.ts), where that single row is the exact artefact a failed dependency import removes without reporting anything" }
      list-rules:              { covered: true,  tier: t2-cuj, note: "project-scoped and workspace-wide listing over a project holding six bracket-opening judge prompts, plus the rules page rendering a row for each" }
      # Now true, and only because BOTH halves are exercised — which is what the
      # previous note here was holding out for. Span scope:
      # online-evaluation-oversized-payload.spec.ts (t3). Thread scope:
      # online-evaluation-thread-scope-batch-close.spec.ts (t2), which creates a
      # trace_thread_user_defined_metric_python rule, reads the discriminator
      # back, and drives it end to end through a batch close. `tier` records the
      # stronger of the two.
      #
      # Thread scope is covered twice over, and deliberately: batch-close pins
      # the SUCCESS path of the python metric shape, and
      # online-evaluation-thread-judge-provider-failure.spec.ts (t2) pins the
      # FAILURE path of the OTHER thread-scope rule shape
      # (trace_thread_llm_as_judge). Neither subsumes the other — a fold that
      # kept one sibling's failure, or one that never terminated the message,
      # is invisible to a spec whose provider answers.
      rule-scope-thread-span:  { covered: true,  tier: t2-cuj, note: "span/thread scope flags, both halves covered: span scope by online-evaluation-oversized-payload.spec.ts (t3), thread scope by online-evaluation-thread-scope-batch-close.spec.ts (t2) — six threads closed in ONE PUT /threads/close, each carrying exactly one score, with a mid-batch thread whose metric raises scoring nothing while its siblings do. Scoped: since #8162 the close fans out to one stream entry PER thread id, so what the spec pins is the grouped publish reaching every sampled id, not a scorer walking a multi-id message. A duplicate score WRITE is not observable — thread feedback scores upsert by name, so 'exactly once' is asserted as exactly one stored row per thread, held across a quiet period, not as insert multiplicity. Thread scope is also covered for the trace_thread_llm_as_judge shape by online-evaluation-thread-judge-provider-failure.spec.ts (t2), over an unreachable provider: two threads closed in one call, each reporting its OWN provider failure exactly once and neither carrying a thread score. Rule filters on either scope are a different key (rule-filters) and are still uncovered" }
      # The selection half is now covered, and this note previously said it was
      # not. What it asked for was "a spec that logs one matching and one
      # non-matching trace and asserts only the matching one is scored"; that is
      # online-evaluation-duration-filter-selects.spec.ts, added for 2.2.86. It
      # runs at trace scope rather than the PRODUCTION scope this note once
      # named — that stipulation was about reaching a scope where the dialog
      # RENDERS the filters, which matters for driving a filter through the UI
      # and not for asserting which traces a stored filter selects.
      #
      # So the key is no longer resting on persistence alone, which is what
      # would have made it the permanent false green TESTING-TAGS.md warns
      # about. Both halves are named in the note below, separately, because they
      # fail independently.
      rule-filters:            { covered: true,  tier: t2-cuj, note: "Two halves, both covered. PERSISTENCE: a trace-scope rule seeded over REST at trigger_scope=experiment with a non-default sampling_rate and one name/contains filter, saved through the rule editor after an unrelated edit, since Save stays disabled until something changes (online-evaluation-experiment-scope-hidden-filters.spec.ts, t2). FilteringSamplingCard returns null at that scope, so both fields are persisted state the user cannot see while editing (the shape a form silently drops or re-defaults), and the spec asserts the outbound PATCH body as well as the read-back, since 'dropped then re-defaulted' and 'preserved' are indistinguishable after the fact; the seconds/milliseconds conversion on a duration filter is pinned the same way, outbound body and repeated saves that do not touch the filter, by online-evaluation-duration-filter-units.spec.ts (t2). SELECTION: a duration-filtered rule scores the slow trace and leaves the fast one alone, against an unfiltered control rule that scores both, with the fast trace's whole score set compared by exhaustion after it settles (online-evaluation-duration-filter-selects.spec.ts, t2); that control is what turns the absence into evidence rather than a dead evaluator. Still uncovered: selection on any field other than duration, and filters at thread scope" }
      sampling-rate:           { covered: true,  tier: t2-cuj, note: "50% rule vs 100% control over one 30-trace batch, binomial band 15-85%; plus a 0%-rate rule at trigger_scope=both, which must skip every SDK trace and still score experiment/playground/optimization ones" }
      clone-rule:              { covered: false }
      # Scoped, and the three parts are not equally scoped:
      #   - plain-string prompt: the edit dialog IS opened, its hydrated prompt
      #     asserted byte-exact, and submitted unchanged, so the UI save round
      #     trip is real.
      #   - content_array prompt: API-level only. The dialog renders no image
      #     part, so the url/detail that a regression would drop are not
      #     observable in the UI; that half is a read-then-write over REST and
      #     no dialog gesture is made.
      #   - model custom_parameters: the edit dialog IS opened and submitted
      #     with no field changed, asserting the model's custom_parameters
      #     survive — the payload the form serializes AND the persisted blob.
      # Editing a FIELD through the dialog (renaming, changing the model,
      # rewriting the prompt, changing variables or scope) is still uncovered by
      # all three.
      #
      # OPEN, needs a human call: the content_array test asserts judge-message
      # content-SHAPE preservation, which no capability in this area names. It
      # rides on edit-rule for want of a better key. Either add a capability for
      # it or drop that tag and leave the behaviour honestly uncovered — do not
      # let it sit here as a silent widening of edit-rule.
      edit-rule:               { covered: true,  tier: t2-cuj, note: "rule editor side panel; Save stays disabled until something changes, so each re-save flips the Enabled switch. plain-string prompt: editor hydration + re-save that leaves the prompt alone, byte-for-byte on the server; content_array prompt: API-only read-then-write re-save, no editor gesture; model custom_parameters: rule seeded over REST, re-saved through the editor, PATCH body and persisted blob both asserted to carry the thinking block and an unrelated free-form key. Two fields are also EDITED through the editor rather than only re-saved — the judge model (online-evaluation-edit-rule-model-switch-effort.spec.ts: a switch within Anthropic strips the stale thinking effort and keeps the other free-form keys, a switch across providers clears custom_parameters wholesale, a switch onto a Claude model with a narrower list refits the effort, each read off the dropdown, the outbound PATCH and the persisted blob, with a save that makes an unrelated edit instead of switching the model as the control that holds the three apart — the editor keeps Save disabled until something changes, so a literally unedited save is not a gesture the product offers), and the sampling rate (online-evaluation-sampling-rate-reset.spec.ts: the reset arrow is mounted but hidden and not hit-testable at the default, restores 100% without writing the rule — asserted as zero PATCHes against a deliberate save that the same observer does see — and does not change the control row's height when it appears). Editing a judge's PROMPT through the editor is still uncovered" }
      enable-disable-rule:     { covered: true,  tier: t2-cuj, note: "rule editor Enabled switch; control rule proves scoring stopped, then resumed" }
      delete-rule:             { covered: true,  tier: t2-cuj, note: "row kebab delete; control rule proves scoring stopped" }
      # Flipped by three specs that open the /$workspaceName/automation-logs PAGE
      # itself (AutomationLogsPage) and assert the rendered rows — not, as the
      # API-only specs do, the GET /automations/evaluators/{id}/logs stream
      # behind it. That distinction is why this key stayed false while
      # online-evaluation-python-metric-errors.spec.ts asserted the same stream.
      #   - thread-judge-provider-failure.spec.ts: ERROR rows, one per failed
      #     thread and no others — the row set is pinned by exhaustion. Its
      #     provider is the backend's own discard port, so it needs nothing from
      #     the test runner and runs on EVERY deployment.
      #   - provider-error-classification.spec.ts: the INFO Evaluating / Sending
      #     rows as well as the ERROR one, matched on a seeded TRACE id, so the
      #     non-error half of the stream is rendered-and-asserted too. This one
      #     needs the backend to reach the host-run mock gateway, so it skips on
      #     any deployment other than oss (mockAuthSkipReason) — the same gate as
      #     configuration's ai-provider-add / ai-provider-token-refetch.
      #   - llm-judge-provider-failure.spec.ts: the only one that pins the
      #     rendered stream by EXHAUSTION — every row read back and compared
      #     line-for-line against the same rule's GET
      #     /automations/evaluators/{id}/logs, so a dropped line or a foreign
      #     rule's line fails where a filtered row-count cannot see either. It
      #     also adds the trace_id MARKER column, newest-first ORDER, and
      #     expanding one ERROR row to reveal the multi-line body the collapsed
      #     cell hides. Its provider is a 404 route on the backend's own
      #     connector, so like the thread-judge spec it runs on EVERY deployment.
      #
      # Note that online-evaluation-python-metric-errors.spec.ts asserts the same
      # API stream and deliberately does NOT claim this key: an API read says
      # nothing about what renders. That distinction is why this key stayed false
      # for as long as it did.
      #
      # So the flag itself is not oss-only: the thread-judge and
      # llm-judge-provider-failure specs hold it up everywhere, and the
      # classification spec deepens it on oss.
      #
      # Still uncovered: the refresh control, the expand-ALL toggle (one row at a
      # time is covered), and column resizing.
      automation-logs:         { covered: true,  tier: t2-cuj, note: "rule_id-scoped log stream renders, failing-judge rules only: one ERROR row per failed thread and no others (thread-judge-provider-failure, every deployment); Evaluating / Sending / ERROR rows for one seeded trace id (provider-error-classification, oss only — it needs the host-run mock gateway); and the whole stream pinned by exhaustion against the rule-logs API, plus the trace_id marker column, newest-first order and a single ERROR row expanded to reveal the provider status (llm-judge-provider-failure, every deployment). Refresh, expand-all and column resize are not exercised" }

    visual:
      online-evaluation-empty: { covered: true,  state: empty,   spec: "empty-states.spec.ts E11" }
      online-evaluation-list:  { covered: false, state: default }

