      # the user types. Covered end-to-end rather than only in unit tests: the
      # string building is pinned by alertNameHelpers.test.ts, but the wiring
      # (does the field fill, does typing win, is the "(2)" counter decided
      # against the project's real alerts) is where the bugs are.
      suggest-alert-name:  { covered: true,  tier: t2-cuj }
      # "Test connection" / "Test trigger" POST the draft alert to the endpoint
      # in the form. Asserting a *success* still needs a receiver the suite
      # controls and the backend can reach, which managed cloud staging does
      # not give us — so the success toast remains UNCOVERED and stays on the
      # release's manual list.
      #
      # What alert-webhook-test-connection.spec.ts does cover is the two halves
      # that are deterministic without a receiver: the client-side URL guard,
      # which answers before any request is issued (asserted by counting the
      # POSTs, not just by reading the toast), and a host under the reserved
      # .invalid TLD, which can never resolve — so the failure response and the
      # reason it puts in front of the user are pinned without depending on
      # anything being down. Partial by construction, not by omission.
      test-alert:          { covered: true,  tier: t2-cuj }

