      output-staleness:          { covered: false, note: "An output already on screen is marked stale when the run inputs change and left live when they do not, instead of being cleared to 'No runs yet'. Free mode (playground-stale-output.spec.ts): editing the message dims the failure tag and renders the full 'Prompt changed since the last run. Re-run to update results.' sentence, and a plain reload, a save-to-library, a reload with the library link set, a detach and an explicit library load all leave the output undimmed with no note — including where the library load regenerates every message id, which is the payload that used to grey a finished run for no user edit. Dataset grid (playground-stale-output-dataset-grid.spec.ts): every cell keeps its dimmed failure tag under a COMPACT note whose tooltip carries the same sentence, and no cell reverts to 'No runs yet'. Dataset grid, MID-RUN (playground-stale-output-mid-run.spec.ts, new for 2.2.119 / opik#9166 — 2.2.119 moved the dataset run server-side, so the page no longer owns the work it is displaying): editing the prompt while a run is still in flight notes every cell stale under the same compact summary, resets no cell to 'No runs yet', and leaves the run running — both halves of 'in flight' read, since Stop all mounts off `isRunning` and the progress readout off `useShowsRunProgress`, and a page that reset its output state on an edit would drop the only handle the user has to a server-side run. The stop then still works and the notes survive it. Deliberately NOT claimed there: that a cell keeps its previous RESULT — the second run is a re-run of the same rows, and clearing a result it is about to replace is what a re-run means; a finished result surviving an edit is the settled case the spec above pins. Not covered: what a stale SUCCESSFUL answer looks like (needs a provider that answers), the dark-theme rendering of the dimming (an `opacity` the estate asserts as a computed style, which does not vary by theme — a visual-suite question), and the test-suite grid, which is gated differently on purpose and does revert to 'No runs yet'." }
