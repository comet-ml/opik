      version-history-view:  { covered: false, note: "A test suite's read-only version sheet (test-suite-version-records-sidebar.spec.ts): the meta block lists the OPENED version's suite assertions and its execution policy formatted '<pass_threshold> of <runs_per_item> must pass', the table holds exactly that version's test cases by id, and each row's Execution policy cell reports the version's policy while its Custom assertions cell reports none. Opening a case shows its Data, 'Only suite assertions', and the inherited policy marked '(suite default)'. The seed makes the two versions differ on assertions AND policy as well as on their cases — the older carries two assertions and 1-of-2, the latest one different assertion and 2-of-3 — so every assertion would pass against a sheet wired to the latest if it were symmetric; the latest's assertion text and policy string are both asserted absent from the sheet. Cutting that second version needs POST /datasets/{id}/items/changes, since the SDK can only set a suite's assertions and policy at creation. NOT covered: a per-ITEM execution policy override, which no seeding route can set today, and the viewer-only variant of the row menu (OSS hardcodes canEditDatasets)." }

