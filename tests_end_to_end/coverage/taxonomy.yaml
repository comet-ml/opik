      # Pending capability from opik#8813, applied by the release job for
      # 2.2.116. run-against-dataset is about a run HAPPENING; this key is the
      # guard that refuses one when the selected version is empty.
      empty-source-run-guard:    { covered: false, note: "A Playground run is refused when the SELECTED version of the loaded dataset or test suite has no items, on every surface that can start one — the header's Run, each variant card's own Run, and the Shift+Enter shortcut — with the reason naming the loaded source's type (\"dataset version\" / \"test suite version\"); and POST /v1/private/experiments/execute answers 400 for the same version and creates no experiment. The gate is also shown to follow the selection rather than the source's live item count: one dataset holding a populated v1 and an empty latest answers differently depending only on which version is picked, and switching to the populated one re-enables every surface and runs. Filed as its own key rather than under playground.run-against-dataset, which is about a run HAPPENING and is already covered — counting a guard that refuses to run there would read as coverage of the run path that nobody added, the same trap the OPEN note on playground.stop-run in taxonomy.yaml records. The version-switch spec does also tag run-against-dataset, because it genuinely runs the dataset end to end once the gate opens. NOT covered, and not claimed: the gate FAILS OPEN if items_total goes missing from the versions response (isDatasetEmpty is `itemsTotal === 0`, so undefined reads as \"not empty\"), which is why these specs seed the emptiness through the API and never stub the response — the field is present and correct today, and the backend 400 still refuses the experiment, so there is nothing to assert about it on a working build." }

