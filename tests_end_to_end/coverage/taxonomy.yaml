 the filter branch of the run gate (playground-run-gate-filtered-out.spec.ts, opik#8750) — a dataset-grid filter matching no row disables the header's Run and EVERY variant card's own Run, each with the reason naming the filter rather than one of the four conditions checked before it, and narrowing the same filter to a value exactly one row carries re-opens all of them with their runnable reasons; both surfaces because they compute the refusal separately (`PlaygroundHeader` off `useDatasetItemsTotal`, `PlaygroundRunButton` off its own `usePlaygroundDataset`), and the filter totals are read from the grid's own response rather than the DOM because that popover applies on close and drops an incomplete row in silence. Nothing is run there, so do not read it as asserting a score or an experiment" }
