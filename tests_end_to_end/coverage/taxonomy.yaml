      optimization-runs-list:  { covered: false, state: default }
      optimization-detail:     { covered: false, state: default }

  datasets:
    label: Datasets
    nav_group: Evaluation
    routes: ["/projects/$projectId/datasets", "/datasets/$datasetId/items"]
