      # New for 2.2.86, from the release pass's own exploration of opik#8411.
      #
      # The Python SDK's MULTI-PAGE read of search_traces / search_spans —
      # `read_and_parse_full_stream`'s cursor arithmetic, which opik#8411
      # rewrote so the cursor is the last id the BACKEND sent rather than the
      # last one that parsed. Its own key rather than part of list-traces: that
      # key names the Logs TABLE (see the note above), and every estate call
      # through this function is single-page, so the paging itself has never
      # run. The failure mode is a short read — ids silently missing from a
      # result set that still looks like an ordinary list — which is why it is
      # asserted as set equality against a direct REST enumeration rather than
      # as a count.
      sdk-multipage-stream-reads: { covered: false }
      # New for 2.2.93, from the release pass's own exploration of opik#8518.
      #
      # `@opik.track` on a GENERATOR, specifically one the consumer stops
      # reading before it is exhausted. A different code path from a tracked
      # function: `SyncTrackedGenerator` opens its span on the first next() and,
      # before opik#8518, ended it only on StopIteration — so an early exit left
      # the span open and the WHOLE TRACE was dropped, which a user reads as
      # "the SDK logged nothing".
      #
      # Its own key, and NOT `list-traces`, which the exploration's candidate
      # reached for. The OPEN note at the top of this area already records that
      # `list-traces` is carrying `sdk-track-non-error-throw.spec.ts` for want
      # of a better key and warns in its own note against reading its
      # `covered: true` as evidence about the SDK trace lifecycle — folding a
      # second SDK-lifecycle spec under it would make that worse, and would also
      # conflate the TypeScript SDK (that spec's subject) with the Python one.
      #
      # Deliberately narrower than the `traces.sdk-trace-lifecycle` the OPEN
      # note proposes as a candidate: this spec exercises generators under
      # @track and nothing else, and a capability counted as covered is never
      # re-derived. Whether to add that broader key and re-home the TypeScript
      # spec is still the open question it was.
      sdk-track-generator-spans: { covered: false, note: "A tracked generator stopped early still logs its trace and its span, in all four ways a consumer stops one: a for-loop break, a bare next(), itertools.islice, and an exception raised in the CONSUMER's loop body and caught outside (the generator itself does not fail, so that one must read as a partial success and carry no error). Asserted beyond presence on the recorded OUTPUT, which the fix defines as the items actually yielded before the consumer stopped — a distinct expected string per shape, on the trace AND on its span, so a build that recorded the whole generator or none of it fails. Population asserted by exhaustion (exactly one span per call, label set compared whole, held across a quiet period) so an extra or missing span fails rather than hiding behind the rows that were looked for; plus a non-null positive duration per trace, which is what ending the span produces. A fully exhausted generator and a plain tracked function run beside them as controls, so a red early-exit shape next to a green control is a product finding rather than the SDK failing to reach the environment. The UI half pins the same fact where a user sees it: every trace a row in the Logs table and its duration cell an elapsed time rather than the 'NA' a never-ended span renders as. Driven through a new opik-sdk-driver route (/traces/track-generator); the bridge drove @opik.track only on a plain function before. Not covered: the ASYNC generator wrapper (aclose, and the loop-shutdown path), an explicit close() by the caller, the atexit backstop for a generator still alive at interpreter exit, and a generations_aggregator override" }
      # New for 2.2.92, from the release pass's own exploration of opik#8368.
      #
      # The spans an `opik.integrations.*` TRACKER writes — here `track_ollama`,
      # which wraps `ollama.Client.chat` / `AsyncClient.chat` including
      # `stream=True`. Nothing in the estate drove any tracker before this: the
      # `opik-sdk-driver` had no `integrations` route and no spec imported one,
      # so the only guard was the PR's own `test_ollama.py` behind a new
      # workflow that needs a live Ollama.
      #
      # Deliberately named for THIS tracker and not for the family. A generic
      # key would read as a claim about every `opik.integrations.*` module, of
      # which this spec exercises exactly one — and a capability counted as
      # covered is never re-derived.
      #
      # Its own key rather than folded into `span-model-cost-tokens`, which the
      # exploration's candidate reached for. That key is about server-side PRICE
      # resolution over hand-seeded spans: its spec writes the usage map itself,
      # so it cannot see a tracker that mapped the provider's counters onto the
      # wrong keys, which is the silent-wrongness half here. Folding this under
      # it would retire the question permanently.
      # New for 2.2.94, from the release pass's own exploration of opik#8782.
      #
      # The spans a TYPESCRIPT `opik-openai` tracker writes — here `trackOpenAI`
      # over the OpenAI **Responses** API, whose `usage` reports
      # `input_tokens`/`output_tokens`. opik#8782 had those assigned to
      # `completion_tokens`/`prompt_tokens`: literally transposed, so every
      # Responses-API span was billed at the wrong per-token rate while looking
      # entirely healthy.
      #
      # Named for THIS tracker and this endpoint, not for the family. The spec
      # exercises one of five integration packages (`opik-openai`, `opik-gemini`,
      # `opik-langchain`, `opik-otel`, `opik-vercel`) on one of its two endpoints,
      # and a capability counted as covered is never re-derived.
      #
      # Its own key rather than folded into `span-model-cost-tokens`, which the
      # exploration's candidate reached for — the same call the 2.2.92 pass made
      # for `sdk-ollama-tracker-spans`, and for the same reason. That key is about
      # server-side PRICE resolution over hand-seeded spans: its fixture writes
      # the usage map itself, so it cannot see a tracker that filled the map in
      # wrongly, which is the entire defect here. It is already `covered: true`,
      # so folding this under it would retire the question permanently.
      # New for 2.2.119, from the release pass's own exploration of opik#8783.
      #
      # The spans `opik-gemini`'s `trackGemini` writes, specifically its USAGE
      # mapping. Gemini reports five counters and bills four of them: Opik's
      # two obvious buckets miss `toolUsePromptTokenCount` (billed as input) and
      # `thoughtsTokenCount` (billed as output), which is why the provider's own
      # `totalTokenCount` does not equal the obvious pair's sum.
      #
      # Named for THIS tracker, not for the family, and not folded into
      # `span-model-cost-tokens` — the same two calls the 2.2.92 and 2.2.94
      # passes made for `sdk-ollama-tracker-spans` and
      # `ts-sdk-openai-tracker-usage`, for the same reasons. The exploration's
      # candidate filed this under `span-model-cost-tokens` and said in the same
      # breath that a per-tracker key would be the cleaner home; that key is
      # about server-side price resolution over hand-seeded spans, whose
      # fixtures write the usage map themselves, so it cannot see a tracker that
      # filled the map in wrongly. It is already `covered: true`, so folding
      # this under it would retire the question permanently.
      ts-sdk-gemini-tracker-usage: { covered: false, note: "opik-gemini's trackGemini over models.generateContent, driven against a local stub provider (127.0.0.1, no key, no network, so all five counters and the model are fixed by the fixture): promptTokenCount=100 / toolUsePromptTokenCount=5 / candidatesTokenCount=20 / thoughtsTokenCount=30 / totalTokenCount=155 asserted to map onto prompt_tokens 105 and completion_tokens 50 — NOT the naive 100/20 pair — as a WHOLE usage map including the provider's own five counters kept under original_usage.*, which is what makes it a mapping rather than a relabelling. The spec asserts the stub can observe the fold before driving it: both folds are non-zero, and the provider total differs from the naive pair (the inequality the tracker gates the thinking fold on), so a stub that skipped that branch fails loudly instead of going green. Priced on the folded buckets at gemini-2.5-flash's published rates ($3e-07 in, $2.5e-06 out) to $0.0001565, beside a control span this spec seeds by hand with the pre-8783 two-counter mapping, asserted to price at $0.00008 and strictly less — so the cost comparison is shown to discriminate rather than merely asserted on one side. gemini-2.5-flash chosen because its output rate is 8x its input rate, so moving 30 tokens into the completion bucket is a visibly different bill; its gemini/ and bare price rows carry identical rates, so the amount does not depend on which the resolver reaches. Population pinned by exhaustion (exactly one span per tracked call), and the stub records any path it was not asked to serve, so a client that took :streamGenerateContent — a different accumulator — fails instead of passing while saying nothing. Also records, without endorsing, that this tracker types its generation `llm` where trackOpenAI types the equivalent span `general`, and asserts the span arrives under provider google_ai — the CostService alias for the gemini/-keyed rows, and therefore what the amount is a claim about; the hand-seeded control carries the same model and provider, so it differs from the tracked span in the two counters and in nothing else. Needs `@google/genai` + `opik-gemini` as e2e devDependencies, with an `overrides` entry because opik-gemini declares peer opik@^1.7.25 while the suite pins opik@^2.2.74. NOT covered: streaming (:streamGenerateContent), the functionCalls child spans the tracker emits when a response declares them, cachedContentTokenCount, an explicit `parent`, and every other opik-* integration package" }
      ts-sdk-openai-tracker-usage: { covered: false, note: "opik-openai's trackOpenAI over the OpenAI Responses API, driven against a local stub provider (127.0.0.1, no key, no network, so both token counts and the model are fixed by the fixture): the provider's deliberately lopsided input_tokens=1,000,000 / output_tokens=1,000 asserted to land on prompt_tokens / completion_tokens the right way round, as a WHOLE usage map including the native counters kept under original_usage.* — which is what makes it a mapping rather than a rename, and what rules out a tracker that had swapped both sides. Priced on that mapping at gpt-4o's published rates ($2.5e-06 in, $1e-05 out) to exactly $2.51, beside a control span this spec seeds by hand with the two counts TRANSPOSED, asserted to price at $10.0025 and strictly more — so the cost comparison is shown to discriminate rather than merely asserted on one side. gpt-4o chosen because its two rates are an order of magnitude apart, which the spec asserts before relying on. Population pinned by exhaustion (exactly one span per tracked call, so a span-per-chunk or a request/response pair fails) and the stub records any path it was not asked to serve, so a client that fell back to /v1/chat/completions — a different usage shape needing no mapping — fails loudly instead of passing while saying nothing. Also records, without endorsing, that this tracker types its generation span `general` where the Python track_ollama tracker types it `llm`. Needs `openai` + `opik-openai` as e2e devDependencies, with an `overrides` entry because opik-openai@2.2.94 still declares peer opik@^1.8.61 while the suite pins opik@^2.2.74; plain `npm ci` was verified to resolve. ALSO covered as of 2.2.119 on the tracker's OTHER endpoint, and on the streamed path this note previously recorded as uncovered (ts-sdk-openai-streamed-parallel-tools.spec.ts, opik#8999): a STREAMED POST /v1/chat/completions answering with two PARALLEL tool calls whose argument fragments the stub interleaves, asserted to arrive as two calls in `index` order, each with its own id, `type` and complete arguments — compared as the whole output object, and each argument string re-parsed as JSON on its own, because the pre-8999 accumulator keyed on `delta.tool_calls[0]` and concatenated every fragment into ONE call whose arguments render fine and parse as nothing. Also that the caller still receives all nine chunks the stub sent (the tracker wraps the stream in a generator of its own, so it is in a position to swallow or reorder them), that the final `choices: []` usage chunk lands as the same whole mapped-plus-`original_usage.*` map rather than being mistaken for content, and that the span is then priced server-side at gpt-4o's published rates — a tracker that wrote the counters under keys the backend does not read leaves a streamed span unpriced beside identical siblings that are. Population pinned by exhaustion there too, so a span-per-chunk (nine) or a span-per-tool-call fails, and that stub likewise records any path it was not asked to serve, so a client that dropped `stream: true` or fell back to /v1/responses fails loudly. NOT covered: the NON-streamed chat-completions endpoint, streaming on the Responses API, a streamed call that reports no usage chunk at all, cached or reasoning tokens as non-zero, an explicit `parent`, and every other opik-* integration package" }
      sdk-ollama-tracker-spans: { covered: false, note: "track_ollama writing one llm span per chat() call against a mock /api/chat: a streamed call aggregated into ONE span carrying the concatenated text the done chunk does not, prompt_eval_count/eval_count mapped onto prompt_tokens/completion_tokens with the native COUNTERS kept under original_usage.* and the four nanosecond *_duration fields deliberately kept OUT of the usage map (opik#8771, 2.2.94: they overflow the backend's 32-bit usage values and the whole span batch is rejected, so the SDK appears to log nothing) while still being recorded in the span metadata, the provider default and its override, the stream-renamed span, a call nested under an @opik.track parent, and AsyncClient behaving identically. Span population pinned by exhaustion over the whole project, so a span-per-chunk fails. Not covered: any other opik.integrations.* tracker, tool_calls, thinking, and cost (a mock model name resolves no price)" }
