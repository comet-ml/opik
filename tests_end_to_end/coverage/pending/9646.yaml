# pending capabilities from opik#9646 (OPIK-9234) — applied by the release job
#
# Both are the AGGREGATED pass-rate cell on an Experiments GROUP row, which is a
# different cell, a different code path and a different payload from the
# per-experiment pass rate the two existing keys name. Neither existing key
# could be stretched over it without recording the group row as covered by a
# spec that never rendered one — and a capability counted as covered is never
# re-derived.
#
#   test-suites.pass-rate-display is PassRateCell, fed from the experiment row's
#   own `pass_rate`. It was already `covered: true` before this, by
#   test-suites-smoke.spec.ts, which asserts `items_passed` off the SDK's run
#   result and never looks at the cell at all. The group row is
#   PassRateCell.Aggregation, fed from `aggregationMap` and the group
#   aggregations endpoint — and the defect opik#9646 fixed hit the group row
#   while the experiment row kept working.
#
#   prompts.experiments-tab is scoped by its own note to "listing, paging, and
#   pinning" on that tab. The group pass rate is none of the three.
#
- area: test-suites
  capability: group-pass-rate-display
  note: >-
    The aggregated Pass rate cell on an Experiments GROUP row
    (test-suite-group-pass-rate.spec.ts): the group's own pass rate is the MEAN
    of its experiments' rates (the endpoint's `pass_rate_avg`), not the pooled
    passed/total, and the seed holds a group of 1/1 and 1/3 runs so the two
    provably differ — 67% against a pooled 50%. Asserted against the
    aggregations endpoint's payload in the same test, which is what makes the
    renamed wire keys (`pass_rate_avg` / `passed_count_sum` /
    `total_count_sum`) part of the claim rather than an assumption: the
    pre-opik#9646 frontend read three names this endpoint has never answered and
    could only ever have rendered blank. Covers all four states of the cell: the
    mean, the `formatPercent` cap (199/200 reads 99% and never the 100% plain
    rounding gives, with a red dot) on the group row AND on the experiment row
    inside it, an exactly-1.0 group reading 100% with a green dot, and a group
    holding only a dataset-method experiment leaving the cell EMPTY rather than
    0%. Label and dot colour are asserted together, since "100%" beside a red
    dot is the specific wrongness the cap exists to prevent and either half
    alone would miss it. The pill's tooltip is pinned in full and in order — it
    names the average and reports the pooled counts as a total, never as the
    percentage's source. NOT covered, and not claimed: `opik.run_tests`
    producing the assertion rows (the verdicts are written through
    `PUT /v1/private/assertion-results`, which is the table the pass-rate query
    reads either way, because a judged run cannot be steered to a chosen ratio);
    and the Experiments metrics dashboard widget's Pass rate series, which reads
    the same `pass_rate_avg` but is a chart nothing here renders.
- area: prompts
  capability: experiments-tab-group-pass-rate
  note: >-
    The group pass rate on the prompt detail page's Experiments tab
    (prompt-experiments-tab-group-pass-rate.spec.ts) — the SECOND, separately
    wired call site of the same aggregated cell, which takes its own copy of the
    `aggregationKey` and so can regress while the project Experiments page keeps
    working. Its own key rather than part of experiments-tab, whose note scopes
    that key to listing, paging and pinning. Asserts the same group rows this
    tab is reached by prompt rather than by project: the mixed group reads 67%
    with the average-and-pooled-counts tooltip, the capped group reads 99% on
    the group row and on the experiment row inside it, and the
    dataset-method-only group's cell is empty.
