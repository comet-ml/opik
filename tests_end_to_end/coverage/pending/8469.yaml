# pending capabilities from opik#8469 — applied by the release job
- area: experiments
  capability: suite-item-sidebar
  note: >-
    The evaluation-suite item sidebar on the compare route's Items tab
    (TestSuiteExperimentPanel), as opposed to compare-row-detail, which is the
    CompareExperimentsPanel shown for a dataset-method experiment. Its own key
    because the Items tab mounts one or the other on evaluation_method and they
    are wired differently: this one takes the project it looks attachments up
    under from the experiments LIST (experimentProjectIdMap), while the compare
    panel takes it from useExperimentById — so one can break while the other
    works. Covers the multi-run axis MultiRunTabs adds, which the compare panel
    has no equivalent of: one dataset item run twice, each run's own output text
    paired with its own picture, asserted per run so that a tab rendering the
    other run's media is caught rather than read as a normal-looking panel.
