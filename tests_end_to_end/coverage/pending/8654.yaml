# pending capabilities from opik#8654 — applied by the release job
#
# Why a new key rather than the two the exploration proposed:
#
#   experiments.compare-row-detail is the CompareExperimentsPanel's CONTENT —
#   per-experiment output and score, and the inline-image mapping. Its note says
#   so in full. The flow here starts in that panel but ends two pages away, on
#   the dataset items page's own header and item sidebar, which that key does not
#   name and cannot speak for.
#
#   experiments.suite-item-sidebar is the evaluation-suite sidebar's content and
#   its multi-run media axis, already claimed by suite-item-sidebar-run-media.
#   Tagging navigation onto it would read as that axis being covered.
#
# Both would have been stretched, and a capability counted as covered is never
# re-derived — so the UI nobody tested would read as tested for good. The thing
# actually asserted is the ROUND TRIP, which spans both call sites and is one
# implementation (parseExperimentReturnHref + ViewInExperimentButton), so it is
# one key covered by two specs rather than two keys.
- area: experiments
  capability: return-to-experiment
  note: "Getting back to the experiment from an evaluation item (OPIK-8600). Both call sites: the compare row-detail panel's dataset-item tag (CompareExperimentsPanel, dataset method) and the evaluation-suite sidebar's 'View evaluation item' tag (TestSuiteExperimentPanel) each carry the originating compare view in `from`; the items page that lands reads it back as a 'Back to experiment' button restoring that view's WHOLE search, and the item side panel grows an 'Experiment' button that reopens the compare view on the item the PANEL is showing rather than the one `from` was built with. Asserted on exact search params, since a back button that returns to a compare view with its filters or search dropped looks perfectly healthy. Reject path covered on both pages: an absent, off-site, protocol-relative or in-app-non-compare `from` falls back to 'Back to datasets'/'Back to test suites' with no Experiment button, against a good `from` on the same page as the control; plus the valid-compare-`from`-carrying-no-`experiments` middle case, where the back button still resolves while the Experiment button is correctly hidden. Pins both tooltip branches — plural over two experiments on the dataset side, singular over one on the suite side. NOT covered, and not claimed: the canViewExperiments: false permission gate (this OSS install grants everything) and the non-root-basepath branch of parseExperimentReturnHref (served at /); both have vitest coverage."
