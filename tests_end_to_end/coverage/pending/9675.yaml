# pending capabilities from opik#9675 — applied by the release job
#
# 2.3.0 turns PYTHON_CODE_EXECUTOR_PROCESS_NETWORK_ISOLATION and
# PYTHON_CODE_EXECUTOR_DOCKER_HARDENING on by default, so "user code has no
# network" is now the behaviour of every fresh install. No existing
# online-evaluation capability names it: python-rule-scores and
# scores-in-trace-panel are about whether the evaluator ran and what it
# concluded, and both are satisfied whether or not the sandbox is applied.
# Without a key of its own the sandbox reads as untested forever, which is why
# this is proposed rather than folded into the nearest neighbour.
- area: online-evaluation
  capability: python-executor-isolation
  note: "A python metric's own runtime is sandboxed: it reaches nothing over the network, and a refusal it does not expect surfaces as an ERROR row naming its own frame rather than as a silently missing score. Asserted on the property both executor strategies must have — nothing was reached — never on the errno or exception type, which differ between the seccomp filter the process strategy installs and the network_disabled container the docker strategy creates (online-evaluation-python-executor-network-isolation.spec.ts)"
