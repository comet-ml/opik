altinity-clickhouse-operator:
  enabled: true
  metrics:
    enabled: false
  serviceMonitor:
    enabled: false
    interval: '' # workaround for https://github.com/Altinity/clickhouse-operator/issues/1759

# Backend-side settings for the analytics (ClickHouse) database. Rendered into the backend env
# ConfigMap; each key maps to the env var of the same name documented in apps/opik-backend/config.yml.
# An explicit key under component.backend.env always wins over the value derived here.
databaseAnalytics:
  # Gates the `clickhouse-cold-storage-disk` readiness probe, which fails readiness when the `cold_s3`
  # tiered-storage disk isn't reachable from the node. Independent of clickhouse.tieredStorage.enabled
  # on purpose: the disk is provisioned first and only becomes load-bearing once a migration attaches
  # the `tiered_replicated` policy to a table, so this is turned on separately, after that.
  coldStorageDiskHealthCheckEnabled: false
  # UUIDv7 ingestion validation. `enabled` is the kill-switch; while it is false the other two are
  # inert. `auditOnly` counts out-of-window ids (opik.ingestion.uuid_v7.rejected, tagged by workspace)
  # and logs them instead of rejecting with HTTP 400, so offenders surface without breaking ingestion.
  uuidV7ValidationEnabled: false
  uuidV7ValidationAuditOnly: false
  # Validation window as a Dropwizard duration. Writes whose `id` is a UUIDv7 embedding a timestamp
  # further than this into the past or future are out of window. Accepted range is 12h .. 45d; the
  # backend rejects anything outside that at startup.
  uuidV7ValidationWindow: 24h

# Cutover toggles for the trace/span analytics data model. Each one is flipped in lockstep with a
# migration, so they stay false until that migration runs — see apps/opik-backend/config.yml for the
# exact ordering constraints.
databaseAnalyticsDataModel:
  # Turn true once the traces table's Nullable end_time/duration/ttft columns are replaced with
  # sentinel-defaulted non-nullable ones, in lockstep with the cutover EXCHANGE. Gates reads too.
  traceColumnsNonNullable: false
  # Spans sibling of traceColumnsNonNullable, for the later spans cutover. Flip independently.
  spanColumnsNonNullable: false
  # Turn true once the trace backfill starts, so trace deletes also record the deleted ids in the
  # deletion_events_local bridge. Scope to the backfill-to-cutover window.
  traceDeletionEventsCaptureEnabled: false
  # Spans sibling: captures the span ids removed by the trace-delete cascade. Flip independently.
  spanDeletionEventsCaptureEnabled: false
  # Rows per INSERT into the deletion_events_local bridge.
  deletionEventsInsertBatchSize: 1000
  # Turn true in lockstep with applying the Distributed wrap, so trace delete/retention mutations target
  # traces_local (a Distributed traces rejects mutations). Leave false while traces is still a MergeTree.
  tracesDistributedWrapEnabled: false

# ClickHouse partition-health observability (OPIK-6904). Polls system.parts plus the
# lightweight-delete mask and publishes opik.clickhouse.partition.* gauges; a distributed lock keeps
# a single instance polling.
partitionMetrics:
  enabled: false
  # Poll interval as a Dropwizard duration. Min 30s, max 1h.
  interval: 5m
  # Comma-separated tables scanned for lightweight-deleted (masked) rows.
  lwdTables: "traces,spans"

clickhouse:
  enabled: true
  shardsCount: 1
  # Declares that this deployment fronts its tables with Distributed tables (the Hyperscale
  # topology). While off, nothing here is rendered, so upgrading the chart never reshapes an
  # existing cluster on its own. Turning it on does two things:
  #   - enables the backend's `clickhouse-cluster` readiness probe, which verifies the Distributed
  #     cluster definition is visible from the node (ANALYTICS_DB_CLUSTER_HEALTH_CHECK_ENABLED — set
  #     that key explicitly under component.backend.env to decouple the two)
  #   - pins internal_replication on each shard of the ClickHouseInstallation, whenever
  #     replicasCount > 1. With the flag off the operator infers it from replicasCount > 1 instead,
  #     which is the behaviour every deployment already has.
  #
  # Note this is deliberately NOT tied to shardsCount > 1. internal_replication governs replica
  # fan-out *within* a shard, not the number of shards: on a single shard with 2 replicas it decides
  # whether an INSERT into the Distributed table writes one replica and lets ReplicatedMergeTree
  # replicate the parts, or writes both directly. That single-shard case is the near-term target —
  # the traces cutover fronts the table with a Distributed table that is "transparent on a single
  # shard", with real sharding turned on later — so gating on shardsCount > 1 would exclude the very
  # deployment this is meant to cover. Turn the flag on when the Distributed tables land, whatever
  # shardsCount is.
  sharding:
    enabled: false
  # For a FRESH High-Availability install, use the two-phase flow: install with replicasCount 1, let
  # opik-backend finish all migrations, THEN raise replicasCount and upgrade so the ClickHouse operator
  # clones the schema to the new replicas. Installing directly on >= 2 replicas prevents the analytics
  # migrations from completing on a fresh cluster. See the self-host/scaling docs.
  replicasCount: 1
  image: altinity/clickhouse-server:26.3.16.10001.altinitystable
  storage: 50Gi
  logsLevel: information
  # Custom health checks with longer timeouts for major version upgrades
  livenessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  configuration:
    files:
      conf.d/memory.xml: |
        <yandex>
          <max_server_memory_usage_to_ram_ratio>0.85</max_server_memory_usage_to_ram_ratio>
        </yandex>
      conf.d/profiles.xml: |
        <clickhouse>
          <profiles>
            <default>
                <max_bytes_ratio_before_external_sort>0.2</max_bytes_ratio_before_external_sort>
                <max_bytes_ratio_before_external_group_by>0.2</max_bytes_ratio_before_external_group_by>
                <!-- CH 25.8 made the experimental Time type opt-in; required for fresh installs to replay migration 000030. -->
                <enable_time_time64_type>1</enable_time_time64_type>
                <!-- the new CH 25.x default (1) makes FINAL reads on skip-indexed tables over-read massively; our queries already prune on the PK/project_id, so exact mode isn't needed. -->
                <use_skip_indexes_if_final_exact_mode>0</use_skip_indexes_if_final_exact_mode>
            </default>
          </profiles>
        </clickhouse>
      # Remove or add TTL to system tables that are not needed
      conf.d/system_tables.xml: |
        <clickhouse>
          <opentelemetry_span_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <processors_profile_log remove="1"/>
          <text_log remove="1"/>
          <trace_log remove="1"/>
          <blob_storage_log remove="1"/>
          <error_log>
              <engine>
                  ENGINE MergeTree
                  PARTITION BY toYYYYMM(event_date)
                  ORDER BY (event_date, event_time)
                  TTL event_date + toIntervalDay(30)
                  SETTINGS index_granularity = 8192
              </engine>
              <database>system</database>
              <table>error_log</table>
          </error_log>
          <latency_log>
              <engine>
                  ENGINE = MergeTree
                  PARTITION BY toYYYYMM(event_date)
                  ORDER BY (event_date, event_time)
                  TTL event_date + toIntervalDay(30)
                  SETTINGS index_granularity = 8192
              </engine>
              <database>system</database>
              <table>latency_log</table>
          </latency_log>
          <metric_log>
              <engine>
                  ENGINE = MergeTree
                  PARTITION BY toYYYYMM(event_date)
                  ORDER BY (event_date, event_time)
                  TTL event_date + toIntervalDay(30)
                  SETTINGS index_granularity = 8192
              </engine>
              <database>system</database>
              <table>metric_log</table>
          </metric_log>
          <query_metric_log>
              <engine>
                  ENGINE = MergeTree
                  PARTITION BY toYYYYMM(event_date)
                  ORDER BY (event_date, event_time)
                  TTL event_date + toIntervalDay(30)
                  SETTINGS index_granularity = 8192
              </engine>
              <database>system</database>
              <table>query_metric_log</table>
          </query_metric_log>
        </clickhouse>
  service:
    serviceTemplate: clickhouse-cluster-svc-template
  templates:
    podTemplate: clickhouse-cluster-pod-template
    replicaServiceTemplate: clickhouse-replica-svc-template
    serviceTemplate: clickhouse-cluster-svc-template
    volumeClaimTemplate: storage-vc-template
  extraServiceTemplates: []
  extraPodTemplates: []
  extraVolumeClaimTemplates: []
  # -- (list) Additional volume mounts for the ClickHouse server container.
  # Use this to mount volumes that ClickHouse server needs direct access to,
  # such as a backup disk for embedded backups (BACKUP TO Disk(...)).
  # The mount name can reference a CHI volumeClaimTemplate defined in
  # `clickhouse.extraVolumeClaimTemplates` (matched by name automatically by
  # the ClickHouse operator), or a volume defined in `clickhouse.extraVolumes`.
  extraVolumeMounts: []
  # -- (list) Additional pod-level volumes for the ClickHouse pod, independent
  # of the backup server sidecar. Use this for non-PVC volume types (configMap,
  # secret, emptyDir, hostPath, etc.) that should be available to the ClickHouse
  # server container. For persistent storage, prefer defining a CHI-managed PVC
  # via `clickhouse.extraVolumeClaimTemplates` and referencing it by name in
  # `extraVolumeMounts` above.
  extraVolumes: []
  # -- Tiered storage (hot local disk -> cold S3 with a read-through cache).
  # Renders conf.d/storage.xml (the `tiered_replicated` policy + hot/cold_s3/cold
  # disks) and provisions a per-node EBS cache volume for the S3 cache. This is
  # pure server-side infrastructure: it stays inert until a migration attaches
  # the `tiered_replicated` policy to a table, so `enabled: false` (default) is
  # a no-op. The S3 <endpoint> is rendered by Helm — ClickHouse macros
  # ({shard}/{replica}) cannot be used because the S3 disk is read at server
  # start, before macros bind.
  tieredStorage:
    enabled: false
    hot:
      # keep_free_space_bytes on the hot disk (headroom before TTL MOVE to cold).
      # The hot tier is ClickHouse's built-in `default` disk (the server data
      # path); this only tunes its free-space headroom.
      keepFreeSpaceBytes: "10737418240" # 10 GiB
    cold:
      s3:
        # Base S3 URL for the cold disk, e.g. https://<bucket>.s3.<region>.amazonaws.com
        endpoint: ""
        # Per-replica bucket prefix. Rendered concretely by Helm (no CH macros).
        prefix: "clickhouse-cold/"
        region: ""
        # Use the pod's IAM role (IRSA) instead of static keys.
        useEnvironmentCredentials: true
        # Keep false: the tiered_replicated policy writes parts to cold on TTL
        # MOVE, so the disk must be writable. Set true only for a pre-populated /
        # externally-managed bucket that ClickHouse should never write to.
        readOnly: false
        maxGetRps: 1000
        maxPutRps: 500
      cache:
        # Read-through LRU cache wrapping cold_s3, on a local EBS volume.
        # Must be a DNS label (<=63 chars, lowercase alphanumeric or '-', start
        # with a letter) — used verbatim as the K8s volume / PVC name.
        volumeName: s3-cache-vc-template
        path: /var/cache/clickhouse_s3
        storage: 200Gi
        maxSize: "214748364800" # 200 GiB
        # Falls back to clickhouse.storageClassName when empty.
        storageClassName: ""
  adminUser:
    useSecret:
      enabled: false
    username: opik
    password: opik
  serviceAccount:
    annotations: {}
    create: false
    name: ""
  zookeeper:
      host: opik-zookeeper
  backup:
    enabled: false
    successfulJobsHistoryLimit: 1
    serviceAccount:
      annotations: {}
      create: false
      name: ""
    schedule: "0 0 * * *" # daily at midnight
    extraEnv: {}
    command:
      - /bin/bash
      - '-cx'
      - |-
        export backupname=backup$(date +'%Y%m%d%H%M')
        echo "BACKUP ALL EXCEPT DATABASE system TO S3('${CLICKHOUSE_BACKUP_BUCKET}/${backupname}/', '$ACCESS_KEY', '$SECRET_KEY');" > /tmp/backQuery.sql
        clickhouse-client -h clickhouse-opik-clickhouse --send_timeout 600000 --receive_timeout 600000 --port 9000 --queries-file=/tmp/backQuery.sql
    restore:
      # Set to true to create the restore job (does not run by default).
      # IMPORTANT: set this back to false once the restore has completed.
      # Otherwise the next `helm upgrade` re-creates the job and restores again.
      createJob: false
      # -- Name of the backup to restore, REQUIRED when createJob is true (Helm
      # rendering fails otherwise). Must be a `name` from the backup server's
      # `/backup/list`, e.g. "2026-01-16" — a backup the backup server created.
      # Backups written by the SQL-based CronJob above cannot be restored by it.
      backupName: ""
      # Override with any image that has bash and curl — the job needs nothing else.
      image: "amazon/aws-cli:2.27.49"
      # Hard cap on the job runtime (seconds) so a stuck restore whose status
      # never resolves cannot run forever. Default: 24h.
      activeDeadlineSeconds: 86400
      extraEnv: {}
      resources:
        limits:
          cpu: 10m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
      nodeSelector: {}  # Defaults to .Values.clickhouse.nodeSelector if not specified
      affinity: {}  # Defaults to .Values.clickhouse.affinity if not specified
      tolerations: []  # Defaults to .Values.clickhouse.tolerations if not specified
  backupServer:
    enabled: false
    image: altinity/clickhouse-backup:2.6.39
    port: 7171
    # Service the restore job uses to reach the clickhouse-backup REST API.
    # The backup port is exposed on the operator's per-replica service, so this
    # defaults (in the restore job template) to chi-<opik.name>-clickhouse-cluster-0-0
    # — opik.name, not the release name — on service.port, falling back to
    # backupServer.port. Override name/port if your shard/replica layout differs.
    service:
      name: ""
      port: ""
    monitoring:
      enabled: false
      additionalLabels: {}
      annotations: {}
      service:
        type: ClusterIP
        ports:
          - name: ch-backup-rest
            port: 80
            targetPort: 7171
      serviceMonitor:
        enabled: false
        additionalLabels: {}
        annotations: {}
        namespace: ""
        portName: ""
        interval: "60s"
        scrapeTimeout: "30s"
        relabelings: []
        metricRelabelings: []
        podTargetLabels: []
        honorLabels: false
    # -- (list) Additional volumes to add to the ClickHouse pod when the backup
    # server is enabled. Use this for non-PVC volume types (emptyDir, configMap,
    # secret, hostPath, etc.). For persistent storage, prefer using
    # `clickhouse.extraVolumeClaimTemplates` to define a CHI-managed PVC and
    # reference its name directly in `extraVolumeMounts` below (the clickhouse
    # operator matches volumeMount names to volumeClaimTemplate names
    # automatically). Note that `clickhouse-backup` writes local backups to
    # `/var/lib/clickhouse/backup/` by default (on the same filesystem as
    # ClickHouse data to preserve hard links). Mounting a separate volume at
    # that path will cause backups to use full copies instead of hard links.
    extraVolumes: []
    # -- (list) Additional volume mounts for the `clickhouse-backup` container.
    # The mount name can reference a CHI `volumeClaimTemplate` defined in
    # `clickhouse.extraVolumeClaimTemplates` (matched by name), or a volume
    # defined in `extraVolumes` above.
    extraVolumeMounts: []
    env:
      LOG_LEVEL: info
      ALLOW_EMPTY_BACKUPS: true
      API_LISTEN: 0.0.0.0:7171
      API_CREATE_INTEGRATION_TABLES: true
  monitoring:
    enabled: false
    username: opikmon # readonly user
    password: opikmon
    useSecret:
      enabled: false
    # resources:
    #   requests:
    #     cpu: 300m
    #     memory: 1Gi
    #   limits:
    #     memory: 1Gi
    additionalLabels: {}
    annotations: {}
    port: 9363
    service:
      type: ClusterIP
      ports:
        - name: prometheus-metrics
          port: 80
          targetPort: 9363
    serviceMonitor:
      enabled: false
      additionalLabels: {}
      annotations: {}
      namespace: ""
      portName: ""
      interval: "60s"
      scrapeTimeout: "30s"
      relabelings: []
      metricRelabelings: []
      podTargetLabels: []
      honorLabels: false
  namespaceDomainPattern:  ""

zookeeper:
  enabled: true
  fullnameOverride: opik-zookeeper
  # Server ID offset for Zookeeper cluster. Default is 1 for compatibility with
  # previous Bitnami-based installations. Set to 0 only for fresh installs.
  serverIdOffset: 1
  image:
    registry: docker.io
    repository: zookeeper
    tag: "3.9.4"
    imagePullPolicy: IfNotPresent
  replicaCount: 1
  podDisruptionBudget:
    enabled: true
  persistence:
    # Use bitnami zookeeper data directory path for compatibility
    mountPath: /bitnami/zookeeper
    dataDir: /bitnami/zookeeper/data
    enabled: true
    size: "50Gi"
  headless:
    publishNotReadyAddresses: true
  extraEnvVars:
    - name: ZK_HEAP_SIZE
      value: "512M"
    - name: ZOO_DATA_DIR
      value: "/bitnami/zookeeper/data"
  commonLabels:
    app.kubernetes.io/name: zookeeper-opik

    # resources:
