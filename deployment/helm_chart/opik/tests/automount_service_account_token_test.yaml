suite: python-backend service account token automount

templates:
  - templates/deployment.yaml

tests:
  - it: mounts the service account token by default
    documentSelector:
      path: metadata.name
      value: opik-python-backend
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: keeps the service account token out of the pod when disabled
    set:
      component.python-backend.automountServiceAccountToken: false
    documentSelector:
      path: metadata.name
      value: opik-python-backend
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: leaves components without the setting on the Kubernetes default
    documentSelector:
      path: metadata.name
      value: opik-backend
    asserts:
      - notExists:
          path: spec.template.spec.automountServiceAccountToken

  - it: refuses a non-boolean value
    set:
      component.python-backend.automountServiceAccountToken: "false"
    asserts:
      - failedTemplate:
          errorMessage: component.python-backend.automountServiceAccountToken must be a boolean
