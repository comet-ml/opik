suite: clickhouse user passwords render as the exact configured string

# Unquoted, YAML retypes a password (0123, true, null) or truncates it at " #", so ClickHouse gets another password
# than the backend, whose ANALYTICS_DB_PASS is quoted.

templates:
  - templates/clickhouseinstallation.yaml

tests:
  - it: renders the default admin password
    asserts:
      - equal:
          path: spec.configuration.users["opik/password"]
          value: opik

  - it: keeps admin passwords YAML would retype or cut
    set:
      clickhouse.adminUser.password: "a/b?c #d@e:f%40g=h+i'j\"k"
    asserts:
      - equal:
          path: spec.configuration.users["opik/password"]
          value: "a/b?c #d@e:f%40g=h+i'j\"k"

  - it: keeps a numeric-looking admin password a string
    set:
      clickhouse.adminUser.password: "0123"
    asserts:
      - equal:
          path: spec.configuration.users["opik/password"]
          value: "0123"

  - it: keeps a boolean-looking admin password a string
    set:
      clickhouse.adminUser.password: "true"
    asserts:
      - equal:
          path: spec.configuration.users["opik/password"]
          value: "true"

  - it: references the secret, not a password, when the admin uses a secret
    set:
      clickhouse.adminUser.useSecret.enabled: true
    asserts:
      - exists:
          path: spec.configuration.users["opik/k8s_secret_password"]
      - notExists:
          path: spec.configuration.users["opik/password"]

  - it: keeps monitoring passwords YAML would retype or cut
    set:
      clickhouse.monitoring.enabled: true
      clickhouse.monitoring.password: "null #x"
    asserts:
      - equal:
          path: spec.configuration.users["opikmon/password"]
          value: "null #x"

  - it: renders no monitoring password when none is set
    set:
      clickhouse.monitoring.enabled: true
      clickhouse.monitoring.password: ""
    asserts:
      - notExists:
          path: spec.configuration.users["opikmon/password"]

  - it: keeps additional user passwords as configured
    set:
      clickhouse.additionalUsers:
        - username: plain
          password: secret123
        - username: special
          password: "a/b?c #d@e:f"
        - username: numeric
          password: "0123"
    asserts:
      - equal:
          path: spec.configuration.users["plain/password"]
          value: secret123
      - equal:
          path: spec.configuration.users["special/password"]
          value: "a/b?c #d@e:f"
      - equal:
          path: spec.configuration.users["numeric/password"]
          value: "0123"

  # Existing values files may carry such users; the chart must keep rendering them as before, not fail the upgrade.
  - it: renders an empty password for an additional user without one
    set:
      clickhouse.additionalUsers:
        - username: nopass
        - username: emptypass
          password: ""
    asserts:
      - isNull:
          path: spec.configuration.users["nopass/password"]
      - isNull:
          path: spec.configuration.users["emptypass/password"]

  - it: references the secret, not a password, for additional users when the admin uses a secret
    set:
      clickhouse.adminUser.useSecret.enabled: true
      clickhouse.additionalUsers:
        - username: extra
          password: ignored
    asserts:
      - exists:
          path: spec.configuration.users["extra/k8s_secret_password"]
      - notExists:
          path: spec.configuration.users["extra/password"]
