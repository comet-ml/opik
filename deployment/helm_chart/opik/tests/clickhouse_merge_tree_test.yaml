suite: clickhouse merge/reclaim settings (opt-in)

# Force-merge is opt-in: enabling it on an install with a large backlog of old parts queues
# every one of them for a multi-hour merge at once, starving mutations (deletes).

templates:
  - templates/clickhouseinstallation.yaml

tests:
  - it: renders no merge_tree.xml by default
    asserts:
      - notExists:
          path: spec.configuration.files["conf.d/merge_tree.xml"]

  - it: renders merge_tree.xml when explicitly set
    set:
      clickhouse:
        configuration:
          files:
            conf.d/merge_tree.xml: "<clickhouse><merge_tree><min_age_to_force_merge_seconds>604800</min_age_to_force_merge_seconds></merge_tree></clickhouse>"
    asserts:
      - matchRegex:
          path: spec.configuration.files["conf.d/merge_tree.xml"]
          pattern: "<min_age_to_force_merge_seconds>604800</min_age_to_force_merge_seconds>"
