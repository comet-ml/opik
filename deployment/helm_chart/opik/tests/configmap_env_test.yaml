suite: backend configmap env

# Baseline render assertions for the backend env ConfigMap
# (templates/configmap-backend.yaml). Component `env` maps in values.yaml are
# rendered as ConfigMap data keys (and consumed by the deployment via envFrom),
# so the ConfigMap is where env values are asserted.
templates:
  - templates/configmap-backend.yaml

tests:
  - it: backend env values from values.yaml land in the configmap
    documentSelector:
      path: metadata.name
      value: opik-backend
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.STATE_DB_USER
          value: opik
      - equal:
          path: data.ANALYTICS_DB_PORT
          value: "8123"

  - it: extra env keys set on the component are emitted
    set:
      component.backend.env.MY_CUSTOM_FLAG: enabled
    documentSelector:
      path: metadata.name
      value: opik-backend
    asserts:
      - equal:
          path: data.MY_CUSTOM_FLAG
          value: enabled

  # Hyperscale flags derived from the clickhouse / databaseAnalytics values (OPIK-6880).
  - it: derives the cluster readiness probe and UUID validation window from the chart defaults
    documentSelector:
      path: metadata.name
      value: opik-backend
    asserts:
      - equal:
          path: data.ANALYTICS_DB_CLUSTER_HEALTH_CHECK_ENABLED
          value: "false"
      - equal:
          path: data.UUID_VALIDATION_WINDOW
          value: "86400000ms"

  - it: turns the cluster readiness probe on with the sharding switch
    set:
      clickhouse.sharding.enabled: true
    documentSelector:
      path: metadata.name
      value: opik-backend
    asserts:
      - equal:
          path: data.ANALYTICS_DB_CLUSTER_HEALTH_CHECK_ENABLED
          value: "true"

  - it: renders the UUID validation window in milliseconds
    set:
      databaseAnalytics.uuidV7ValidationWindowMs: 43200000
    documentSelector:
      path: metadata.name
      value: opik-backend
    asserts:
      - equal:
          path: data.UUID_VALIDATION_WINDOW
          value: "43200000ms"

  - it: an explicit component env key wins over the derived value
    set:
      clickhouse.sharding.enabled: true
      component.backend.env.ANALYTICS_DB_CLUSTER_HEALTH_CHECK_ENABLED: "false"
      component.backend.env.UUID_VALIDATION_WINDOW: 36h
    documentSelector:
      path: metadata.name
      value: opik-backend
    asserts:
      - equal:
          path: data.ANALYTICS_DB_CLUSTER_HEALTH_CHECK_ENABLED
          value: "false"
      - equal:
          path: data.UUID_VALIDATION_WINDOW
          value: "36h"

  - it: the derived keys are backend-only
    documentSelector:
      path: metadata.name
      value: opik-python-backend
    asserts:
      - notExists:
          path: data.ANALYTICS_DB_CLUSTER_HEALTH_CHECK_ENABLED
      - notExists:
          path: data.UUID_VALIDATION_WINDOW

  - it: backend configmap is not rendered when backendConfigMap is disabled
    set:
      component.backend.backendConfigMap.enabled: false
    documentSelector:
      path: metadata.name
      value: opik-backend
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
