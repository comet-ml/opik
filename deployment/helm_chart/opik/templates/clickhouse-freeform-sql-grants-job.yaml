{{- /*
Provisions the Agent Insights read-only free-form SQL ClickHouse user: its settings
profile, SELECT grants and per-workspace/project RESTRICTIVE row policies.

Mirrors apps/opik-backend/provision_agent_insights_readonly_user.sh, which docker-compose
runs between run_db_migrations.sh and entrypoint.sh. Kubernetes has no equivalent step, so
this Job is that path for helm installs.

The user must be SQL-created rather than declared in the CHI: XML-storage users cannot be
GRANTed to. The settings profile is created here too rather than declared in
clickhouse.additionalProfiles, because that is a list and a downstream override replaces it
instead of merging, which silently drops a chart-supplied entry. Creating it here means it
coexists with whatever profiles an installation declares.

All access DDL uses ON CLUSTER: local_directory access storage is not replicated, so
without it a multi-replica installation gets these objects on one node only.
*/}}
{{- if and .Values.clickhouse.enabled .Values.clickhouse.freeformSql.enabled }}
  {{- $tables := .Values.clickhouse.freeformSql.tables }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opik.name" $ }}-clickhouse-freeform-sql-grants
  labels:
    {{- include "opik.labels" $ | nindent 4 }}
  annotations:
  {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
  {{- else }}
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: clickhouse-freeform-sql-grants
      {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.clickhouse.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apply-grants
          image: {{ .Values.clickhouse.freeformSql.image | default .Values.clickhouse.image }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.component.backend.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              RO_USER="${ANALYTICS_DB_READ_ONLY_FREEFORM_SQL_USER:-comet_readonly_freeform_sql_user}"
              RO_PASS="${ANALYTICS_DB_READ_ONLY_FREEFORM_SQL_PASS:-}"
              ADMIN_HOST="${ANALYTICS_DB_HOST:-}"
              ADMIN_USER="${ANALYTICS_DB_USERNAME:-}"
              ADMIN_PASS="${ANALYTICS_DB_PASS:-}"
              DB="${ANALYTICS_DB_DATABASE_NAME:-opik}"
              if [ -z "$ADMIN_HOST" ] || [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASS" ] || [ -z "$RO_PASS" ]
              then
                echo "ERROR: this Job reads ANALYTICS_DB_HOST/USERNAME/PASS and ANALYTICS_DB_READ_ONLY_FREEFORM_SQL_PASS from the same env as opik-backend (component.backend.envFrom). One of them is empty." >&2
                exit 1
              fi
              # Native protocol on 9000, the clickhouse-client default; ANALYTICS_DB_PORT is
              # the HTTP port. Unquoted heredoc so the env vars expand into the SQL at run
              # time. CREATE ensures existence, ALTER reconciles the profile, SQL_* defaults
              # and password on every run, and row policies use OR REPLACE so predicate
              # changes re-apply on upgrade. stderr is redacted because clickhouse-client
              # echoes a failing statement back with the password inlined.
              clickhouse-client --host "$ADMIN_HOST" --user "$ADMIN_USER" --password "$ADMIN_PASS" --multiquery <<EOSQL 2>&1 | sed -E "s/IDENTIFIED BY '[^']*'/IDENTIFIED BY '****'/g"
              CREATE SETTINGS PROFILE IF NOT EXISTS comet_llm_readonly_freeform_sql_profile ON CLUSTER '{cluster}'
                SETTINGS readonly = 1,
                         max_execution_time = 180,
                         max_memory_usage = 8589934592,
                         max_result_rows = 100000,
                         result_overflow_mode = 'throw',
                         max_rows_to_read = 100000000,
                         read_overflow_mode = 'throw',
                         max_concurrent_queries_for_user = 5,
                         use_skip_indexes_if_final = 1;
              CREATE USER IF NOT EXISTS ${RO_USER} ON CLUSTER '{cluster}' IDENTIFIED BY '${RO_PASS}';
              ALTER USER ${RO_USER} ON CLUSTER '{cluster}' IDENTIFIED BY '${RO_PASS}'
                SETTINGS PROFILE comet_llm_readonly_freeform_sql_profile,
                         SQL_workspace_id = '' CHANGEABLE_IN_READONLY,
                         SQL_project_id = '' CHANGEABLE_IN_READONLY;
  {{- range $tables }}
              GRANT ON CLUSTER '{cluster}' SELECT ON ${DB}.{{ . }} TO ${RO_USER};
              CREATE ROW POLICY OR REPLACE {{ . }}_workspace_project_isolation ON CLUSTER '{cluster}' ON ${DB}.{{ . }} FOR SELECT USING workspace_id = getSetting('SQL_workspace_id') AND project_id = getSetting('SQL_project_id') AS RESTRICTIVE TO ${RO_USER};
  {{- end }}
              SHOW GRANTS FOR ${RO_USER};
              EOSQL
              echo "OK: ${RO_USER} ready on ${DB}: profile comet_llm_readonly_freeform_sql_profile, SELECT grants + RESTRICTIVE row policies on {{ $tables | join ", " }}"
  {{- with .Values.clickhouse.freeformSql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
  {{- end }}
{{- end }}
