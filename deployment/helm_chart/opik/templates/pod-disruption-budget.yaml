{{- range $key, $value := .Values.component }}
{{- if and $value.enabled $value.podDisruptionBudget (hasKey $value.podDisruptionBudget "enabled") $value.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opik.name" $ }}-{{ $key | lower }}
  labels:
    component: {{ include "opik.name" $ }}-{{ $key | lower }}
    {{- include "opik.labels" $ | nindent 4 }}
  {{- with $value.podDisruptionBudget.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /*
    A configured value wins only when it is a number or a non-empty string:
    that keeps an explicit 0 (falsy in Go templates, but a valid PDB value)
    while ignoring null/""/false, which would render an invalid policy/v1 PDB.
  */}}
  {{- $min := $value.podDisruptionBudget.minAvailable }}
  {{- $max := $value.podDisruptionBudget.maxUnavailable }}
  {{- $hasMin := or (kindIs "float64" $min) (kindIs "int" $min) (and (kindIs "string" $min) (ne $min "")) }}
  {{- $hasMax := or (kindIs "float64" $max) (kindIs "int" $max) (and (kindIs "string" $max) (ne $max "")) }}
  {{- if and $hasMin $hasMax }}
  {{- fail (printf "podDisruptionBudget for component %s sets both minAvailable (%v) and maxUnavailable (%v); a PodDisruptionBudget accepts only one" $key $min $max) }}
  {{- end }}
  {{- if $hasMin }}
  minAvailable: {{ $min }}
  {{- else if $hasMax }}
  maxUnavailable: {{ $max }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "opik.selectorLabels" $ | nindent 6 }}
      component: {{ include "opik.name" $ }}-{{ $key | lower }}
{{- end }}
{{- end }}
