{{- if and .Values.clickhouse.enabled .Values.clickhouse.tieredStorage.enabled .Values.clickhouse.tieredStorage.coldTierMigration.enabled }}
{{- /*
  Recreates any ClickHouse StatefulSet still missing the cold-tier cache volume
  after the cold tier is enabled: orphan-delete (pods + data PVCs preserved) so
  the operator re-adds the mount, one replica at a time, until all are Ready.
  No-op when every replica already has the cache volume.
*/ -}}
{{- $cacheVct := .Values.clickhouse.tieredStorage.cold.cache.volumeName -}}
{{- $cachePath := .Values.clickhouse.tieredStorage.cold.cache.path -}}
{{- $chiName := printf "%s-clickhouse" (include "opik.name" $) -}}
{{- $pollTimeout := int .Values.clickhouse.tieredStorage.coldTierMigration.pollTimeoutSeconds -}}
{{- $activeDeadline := int .Values.clickhouse.tieredStorage.coldTierMigration.activeDeadlineSeconds -}}
{{- /* The Job's hard cap must outlast the script's own budget, else Kubernetes
       kills a legitimately-running migration. */ -}}
{{- if le $activeDeadline $pollTimeout }}
{{- fail (printf "clickhouse.tieredStorage.coldTierMigration.activeDeadlineSeconds (%d) must be greater than pollTimeoutSeconds (%d)" $activeDeadline $pollTimeout) }}
{{- end -}}
{{- /* Effective SA name for the Job and the RoleBinding subject. When
       serviceAccountName is overridden the account is externally managed, so we
       reference it but do NOT render (and hook-delete) the chart's SA object. */ -}}
{{- $saOverride := .Values.clickhouse.tieredStorage.coldTierMigration.serviceAccountName -}}
{{- $sa := $saOverride | default (printf "%s-ch-cold-tier-migration-sa" (include "opik.fullname" .)) -}}
{{- if not $saOverride }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
    {{- else }}
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opik.fullname" . }}-ch-cold-tier-migration-role
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
    {{- else }}
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
rules:
  # Recreate the affected CH StatefulSet (orphan-delete) + reschedule its pod.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opik.fullname" . }}-ch-cold-tier-migration-rb
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
    {{- else }}
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opik.fullname" . }}-ch-cold-tier-migration-role
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opik.fullname" . }}-ch-cold-tier-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opik.labels" $ | nindent 4 }}
    component: {{ include "opik.name" $ }}-ch-cold-tier-migration
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "15"
    {{- else }}
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
spec:
  backoffLimit: 2
  # Kubernetes hard cap on the Job. The script bounds its own work by
  # pollTimeoutSeconds (a single shared budget across migration + readiness), so
  # this only needs a small buffer on top for startup/kubectl overhead.
  activeDeadlineSeconds: {{ $activeDeadline }}
  template:
    metadata:
      labels:
        app: ch-cold-tier-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $sa }}
      {{- with (.Values.clickhouse.tieredStorage.coldTierMigration.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.clickhouse.tieredStorage.coldTierMigration.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migration
          image: {{ .Values.clickhouse.tieredStorage.coldTierMigration.image }}
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CHI_NAME
              value: {{ $chiName | quote }}
            - name: CACHE_VCT
              value: {{ $cacheVct | quote }}
            - name: CACHE_PATH
              value: {{ $cachePath | quote }}
            - name: POLL_TIMEOUT
              value: {{ .Values.clickhouse.tieredStorage.coldTierMigration.pollTimeoutSeconds | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "=== Cold-tier enable migration (recreate StatefulSets missing the cache volume) ==="
              echo "namespace=${NAMESPACE} chi=${CHI_NAME} cacheVct=${CACHE_VCT} cachePath=${CACHE_PATH}"

              # Operator-managed CH StatefulSets for this CHI.
              CH_STS_SELECTOR="clickhouse.altinity.com/chi=${CHI_NAME}"

              # Single shared budget for the whole run (migration + readiness).
              DEADLINE=$(( $(date +%s) + POLL_TIMEOUT ))
              remaining() { r=$(( DEADLINE - $(date +%s) )); [ "$r" -gt 0 ] && echo "$r" || echo 0; }

              # Fail loud on a failed kubectl read rather than mistaking an API/RBAC
              # outage for "nothing to do".
              die() { echo "ERROR: $*" >&2; exit 1; }

              # Confirm the STS is owned by THIS CHI's operator before we touch it,
              # so a stray StatefulSet that merely shares the label is never deleted.
              # A failed read aborts (never treated as "unowned").
              owned_by_chi() {
                owner=$(kubectl get "sts/$1" -n "$NAMESPACE" \
                  -o jsonpath='{.metadata.ownerReferences[?(@.kind=="ClickHouseInstallation")].name}') \
                  || die "reading ownerReferences of sts/$1 failed"
                [ "$owner" = "$CHI_NAME" ]
              }

              # A StatefulSet needs recreation when it lacks the cache VCT. A failed
              # list aborts so a discovery outage is never reported as a clean no-op.
              sts_missing_cache_vct() {
                stses=$(kubectl get sts -n "$NAMESPACE" -l "$CH_STS_SELECTOR" -o name) \
                  || die "listing ClickHouse StatefulSets failed"
                for sts in $stses; do
                  name="${sts#statefulset.apps/}"
                  owned_by_chi "$name" || continue
                  vcts=$(kubectl get "$sts" -n "$NAMESPACE" \
                    -o jsonpath='{range .spec.volumeClaimTemplates[*]}{.metadata.name}{" "}{end}') \
                    || die "reading volumeClaimTemplates of $sts failed"
                  case " $vcts " in
                    *" ${CACHE_VCT} "*) : ;;  # already has it
                    *) echo "$name" ;;        # missing -> needs recreation
                  esac
                done
              }

              # Orphan-delete the STS (keeps pod + data PVC) so the operator recreates
              # it WITH the cache VCT, delete the pod so it remounts, then wait for
              # THAT pod to come back Ready before returning — one host at a time.
              recreate_one() {
                sts="$1"
                pod="${sts}-0"
                echo ">> orphan-deleting StatefulSet ${sts} (keeps pod + data PVC); operator recreates it WITH ${CACHE_VCT}"
                kubectl delete "sts/${sts}" -n "$NAMESPACE" --cascade=orphan --wait=true
                echo ">> deleting pod ${pod} so it reschedules with the ${CACHE_PATH} mount"
                kubectl delete "pod/${pod}" -n "$NAMESPACE" --grace-period=0 --ignore-not-found=true

                # Poll (not a fixed sleep) until the operator has recreated the pod
                # and it is Ready, so we never advance to the next replica — or exit
                # the loop — while this one is still restarting.
                echo ">> waiting for ${pod} to be recreated and Ready"
                while :; do
                  left="$(remaining)"
                  if [ "$left" -eq 0 ]; then
                    echo "ERROR: ${pod} not Ready within budget (${POLL_TIMEOUT}s)" >&2
                    kubectl get sts,pods -n "$NAMESPACE" -l "$CH_STS_SELECTOR" 2>/dev/null || true
                    exit 1
                  fi
                  # --timeout must be >0 (0 means wait forever); cap each attempt.
                  [ "$left" -gt 30 ] && left=30
                  if kubectl get "pod/${pod}" -n "$NAMESPACE" >/dev/null 2>&1 \
                     && kubectl wait --for=condition=Ready "pod/${pod}" \
                          -n "$NAMESPACE" --timeout="${left}s" >/dev/null 2>&1; then
                    echo ">> ${pod} Ready"
                    return 0
                  fi
                  sleep 5
                done
              }

              migrated_any=0
              while :; do
                # Don't mask a discovery failure: a die() inside the subshell exits
                # non-zero here, and we abort rather than treat it as "nothing to do".
                pending=$(sts_missing_cache_vct) || exit 1
                if [ -z "$pending" ]; then
                  echo "All CH StatefulSets carry ${CACHE_VCT} — nothing to migrate."
                  break
                fi
                echo "StatefulSets missing ${CACHE_VCT}:"
                echo "$pending" | sed 's/^/  - /'
                # One host at a time — the operator processes replicas sequentially.
                first=$(echo "$pending" | head -n1)
                recreate_one "$first"
                migrated_any=1
              done

              if [ "$migrated_any" -eq 1 ]; then
                echo "=== Cold-tier migration complete — all replicas Ready with ${CACHE_VCT} ==="
              else
                echo "=== No migration needed — cold tier already healthy ==="
              fi
{{- end }}
