{{- if and .Values.clickhouse.enabled .Values.clickhouse.tieredStorage.enabled .Values.clickhouse.tieredStorage.coldTierMigration.enabled }}
{{- /*
  When the cold tier is enabled, the ClickHouse operator can push the new
  storage.xml to a pod before rebuilding its StatefulSet with the cache volume,
  leaving the pod crash-looping. This job recovers it by bouncing the altinity
  ClickHouse operator pod: a fresh operator rebuilds each StatefulSet WITH the
  cache volume on its first reconcile pass. The job itself never deletes the
  ClickHouse StatefulSets, pods, or data path — it only restarts the operator —
  so recovery is far faster than the ~7 min/replica passive self-heal (the
  operator's own rebuild may still briefly restart the wedged pod). No-op when
  the cluster is already healthy.

  Scope: readiness is detected from the cache VCT on the StatefulSet, which
  assumes the chart's default pod template (where the cache VCT and its mount at
  cachePath are coupled). A custom clickhouse.templates.podTemplate /
  extraPodTemplates that adds the VCT without mounting it at cachePath is not
  supported by this job.
*/ -}}
{{- $cacheVct := .Values.clickhouse.tieredStorage.cold.cache.volumeName -}}
{{- $cachePath := .Values.clickhouse.tieredStorage.cold.cache.path -}}
{{- $chiName := printf "%s-clickhouse" (include "opik.name" $) -}}
{{- $pollTimeout := int .Values.clickhouse.tieredStorage.coldTierMigration.pollTimeoutSeconds -}}
{{- $activeDeadline := int .Values.clickhouse.tieredStorage.coldTierMigration.activeDeadlineSeconds -}}
{{- /* pollTimeoutSeconds is the script's whole budget; a non-positive value makes
       remaining() return 0 immediately, so the job would exit without bouncing the
       operator or polling readiness. Require a positive integer. */ -}}
{{- if le $pollTimeout 0 }}
{{- fail (printf "clickhouse.tieredStorage.coldTierMigration.pollTimeoutSeconds (%d) must be a positive integer" $pollTimeout) }}
{{- end -}}
{{- /* The Job's hard cap must outlast the script's own budget, else Kubernetes
       kills a legitimately-running migration. */ -}}
{{- if le $activeDeadline $pollTimeout }}
{{- fail (printf "clickhouse.tieredStorage.coldTierMigration.activeDeadlineSeconds (%d) must be greater than pollTimeoutSeconds (%d)" $activeDeadline $pollTimeout) }}
{{- end -}}
{{- /* The migration job runs in .Release.Namespace and its RBAC is namespace-scoped
       there, so it can only reach an operator in the same namespace. If the operator
       subchart is relocated via namespaceOverride, this job can't find/bounce it —
       reject that combination at render time rather than fail silently at runtime. */ -}}
{{- $operatorValues := index .Values "altinity-clickhouse-operator" | default dict -}}
{{- if $operatorValues.namespaceOverride }}
{{- fail "clickhouse.tieredStorage.coldTierMigration is incompatible with altinity-clickhouse-operator.namespaceOverride (the migration job is namespace-scoped to the release namespace); set coldTierMigration.enabled=false or remove namespaceOverride" }}
{{- end -}}
{{- /* The operator pod is found by the subchart's default app.kubernetes.io/name
       (altinity-clickhouse-operator). name/fullnameOverride change that label, so the
       selector would match nothing and the bounce would be silently skipped — reject
       at render time rather than degrade to passive self-heal without warning. */ -}}
{{- if or $operatorValues.nameOverride $operatorValues.fullnameOverride }}
{{- fail "clickhouse.tieredStorage.coldTierMigration is incompatible with altinity-clickhouse-operator.nameOverride/fullnameOverride (the migration job locates the operator by its default app.kubernetes.io/name); set coldTierMigration.enabled=false or remove the override" }}
{{- end -}}
{{- /* Effective SA name for the Job and the RoleBinding subject. When
       serviceAccountName is overridden the account is externally managed, so we
       reference it but do NOT render (and hook-delete) the chart's SA object. */ -}}
{{- $saOverride := .Values.clickhouse.tieredStorage.coldTierMigration.serviceAccountName -}}
{{- $sa := $saOverride | default (printf "%s-ch-cold-tier-migration-sa" (include "opik.fullname" .)) -}}
{{- /* SA/Role/RoleBinding use BeforeHookCreation, not HookSucceeded: ArgoCD marks
       non-Job hook resources succeeded immediately and would reap the SA out from
       under the running Job. Trade-off: the delete-on-pods Role persists between
       syncs — intended; do not switch to HookSucceeded. */ -}}
{{- if not $saOverride }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
    {{- else }}
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opik.fullname" . }}-ch-cold-tier-migration-role
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
    {{- else }}
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
rules:
  # Detect the wedge (read CH StatefulSets) and wait for readiness (watch).
  # No delete on StatefulSets — recovery only bounces the operator pod.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  # delete is needed only to bounce the altinity operator pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opik.fullname" . }}-ch-cold-tier-migration-rb
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
    {{- else }}
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opik.fullname" . }}-ch-cold-tier-migration-role
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opik.fullname" . }}-ch-cold-tier-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opik.labels" $ | nindent 4 }}
    component: {{ include "opik.name" $ }}-ch-cold-tier-migration
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.global.argocd }}
    argocd.argoproj.io/hook: PostSync
    # BeforeHookCreation too: the Job may fail, and its fixed name would otherwise
    # wedge the PostSync phase of every later sync.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "15"
    {{- else }}
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
spec:
  backoffLimit: 0
  # Kubernetes hard cap on the Job. The script bounds its own work by
  # pollTimeoutSeconds (a single shared budget across migration + readiness), so
  # this only needs a small buffer on top for startup/kubectl overhead.
  activeDeadlineSeconds: {{ $activeDeadline }}
  template:
    metadata:
      labels:
        app: ch-cold-tier-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $sa }}
      {{- with (.Values.clickhouse.tieredStorage.coldTierMigration.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.clickhouse.tieredStorage.coldTierMigration.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migration
          image: {{ .Values.clickhouse.tieredStorage.coldTierMigration.image }}
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CHI_NAME
              value: {{ $chiName | quote }}
            - name: CACHE_VCT
              value: {{ $cacheVct | quote }}
            - name: CACHE_PATH
              value: {{ $cachePath | quote }}
            - name: POLL_TIMEOUT
              # Emit the int-parsed value so a non-integer override can't reach the shell.
              value: {{ $pollTimeout | quote }}
            - name: OPERATOR_SELECTOR
              # The altinity operator subchart's own selector labels, scoped to this
              # release — identifies the operator pod without a name substring.
              value: "app.kubernetes.io/name=altinity-clickhouse-operator,app.kubernetes.io/instance={{ .Release.Name }}"
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "=== Cold-tier enable migration (bounce the ClickHouse operator to rebuild StatefulSets with the cache volume) ==="
              echo "namespace=${NAMESPACE} chi=${CHI_NAME} cacheVct=${CACHE_VCT} cachePath=${CACHE_PATH}"

              # Operator-managed CH StatefulSets/pods for this CHI.
              CH_STS_SELECTOR="clickhouse.altinity.com/chi=${CHI_NAME}"

              DEADLINE=$(( $(date +%s) + POLL_TIMEOUT ))
              remaining() { r=$(( DEADLINE - $(date +%s) )); [ "$r" -gt 0 ] && echo "$r" || echo 0; }
              die() { echo "ERROR: $*" >&2; exit 1; }

              # Migration state of this CHI's StatefulSets:
              #   none    -> no CH StatefulSet exists yet (operator hasn't created it)
              #   missing -> a StatefulSet lacks the cache VCT; in strict mode also
              #              when it has the VCT but not all replicas are Ready
              #   ok      -> every StatefulSet carries the cache VCT
              #
              # Detection uses vct-only: this hook fires while the operator is already
              # rolling pods on any routine upgrade, so counting mid-roll as "missing"
              # would bounce a healthy operator. Only the post-bounce wait is strict.
              migration_state() {
                mode="${1:-vct-only}"
                stses=$(kubectl get sts -n "$NAMESPACE" -l "$CH_STS_SELECTOR" -o name) \
                  || die "listing ClickHouse StatefulSets failed"
                if [ -z "$stses" ]; then echo none; return 0; fi
                for sts in $stses; do
                  vcts=$(kubectl get "$sts" -n "$NAMESPACE" \
                    -o jsonpath='{range .spec.volumeClaimTemplates[*]}{.metadata.name}{" "}{end}') \
                    || die "reading volumeClaimTemplates of $sts failed"
                  case " $vcts " in
                    *" ${CACHE_VCT} "*) : ;;
                    *) echo missing; return 0 ;;
                  esac
                  [ "$mode" = "strict" ] || continue
                  desired=$(kubectl get "$sts" -n "$NAMESPACE" -o jsonpath='{.spec.replicas}') \
                    || die "reading .spec.replicas of $sts failed"
                  ready=$(kubectl get "$sts" -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}')
                  [ "${ready:-0}" = "${desired:-0}" ] || { echo missing; return 0; }
                done
                echo ok
              }

              # Ready operator pods for OPERATOR_SELECTOR, restricted to ReplicaSet-owned
              # ones so a bare/spoofed pod carrying the labels is never deleted. Ready
              # also filters out Terminating/Evicted pods mid-rollout.
              operator_pods() {
                names=$(kubectl get pods -n "$NAMESPACE" -l "$OPERATOR_SELECTOR" \
                  -o 'jsonpath={range .items[?(@.status.phase=="Running")]}{.metadata.name}:{.metadata.ownerReferences[0].kind}:{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}') \
                  || return 1
                for entry in $names; do
                  case "$entry" in
                    *:ReplicaSet:True) echo "pod/${entry%%:*}" ;;
                  esac
                done
              }

              # Poll for exactly one operator pod: the operator Deployment rolls on any
              # image/ConfigMap change in the same upgrade, so >1 is transient. On
              # timeout print nothing — the caller falls back to passive self-heal.
              resolve_operator_pod() {
                while :; do
                  if found="$(operator_pods)"; then
                    n=$(printf '%s\n' "$found" | grep -c . || true)
                    if [ "$n" -eq 1 ]; then
                      printf '%s\n' "$found"
                      return 0
                    fi
                    echo "   ${n} Ready operator pods — waiting for exactly one..." >&2
                  else
                    echo "   transient error listing operator pods — retrying..." >&2
                  fi
                  if [ "$(remaining)" -eq 0 ]; then
                    return 0
                  fi
                  sleep 10
                done
              }

              # Bounce the operator so a fresh reconcile rebuilds every StatefulSet WITH
              # the cache volume. Never deletes CH StatefulSets/pods. Wait (within the
              # deadline) for a StatefulSet to exist before deciding — the operator may
              # not have created it yet when this post-upgrade hook first runs.
              echo ">> checking cluster migration state (waiting for StatefulSets to appear if needed)"
              while :; do
                # `if` suspends set -e, so a blipped API call retries instead of
                # failing the release.
                if ! state="$(migration_state vct-only)"; then
                  echo "   transient error reading ClickHouse StatefulSets — retrying..." >&2
                  state=retry
                fi
                case "$state" in
                  ok)      echo "=== No migration needed — all StatefulSets already carry ${CACHE_VCT} ==="; exit 0 ;;
                  missing) echo ">> a StatefulSet is missing ${CACHE_VCT} — will bounce the operator"; break ;;
                  none)    echo "   no ClickHouse StatefulSet yet — waiting..." ;;
                esac
                [ "$(remaining)" -eq 0 ] && die "no ClickHouse StatefulSet appeared within ${POLL_TIMEOUT}s"
                sleep 10
              done

              op="$(resolve_operator_pod)"
              if [ -z "$op" ]; then
                echo "WARNING: could not resolve exactly one Ready ClickHouse operator pod for ${OPERATOR_SELECTOR} within the remaining budget — the operator is externally managed, renamed, or still rolling. Skipping the bounce; the cluster will self-heal passively (~7 min/replica)." >&2
                exit 0
              fi
              echo ">> bouncing operator ${op#pod/} so it rebuilds the StatefulSets with the cache volume"
              kubectl delete "$op" -n "$NAMESPACE" --grace-period=30

              # Wait until every CH pod is Ready and no StatefulSet is missing the VCT.
              echo ">> waiting for all ClickHouse pods to be Ready with ${CACHE_VCT}"
              last_wait_err=""
              while :; do
                left="$(remaining)"
                if [ "$left" -eq 0 ]; then
                  echo "ERROR: cluster not healthy within ${POLL_TIMEOUT}s after bouncing the operator" >&2
                  [ -n "$last_wait_err" ] && echo "last 'kubectl wait' error: ${last_wait_err}" >&2
                  kubectl get sts,pods -n "$NAMESPACE" -l "$CH_STS_SELECTOR" 2>/dev/null || true
                  exit 1
                fi
                if [ "$(migration_state strict)" = "ok" ]; then
                  [ "$left" -gt 60 ] && left=60
                  # Capture stderr (drop stdout) so a final timeout can report the reason.
                  if last_wait_err="$(kubectl wait --for=condition=Ready pod \
                        -n "$NAMESPACE" -l "$CH_STS_SELECTOR" \
                        --timeout="${left}s" 2>&1 >/dev/null)"; then
                    echo "=== Cold-tier migration complete — all replicas Ready with ${CACHE_VCT} ==="
                    exit 0
                  fi
                fi
                sleep 10
              done
{{- end }}
