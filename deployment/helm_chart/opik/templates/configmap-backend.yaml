{{- range $key, $value := .Values.component }}
{{- if and $value.enabled $value.backendConfigMap.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opik.name" $ }}-{{ $key | lower }}
  labels:
    {{- include "opik.labels" $ | nindent 4 }}
data:
  {{- if eq $key "backend" }}
  {{- if $.Values.minio.enabled }}
  AWS_ACCESS_KEY_ID: {{ $.Values.minio.auth.rootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $.Values.minio.auth.rootPassword | quote }}
  S3_URL: "http://opik-minio:9000"
  {{- else }}
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  IS_MINIO: "false"
  {{- end }}
  {{- end }}
  
  {{- range $envkey, $envvalue := $value.env }}
  {{ $envkey }}: {{ $envvalue | quote }}
  {{- end }}
  {{- if eq $key "python-backend" }}
  {{- if not (hasKey $value.env "PYTHON_CODE_EXECUTOR_IMAGE_TAG") }}
  PYTHON_CODE_EXECUTOR_IMAGE_TAG: {{ $.Chart.AppVersion | quote }}
  {{- end }}
  {{- end }}
  {{- if eq $key "backend" }}
  {{- /* Derived from the clickhouse / databaseAnalytics values above. An explicit key under
         component.backend.env wins, so operators can still pin either env var directly. */}}
  {{- if not (hasKey $value.env "ANALYTICS_DB_CLUSTER_HEALTH_CHECK_ENABLED") }}
  ANALYTICS_DB_CLUSTER_HEALTH_CHECK_ENABLED: {{ $.Values.clickhouse.sharding.enabled | quote }}
  {{- end }}
  {{- if not (hasKey $value.env "UUID_VALIDATION_WINDOW") }}
  UUID_VALIDATION_WINDOW: {{ printf "%dms" (int $.Values.databaseAnalytics.uuidV7ValidationWindowMs) | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}