name: Sync Provider Models Daily

on:
  schedule:
    - cron: '30 0 * * 1-5' # 30 min after model prices sync, Monday to Friday
  workflow_dispatch:
    inputs:
      force_regen:
        description: 'Regenerate the files and open a PR even if no new models were found'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
# One rolling PR on a fixed branch: two runs at once would force-push it over each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
env:
  # Retry transient PyPI/network failures longer before failing the build.
  PIP_RETRIES: 8
  PIP_DEFAULT_TIMEOUT: 30
  UV_HTTP_TIMEOUT: 30
  UV_HTTP_RETRIES: 8

jobs:
  sync-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv pip install --system requests pyyaml==6.0.3

      - name: Run sync script
        id: sync
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_E2E_TESTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_REGEN_FLAG: ${{ inputs.force_regen == true && '--force-regen' || '' }}
        run: |
          set +e -o pipefail
          # $FORCE_REGEN_FLAG is intentionally unquoted: it holds either
          # `--force-regen` (a single flag) or the empty string. Quoting it
          # would pass a literal empty argument to python, which is harmless
          # here but conceptually wrong — the variable is acting as an
          # optional argv slot, not a single value.
          # stderr is teed rather than only redirected: it carries ::warning::
          # annotations that GitHub parses from the live stream, so a file the
          # step later deletes would swallow them. It still stays out of
          # sync_summary.txt, which becomes the PR body.
          # shellcheck disable=SC2086
          python scripts/sync_provider_models.py $FORCE_REGEN_FLAG 2> >(tee sync_stderr.txt >&2) | tee sync_summary.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Capture summary for PR body (multiline output)
          {
            echo "summary<<EOF"
            cat sync_summary.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "No new models found, skipping PR creation."
          fi

          rm -f sync_summary.txt sync_stderr.txt

      - name: Print summary
        if: always() && steps.sync.outputs.summary != ''
        run: |
          {
            echo "## Sync Summary"
            echo '```'
            echo "${{ steps.sync.outputs.summary }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        if: steps.sync.outputs.exit_code == '0' || steps.sync.outputs.exit_code == '3'
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit files
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -ex
          git config --local user.email "github-actions@comet.com"
          git config --local user.name "GitHub Actions (${ACTOR})"
          git add apps/opik-backend/src/main/java/com/comet/opik/infrastructure/llm/
          git add apps/opik-frontend/src/types/providers.ts
          git add apps/opik-frontend/src/constants/providerModels.ts
          git add apps/opik-backend/src/main/resources/llm-models-default.yaml
          git commit -m "[NA] [BE][FE] chore: sync provider model definitions"

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COMET_ACTION_CREATE_PR }}
          branch: github-actions/NA-sync-provider-models
          title: "[NA] [BE][FE] chore: sync provider model definitions"
          body: |
            ## Details

            Automated sync of LLM provider model definitions from source APIs and prices JSON.

            ${{ steps.sync.outputs.exit_code == '3' && format('**Some provider API calls failed in this run, so those providers kept their current models ([run log]({0}/{1}/actions/runs/{2})).**', github.server_url, github.repository, github.run_id) || '' }}

            **Sync summary:**
            ```
            ${{ steps.sync.outputs.summary }}
            ```

            ## Change checklist
            - [x] User facing
            - [ ] Documentation update

            ## Issues

            - NA

            ## AI-WATERMARK

            AI-WATERMARK: yes

            - If yes:
              - Tools: GitHub Actions (`sync_provider_models.yml`)
              - Model(s): N/A (scripted automation)
              - Scope: Automated model list sync
              - Human verification: Requires manual review before merge

            ## Testing

            - Script dry-run passed in CI
            - Changes are add-only; stale/deprecated models flagged for manual review

            ## Documentation

            N/A
          base: main

      - name: Fail if a provider API call failed
        if: steps.sync.outputs.exit_code != '0' && steps.sync.outputs.exit_code != '1'
        env:
          EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
        run: |
          case "$EXIT_CODE" in
            3) echo "::error::A provider API call failed: its models were kept unchanged and the other providers were synced." ;;
            4) echo "::error::A provider API call failed and the other providers had nothing new." ;;
            *) echo "::error::The sync script exited with code $EXIT_CODE." ;;
          esac
          exit 1
