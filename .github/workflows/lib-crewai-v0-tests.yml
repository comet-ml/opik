# Workflow to run CrewAI v0.x tests
#
# Please read inputs to provide correct values.
#
name: SDK Lib CrewAI v0 Tests
run-name: "SDK Lib CrewAI v0 Tests ${{ github.ref_name }} by @${{ github.actor }}"
permissions:
  contents: read
  id-token: write
env:
  # Retry transient PyPI/network failures longer before failing the build.
  PIP_RETRIES: 8
  PIP_DEFAULT_TIMEOUT: 30
  UV_HTTP_TIMEOUT: 30
  UV_HTTP_RETRIES: 8
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_ORG_ID:  ${{ secrets.OPENAI_ORG_ID }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_PYTHON_SDK_TESTS }}
  AWS_DEFAULT_REGION: us-east-1
  GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
  GOOGLE_CLOUD_LOCATION: us-east1
  GOOGLE_CLOUD_PROJECT: opik-sdk-tests
  OPIK_ENABLE_LITELLM_MODELS_MONITORING: False
  OPIK_SENTRY_ENABLE: False
  OPIK_ANALYTICS_ENABLE: False

on:
  workflow_call:

jobs:
  tests:
    name: CrewAI v0 Python ${{matrix.python_version}}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/python

    strategy:
      fail-fast: true
      matrix:
        # 3.14+ is not supported by crewai v0.x
        # Lowest and highest supported Python only: these suites make paid
        # LLM calls and the intermediate versions add cost without coverage.
        python_version: ["3.10", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python ${{matrix.python_version}}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{matrix.python_version}}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install opik
        run: uv pip install --system .

      - name: Install test tools
        run: |
          cd ./tests
          uv pip install --system -r test_requirements.txt

      - name: Install lib
        run: |
          cd ./tests
          uv pip install --system -r library_integration/crewai/requirements_v0.txt

      - name: Configure AWS credentials for Bedrock
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.BEDROCK_TESTS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run tests
        run: |
          cd ./tests/library_integration/crewai/
          python -m pytest  -vv .