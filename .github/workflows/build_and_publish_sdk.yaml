name: "Build and Publish SDK"
run-name: "Build SDK ${{ github.ref_name }} by @${{ github.actor }}"

on:
    workflow_dispatch:
      inputs:
        version:
          type: string
          required: true
          description: Version
          default: ""
        is_release:
          type: boolean
          required: false
          default: false
    workflow_call:
      inputs:
        version:
          type: string
          required: true
          description: Version
        is_release:
          type: boolean
          required: false
          default: false

    push:
        branches:
        - 'main'
        paths:
          - "sdks/python/**"

# PyPI Trusted Publishing (OIDC): no stored token. Callers must grant
# id-token: write too — permissions only narrow down a call chain.
permissions:
    contents: read
    id-token: write

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
        - name: Setup
          id: setup
          env:
            INPUT_VERSION: ${{ inputs.version }}
            REF_NAME: ${{ github.ref_name }}
          run: |
            if [[ "${INPUT_VERSION}" == ""  ]]; then
              echo "build_from=${REF_NAME}" | tee -a "$GITHUB_OUTPUT"
            else
              echo "build_from=${INPUT_VERSION}" | tee -a "$GITHUB_OUTPUT"
            fi
        - name: Checkout
          uses: actions/checkout@v7
          with:
            ref: ${{steps.setup.outputs.build_from}}
            fetch-tags: true

        - name: Set up Python 3.10
          uses: actions/setup-python@v7
          with:
                python-version: "3.10"

        - name: Build pip package
          env:
            INPUT_VERSION: ${{ inputs.version }}
          run: |
                cd sdks/python
                pip3 install -U pip build
                if [[ "${INPUT_VERSION}" != "" ]]; then export VERSION="${INPUT_VERSION}";fi
                python3 -m build --sdist --wheel --outdir dist/ .

        - name: Publish package distributions to PyPI
          if: inputs.is_release
          uses: pypa/gh-action-pypi-publish@v1.14.2
          with:
            packages-dir: sdks/python/dist
            # Releases call this as a reusable workflow, and PyPI rejects the
            # attestation from a nested call (pypi/warehouse#11096) with a 400.
            attestations: false
            # Symmetric to OPIK-6624's npm publish 403-skip: replays / races where
            # the version is already on PyPI should not fail the release. PyPI returns
            # `400 Bad Request` (filename already exists) — `skip-existing: true`
            # makes twine treat it as a no-op success.
            skip-existing: true
