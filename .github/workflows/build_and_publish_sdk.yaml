name: "Build and Publish SDK"
run-name: "Build SDK ${{ github.ref_name }} by @${{ github.actor }}"

env:
  # Retry transient PyPI/network failures longer before failing the build.
  PIP_RETRIES: 8
  PIP_DEFAULT_TIMEOUT: 30
  UV_HTTP_TIMEOUT: 30
  UV_HTTP_RETRIES: 8
on:
    workflow_dispatch:
      inputs:
        version:
          type: string
          required: true
          description: Version
          default: ""
        is_release:
          type: boolean
          required: false
          default: false
        preflight_only:
          type: boolean
          required: false
          default: false
          description: Only run the release preflight checks (PyPI Trusted Publishing, dependency age caps); build and upload nothing
        preflight_non_blocking:
          type: boolean
          required: false
          default: false
          description: Let the preflight fail without failing the job, so a PyPI outage doesn't block a release
    workflow_call:
      inputs:
        version:
          type: string
          required: true
          description: Version
        is_release:
          type: boolean
          required: false
          default: false
        preflight_only:
          type: boolean
          required: false
          default: false
          description: Only run the release preflight checks (PyPI Trusted Publishing, dependency age caps); build and upload nothing
        preflight_non_blocking:
          type: boolean
          required: false
          default: false
          description: Let the preflight fail without failing the job, so a PyPI outage doesn't block a release

    push:
        branches:
        - 'main'
        paths:
          - "sdks/python/**"
          - "sdks/dependency-age-exceptions.txt"
          - ".github/scripts/cap_dependency_age.py"

# PyPI Trusted Publishing (OIDC): no stored token. id-token: write is per job,
# and callers must grant it too — permissions only narrow down a call chain.
permissions:
    contents: read

jobs:
    # Mints a PyPI upload token from this workflow's OIDC identity and discards
    # it, so release.yaml can prove the Trusted Publisher matches before tagging.
    pypi-oidc-preflight:
        if: inputs.preflight_only
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        timeout-minutes: 5
        steps:
        # Step-level timeout: a job timeout fails the job despite continue-on-error,
        # so a hung PyPI would block the release even with preflight_non_blocking.
        - name: PyPI Trusted Publishing preflight
          continue-on-error: ${{ inputs.preflight_non_blocking }}
          timeout-minutes: 3
          run: |
            set -euo pipefail
            # Tokens go via stdin, never argv; a 200 body holds a live upload
            # token, so it lands in a 0600 mktemp file removed on exit.
            MINT=$(mktemp)
            trap 'rm -f "$MINT"' EXIT
            AUDIENCE=$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)
            OIDC=$(printf 'Authorization: bearer %s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              | curl -fsS -H @- "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)
            echo "::add-mask::${OIDC}"
            CODE=$(printf '{"token": "%s"}' "${OIDC}" \
              | curl -sS -o "$MINT" -w '%{http_code}' -X POST https://pypi.org/_/oidc/mint-token \
                  -H 'Content-Type: application/json' --data-binary @-)
            if [ "${CODE}" != "200" ]; then
              # Error bodies carry no token, only codes like invalid-publisher.
              echo "::error title=PyPI preflight::Trusted Publishing rejected this workflow (HTTP ${CODE}): $(jq -c '.errors // .' "$MINT")"
              exit 1
            fi
            echo "OK: PyPI accepts this workflow as a Trusted Publisher for opik."

    # Runs the cap checks before release.yaml pushes the tag, so a release whose
    # dependencies can't be capped stops before anything is tagged.
    dependency-cap-preflight:
        if: inputs.preflight_only
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Set up Python 3.10
          uses: actions/setup-python@v7
          with:
                python-version: "3.10"

        # Step-level timeout, as in pypi-oidc-preflight; pip is bootstrapped as in build-and-publish.
        - name: Check dependency age caps
          continue-on-error: ${{ inputs.preflight_non_blocking }}
          timeout-minutes: 4
          run: |
            python3 -m pip install --only-binary :all: --require-hashes \
              -r <(echo "pip==26.2.2 --hash=sha256:fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70")
            python3 -m pip install --only-binary :all: --uploaded-prior-to P7D packaging
            python3 .github/scripts/cap_dependency_age.py sdks/python/setup.py \
              --exceptions sdks/dependency-age-exceptions.txt --check

    build-and-publish:
        if: ${{ !inputs.preflight_only }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        timeout-minutes: 10
        steps:
        - name: Setup
          id: setup
          env:
            INPUT_VERSION: ${{ inputs.version }}
            REF_NAME: ${{ github.ref_name }}
          run: |
            if [[ "${INPUT_VERSION}" == ""  ]]; then
              echo "build_from=${REF_NAME}" | tee -a "$GITHUB_OUTPUT"
            else
              echo "build_from=${INPUT_VERSION}" | tee -a "$GITHUB_OUTPUT"
            fi
        - name: Checkout
          uses: actions/checkout@v7
          with:
            ref: ${{steps.setup.outputs.build_from}}
            fetch-tags: true

        - name: Set up Python 3.10
          uses: actions/setup-python@v7
          with:
                python-version: "3.10"

        # This job can mint a PyPI upload token, so its build tools get the same 7-day rule
        # as the SDK's dependencies and the build runs with --no-isolation to use them.
        # --uploaded-prior-to needs pip >= 26.1 and the runner's is older, so pip itself comes from
        # one hash-pinned file. --upgrade replaces a setuptools bundled with the runner's Python.
        - name: Install build tools at least 7 days old
          run: |
                python3 -m pip install --only-binary :all: --require-hashes \
                  -r <(echo "pip==26.2.2 --hash=sha256:fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70")
                python3 -m pip install --only-binary :all: --upgrade --uploaded-prior-to P7D build packaging setuptools

        - name: Cap dependencies by release age
          run: |
                python3 .github/scripts/cap_dependency_age.py sdks/python/setup.py \
                  --exceptions sdks/dependency-age-exceptions.txt

        - name: Build pip package
          env:
            INPUT_VERSION: ${{ inputs.version }}
          run: |
                cd sdks/python
                if [[ "${INPUT_VERSION}" != "" ]]; then export VERSION="${INPUT_VERSION}";fi
                python3 -m build --no-isolation --sdist --wheel --outdir dist/ .

        # --only-binary: building a dependency from source to read its metadata would
        # run its code in a job that can publish to PyPI.
        - name: Check the capped dependencies resolve
          run: |
                pip3 install --dry-run --only-binary :all: sdks/python/dist/*.whl

        - name: Publish package distributions to PyPI
          if: inputs.is_release
          uses: pypa/gh-action-pypi-publish@v1.14.2
          with:
            packages-dir: sdks/python/dist
            # Releases call this as a reusable workflow, and PyPI rejects the
            # attestation from a nested call (pypi/warehouse#11096) with a 400.
            attestations: false
            # Symmetric to OPIK-6624's npm publish 403-skip: replays / races where
            # the version is already on PyPI should not fail the release. PyPI returns
            # `400 Bad Request` (filename already exists) — `skip-existing: true`
            # makes twine treat it as a no-op success.
            skip-existing: true
