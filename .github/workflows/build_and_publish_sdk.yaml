name: "Build and Publish SDK"
run-name: "Build SDK ${{ github.ref_name }} by @${{ github.actor }}"

on:
    workflow_dispatch:
      inputs:
        version:
          type: string
          required: true
          description: Version
          default: ""
        is_release:
          type: boolean
          required: false
          default: false
        preflight_only:
          type: boolean
          required: false
          default: false
          description: Only check that PyPI Trusted Publishing accepts this workflow; build and upload nothing
    workflow_call:
      inputs:
        version:
          type: string
          required: true
          description: Version
        is_release:
          type: boolean
          required: false
          default: false
        preflight_only:
          type: boolean
          required: false
          default: false
          description: Only check that PyPI Trusted Publishing accepts this workflow; build and upload nothing

    push:
        branches:
        - 'main'
        paths:
          - "sdks/python/**"

# PyPI Trusted Publishing (OIDC): no stored token. id-token: write is per job,
# and callers must grant it too — permissions only narrow down a call chain.
permissions:
    contents: read

jobs:
    # Mints a PyPI upload token from this workflow's OIDC identity and discards
    # it, so release.yaml can prove the Trusted Publisher matches before tagging.
    pypi-oidc-preflight:
        if: inputs.preflight_only
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        timeout-minutes: 5
        steps:
        - name: PyPI Trusted Publishing preflight
          run: |
            set -euo pipefail
            AUDIENCE=$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)
            OIDC=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)
            echo "::add-mask::${OIDC}"
            RESP=$(curl -sS -o /tmp/mint.json -w '%{http_code}' -X POST https://pypi.org/_/oidc/mint-token \
              -H 'Content-Type: application/json' -d "{\"token\": \"${OIDC}\"}")
            if [ "${RESP}" != "200" ]; then
              # Error bodies carry no token, only codes like invalid-publisher.
              echo "::error title=PyPI preflight::Trusted Publishing rejected this workflow (HTTP ${RESP}): $(jq -c '.errors // .' /tmp/mint.json)"
              exit 1
            fi
            echo "OK: PyPI accepts this workflow as a Trusted Publisher for opik."

    build-and-publish:
        if: ${{ !inputs.preflight_only }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        timeout-minutes: 5
        steps:
        - name: Setup
          id: setup
          env:
            INPUT_VERSION: ${{ inputs.version }}
            REF_NAME: ${{ github.ref_name }}
          run: |
            if [[ "${INPUT_VERSION}" == ""  ]]; then
              echo "build_from=${REF_NAME}" | tee -a "$GITHUB_OUTPUT"
            else
              echo "build_from=${INPUT_VERSION}" | tee -a "$GITHUB_OUTPUT"
            fi
        - name: Checkout
          uses: actions/checkout@v7
          with:
            ref: ${{steps.setup.outputs.build_from}}
            fetch-tags: true

        - name: Set up Python 3.10
          uses: actions/setup-python@v7
          with:
                python-version: "3.10"

        - name: Build pip package
          env:
            INPUT_VERSION: ${{ inputs.version }}
          run: |
                cd sdks/python
                pip3 install -U pip build
                if [[ "${INPUT_VERSION}" != "" ]]; then export VERSION="${INPUT_VERSION}";fi
                python3 -m build --sdist --wheel --outdir dist/ .

        - name: Publish package distributions to PyPI
          if: inputs.is_release
          uses: pypa/gh-action-pypi-publish@v1.14.2
          with:
            packages-dir: sdks/python/dist
            # Releases call this as a reusable workflow, and PyPI rejects the
            # attestation from a nested call (pypi/warehouse#11096) with a 400.
            attestations: false
            # Symmetric to OPIK-6624's npm publish 403-skip: replays / races where
            # the version is already on PyPI should not fail the release. PyPI returns
            # `400 Bad Request` (filename already exists) — `skip-existing: true`
            # makes twine treat it as a no-op success.
            skip-existing: true
