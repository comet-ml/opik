name: "Build Opik Docker Images"
run-name: "Build ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: 
      - 'main'
    paths-ignore: 
      - "deployment/**"
      - 'sdks/**'

  # The same build, without pushing, for a PR that changes an input resolved per arch: a base image
  # digest, or a dependency's wheel or native binary. Source changes stay on the amd64 PR builds.
  pull_request:
    paths:
      - "apps/opik-backend/Dockerfile"
      - "apps/opik-frontend/Dockerfile"
      - "apps/opik-frontend/package.json"
      - "apps/opik-frontend/package-lock.json"
      - "apps/opik-python-backend/Dockerfile"
      - "apps/opik-python-backend/requirements.txt"
      - "apps/opik-sandbox-executor-python/Dockerfile"
      - "apps/opik-sandbox-executor-python/requirements.txt"
      - ".github/workflows/build_apps.yml"
      - ".github/workflows/build_and_push_docker.yaml"

  workflow_dispatch:
    inputs:
      is_release:
        type: boolean
        required: true
        description: Is release build
        default: false
      is_adhoc:
        type: boolean
        required: false
        description: Is adhoc build
        default: false
      build_guardrails:
        type: boolean
        required: true
        description: Build guardrails backend
        default: true
      build_arm64:
        type: boolean
        required: false
        description: Build multiarch images
        default: true
      ai_spend_plugin_ref:
        type: string
        required: false
        description: ai-spend plugin ref
        default: "main"
  workflow_call:
    inputs:
      version:
        type: string
        required: true
        description: Version
      is_release:
        type: boolean
        required: true
        description: Is release build
      is_adhoc:
        type: boolean
        required: false
        description: Is adhoc build
        default: false
      ref:
        type: string
        required: false
        description: Git ref to build from (branch, tag, or commit SHA)
        default: ""
      build_guardrails:
        type: boolean
        required: false
        description: Build guardrails backend
        default: true
      build_arm64:
        type: boolean
        required: false
        description: Build multiarch images
        default: true
      ai_spend_plugin_ref:
        type: string
        required: false
        description: ai-spend plugin ref
        default: "main"

    outputs:
      version:
        description: "The version that was built"
        value: ${{ jobs.set-version.outputs.version }}

permissions:
  contents: read

jobs:

  set-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
        version: ${{ steps.version.outputs.version }}
        build_from: ${{ steps.version.outputs.build_from }}
        publish: ${{ steps.version.outputs.publish }}
        build_arm64: ${{ steps.version.outputs.build_arm64 }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            ref: ${{ inputs.ref || github.ref }}

        - name: Set version
          id: version
          env:
            INPUT_VERSION: ${{ inputs.version }}
            INPUT_REF: ${{ inputs.ref }}
            REF_NAME: ${{ github.ref_name }}
            RUN_NUMBER: ${{ github.run_number }}
            EVENT_NAME: ${{ github.event_name }}
            WORKFLOW_REF: ${{ github.workflow_ref }}
            INPUT_BUILD_ARM64: ${{ inputs.build_arm64 }}
          run: |
            # A PR run of this workflow only checks that the images build. A call from another
            # PR-triggered workflow (trigger_test_env_on_label.yaml) still publishes: in a called
            # workflow, github.workflow_ref names the caller.
            if [[ "${EVENT_NAME}" == "pull_request" && "${WORKFLOW_REF}" == */.github/workflows/build_apps.yml@* ]]; then
              PUBLISH=false
            else
              PUBLISH=true
            fi
            echo "publish=${PUBLISH}" | tee -a "$GITHUB_OUTPUT"

            # push and PR runs have no inputs context; both build multi-arch.
            if [[ "${EVENT_NAME}" == "push" || "${PUBLISH}" == "false" || "${INPUT_BUILD_ARM64}" == "true" ]]; then
              echo "build_arm64=true" | tee -a "$GITHUB_OUTPUT"
            else
              echo "build_arm64=false" | tee -a "$GITHUB_OUTPUT"
            fi

            if [[ "${INPUT_VERSION}" != "" ]]; then
              VERSION="${INPUT_VERSION}"
            else
              BASE_VERSION=$(cat version.txt)
              BRANCH_NAME="${REF_NAME}"
              if [[ "${BRANCH_NAME}" == "main" ]]; then
                VERSION="${BASE_VERSION}-${RUN_NUMBER}"
              elif [[ "${BRANCH_NAME}" =~ ^hotfix/.* ]]; then
                # Special handling for hotfix branches
                VERSION="${BASE_VERSION}-hotfix.${RUN_NUMBER}"
              else
                # Normalize branch name
                fixedBranchName=$(echo "${BRANCH_NAME}" | sed 's/origin\///; s/\//-/g; s/_/-/g; s/.*/\L&/')
                if [ ${#fixedBranchName} -gt 21 ]; then
                  fixedBranchName="${fixedBranchName:0:20}"
                  # remove dash at the end
                  while [ "${fixedBranchName: -1}" = "-" ]; do
                    fixedBranchName="${fixedBranchName%?}"
                  done
                fi
                VERSION="${BASE_VERSION}-${fixedBranchName}-${RUN_NUMBER}"
              fi
            fi
            echo "version=${VERSION}" | tee -a "$GITHUB_OUTPUT"
            echo "Version is ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

            if [ "${INPUT_REF}" != "" ]; then
              echo "build_from=${INPUT_REF}" | tee -a "$GITHUB_OUTPUT"
            elif [[ "${PUBLISH}" == "false" ]]; then
              # A PR's ref_name (<number>/merge) is not a ref checkout can resolve.
              echo "build_from=${GITHUB_SHA}" | tee -a "$GITHUB_OUTPUT"
            elif [[ "${INPUT_VERSION}" == "" ]]; then
              echo "build_from=${REF_NAME}" | tee -a "$GITHUB_OUTPUT"
            else
              echo "build_from=${INPUT_VERSION}" | tee -a "$GITHUB_OUTPUT"
            fi
            
  build-backend:
    permissions:
      contents: read
      packages: write
    needs:
      - set-version
    secrets: inherit
    uses: ./.github/workflows/build_and_push_docker.yaml
    with:
      image: "opik-backend"
      version: ${{needs.set-version.outputs.version}}
      build_from: ${{needs.set-version.outputs.build_from}}
      build_comet_image: false
      comet_build_args: ""
      is_release: ${{ inputs.is_release || false }}
      is_adhoc: ${{ inputs.is_adhoc || false }}
      build_arm64: ${{ needs.set-version.outputs.build_arm64 == 'true' }}
      push: ${{ needs.set-version.outputs.publish == 'true' }}

  build-sandbox-executor-python:
    permissions:
      contents: read
      packages: write
    if: ${{ !inputs.is_adhoc }}
    needs:
      - set-version
    secrets: inherit
    uses: ./.github/workflows/build_and_push_docker.yaml
    with:
      image: "opik-sandbox-executor-python"
      version: ${{needs.set-version.outputs.version}}
      build_from: ${{needs.set-version.outputs.build_from}}
      build_comet_image: false
      comet_build_args: ""
      is_release: ${{ inputs.is_release || false }}
      is_adhoc: ${{ inputs.is_adhoc || false }}
      build_arm64: ${{ needs.set-version.outputs.build_arm64 == 'true' }}
      push: ${{ needs.set-version.outputs.publish == 'true' }}

  build-python-backend:
    permissions:
      contents: read
      packages: write
    if: always() && needs.set-version.result == 'success'
    needs:
      - set-version
      - build-sandbox-executor-python
    secrets: inherit
    uses: ./.github/workflows/build_and_push_docker.yaml
    with:
      image: "opik-python-backend"
      version: ${{needs.set-version.outputs.version}}
      build_from: ${{needs.set-version.outputs.build_from}}
      build_comet_image: false
      comet_build_args: ""
      is_release: ${{ inputs.is_release || false }}
      is_adhoc: ${{ inputs.is_adhoc || false }}
      build_arm64: ${{ needs.set-version.outputs.build_arm64 == 'true' }}
      push: ${{ needs.set-version.outputs.publish == 'true' }}

  # build-guardrails-backend:
  #   if: inputs.build_guardrails != false 
  #   needs:
  #     - set-version
  #   secrets: inherit
  #   uses: ./.github/workflows/build_and_push_docker.yaml
  #   with:
  #     image: "opik-guardrails-backend"
  #     version: ${{needs.set-version.outputs.version}}
  #     build_from: ${{needs.set-version.outputs.build_from}}
  #     build_comet_image: false
  #     comet_build_args: ""
  #     is_release: ${{ inputs.is_release || false }}

  build-frontend:
    permissions:
      contents: read
      packages: write
    needs:
      - set-version
    secrets: inherit
    uses: ./.github/workflows/build_and_push_docker.yaml
    with:
      image: "opik-frontend"
      version: ${{needs.set-version.outputs.version}}
      build_from: ${{needs.set-version.outputs.build_from}}
      # A PR run skips the comet variant: it compiles a private plugin that fork PRs cannot check out.
      build_comet_image: ${{ !inputs.is_adhoc && needs.set-version.outputs.publish == 'true' }}
      comet_build_args: ${{ !inputs.is_adhoc && 'BUILD_MODE=comet' || '' }}
      is_release: ${{ inputs.is_release || false }}
      is_adhoc: ${{ inputs.is_adhoc || false }}
      build_arm64: ${{ needs.set-version.outputs.build_arm64 == 'true' }}
      push: ${{ needs.set-version.outputs.publish == 'true' }}
      ai_spend_plugin_ref: ${{ inputs.ai_spend_plugin_ref || 'main' }}

  create-git-tag:
    if: |
      always() &&
      !inputs.is_release &&
      needs.set-version.outputs.publish == 'true' &&
      needs.set-version.result == 'success' &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      needs.build-python-backend.result == 'success'
    needs:
      - set-version
      - build-backend
      - build-frontend
      - build-python-backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create git tag
        run: |
          set -x
          git config --local user.email "github-actions@comet.com"
          git config --local user.name "github-actions"
          git tag ${{needs.set-version.outputs.version}}
          git push --no-verify origin refs/tags/${{needs.set-version.outputs.version}}
        
    
