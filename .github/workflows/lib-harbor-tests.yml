# Workflow to run Harbor tests
#
# Please read inputs to provide correct values.
#
name: SDK Lib Harbor Tests
run-name: "SDK Lib Harbor Tests ${{ github.ref_name }} by @${{ github.actor }}"
permissions:
  contents: read
env:
  # Retry transient PyPI/network failures longer before failing the build.
  PIP_RETRIES: 8
  PIP_DEFAULT_TIMEOUT: 30
  UV_HTTP_TIMEOUT: 30
  UV_HTTP_RETRIES: 8
  OPIK_ENABLE_LITELLM_MODELS_MONITORING: False
  OPIK_SENTRY_ENABLE: False
  OPIK_ANALYTICS_ENABLE: False
on:
  workflow_call:

jobs:
  tests:
    name: Harbor Python ${{matrix.python_version}}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/python

    strategy:
      fail-fast: true
      matrix:
        python_version: ["3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python ${{matrix.python_version}}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{matrix.python_version}}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install opik
        run: uv pip install --system .

      - name: Install test tools
        run: |
          cd ./tests
          uv pip install --system -r test_requirements.txt

      - name: Install lib
        run: |
          cd ./tests
          uv pip install --system -r library_integration/harbor/requirements.txt

      - name: Run tests
        run: |
          cd ./tests/library_integration/harbor/
          python -m pytest  -vv .
