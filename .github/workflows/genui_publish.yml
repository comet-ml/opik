name: Generative UI Engine Publish
run-name: "Generative UI Engine ${{ inputs.is_release && 'publish' || 'build' }} ${{ inputs.version }} from ${{ github.ref_name }} by @${{ github.actor }}"

# Publishes `opik-genui` to npm and to PyPI from one build of one commit, so the
# two packages of a version always carry the same contract and guidance.
#
# It runs two ways:
#   as a job of the Opik release (release.yaml), with the release version;
#   by hand ("Run workflow"), to re-publish a version the release missed or to try
#   a change. Without `is_release` it builds, checks and proves the PyPI
#   registration, and uploads nothing.
#
# Trusted publishing (OIDC), no stored tokens. The registries identify the
# publisher differently:
#   npm  validates the *entry-point* workflow, the one that started the run. Two
#        files are registered for `opik-genui`: `release-wrapper-release-n-deploy.yml`
#        for releases and this one, `genui_publish.yml`, for manual runs.
#   PyPI validates the workflow that contains the job (`job_workflow_ref`), so
#        this file is the one registration for both ways of running.
# Renaming this file breaks PyPI and the manual npm publish until the
# registrations are changed.
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Opik release version to publish the engine as (X.Y.Z). A release builds the tag of that version.
      is_release:
        type: boolean
        required: false
        default: false
        description: Publish to npm and PyPI. When off, build and check the branch this run is started from and upload nothing.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
        description: Version
      is_release:
        type: boolean
        required: false
        default: false
      preflight_only:
        type: boolean
        required: false
        default: false
        description: Only check that PyPI Trusted Publishing accepts this workflow; build and upload nothing
      preflight_non_blocking:
        type: boolean
        required: false
        default: false
        description: Let the preflight fail without failing the job, so a PyPI outage doesn't block a release

env:
  # Retry transient PyPI/network failures longer before failing the build.
  UV_HTTP_TIMEOUT: 30
  UV_HTTP_RETRIES: 8

permissions:
  contents: read

jobs:
  # Mints a PyPI upload token from this workflow's OIDC identity and discards it,
  # so release.yaml can prove the `opik-genui` Trusted Publisher matches before
  # tagging. Same check as build_and_publish_sdk.yaml, which proves only `opik`.
  # npm has no equivalent: its publisher is first exercised by the publish itself.
  pypi-oidc-preflight:
    if: inputs.preflight_only
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 5
    steps:
      - name: PyPI Trusted Publishing preflight
        continue-on-error: ${{ inputs.preflight_non_blocking }}
        run: |
          set -euo pipefail
          # Tokens go via stdin, never argv; a 200 body holds a live upload
          # token, so it lands in a 0600 mktemp file removed on exit.
          MINT=$(mktemp)
          trap 'rm -f "$MINT"' EXIT
          AUDIENCE=$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)
          OIDC=$(printf 'Authorization: bearer %s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | curl -fsS -H @- "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)
          echo "::add-mask::${OIDC}"
          CODE=$(printf '{"token": "%s"}' "${OIDC}" \
            | curl -sS -o "$MINT" -w '%{http_code}' -X POST https://pypi.org/_/oidc/mint-token \
                -H 'Content-Type: application/json' --data-binary @-)
          if [ "${CODE}" != "200" ]; then
            # Error bodies carry no token, only codes like invalid-publisher.
            echo "::error title=PyPI preflight::Trusted Publishing rejected this workflow (HTTP ${CODE}): $(jq -c '.errors // .' "$MINT")"
            exit 1
          fi
          echo "OK: PyPI accepts this workflow as a Trusted Publisher for opik-genui."

  build-and-publish:
    if: ${{ !inputs.preflight_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Mints the OIDC token both registries exchange for a short-lived publish
      # credential.
      id-token: write
    defaults:
      run:
        working-directory: sdks/genui
    env:
      # Read via env, never `${{ }}` substitution inside a script.
      RELEASE_VERSION: ${{ inputs.version }}
      IS_RELEASE: ${{ inputs.is_release }}
    steps:
      - name: Validate inputs
        working-directory: .
        env:
          REF: ${{ github.ref }}
          # The entry-point workflow: this file for a manual run, the release
          # wrapper when the release calls it. Only a manual run is tied to main.
          ENTRY_POINT: ${{ github.workflow_ref }}
        run: |
          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Validate inputs::version='${RELEASE_VERSION}' is not X.Y.Z. PyPI and npm must receive the same version string."
            exit 1
          fi
          if [ "${IS_RELEASE}" = "true" ] && [[ "${ENTRY_POINT}" == */genui_publish.yml@* ]] && [ "${REF}" != "refs/heads/main" ]; then
            echo "::error title=Validate inputs::a release must be started from main (got ${REF}). Run without is_release to try a branch."
            exit 1
          fi

      - name: Checkout
        # A release builds the tag, so the packages hold exactly what that Opik
        # release holds. Any other run builds the branch it was started from.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.is_release && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # npm trusted publishing (OIDC) needs npm >= 11.5.1, which Node 26 bundles.
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          # No caches in a job that publishes: a poisoned cache would ship.
          package-manager-cache: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Set version
        # js/package.json is the one version source: the build writes it into the
        # Python package data and the wheel build refuses data of another version.
        run: npm version "${RELEASE_VERSION}" -w opik-genui --no-git-tag-version --allow-same-version --no-workspaces-update

      - name: Build and check
        run: npm run ci

      - name: Build Python package
        run: npm run build:python

      - name: Check built versions
        run: |
          set -euo pipefail
          test -f "python/dist/opik_genui-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "python/dist/opik_genui-${RELEASE_VERSION}.tar.gz"
          test "$(node -p "require('./js/package.json').version")" = "${RELEASE_VERSION}"

      - name: PyPI Trusted Publishing preflight
        # Mints a PyPI upload token from this workflow's OIDC identity and discards
        # it. Runs before anything is uploaded, so a wrong PyPI registration cannot
        # leave npm published and PyPI not. Same check as build_and_publish_sdk.yaml.
        # npm has no equivalent: its publisher is first exercised by the publish.
        run: |
          set -euo pipefail
          # Tokens go via stdin, never argv; a 200 body holds a live upload
          # token, so it lands in a 0600 mktemp file removed on exit.
          MINT=$(mktemp)
          trap 'rm -f "$MINT"' EXIT
          AUDIENCE=$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)
          OIDC=$(printf 'Authorization: bearer %s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | curl -fsS -H @- "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)
          echo "::add-mask::${OIDC}"
          CODE=$(printf '{"token": "%s"}' "${OIDC}" \
            | curl -sS -o "$MINT" -w '%{http_code}' -X POST https://pypi.org/_/oidc/mint-token \
                -H 'Content-Type: application/json' --data-binary @-)
          if [ "${CODE}" != "200" ]; then
            # Error bodies carry no token, only codes like invalid-publisher.
            echo "::error title=PyPI preflight::Trusted Publishing rejected this workflow (HTTP ${CODE}): $(jq -c '.errors // .' "$MINT")"
            exit 1
          fi
          echo "OK: PyPI accepts this workflow as a Trusted Publisher for opik-genui."

      - name: Prepare trusted publishing auth
        # setup-node writes an empty `_authToken` stub that npm would try before
        # falling back to OIDC. See .github/actions/typescript-sdk-build-and-publish.
        run: npm config delete //registry.npmjs.org/:_authToken || true

      - name: Publish to npm
        id: npm_publish
        run: |
          set -uo pipefail
          if [ "${IS_RELEASE}" != "true" ]; then
            npm publish -w opik-genui --access public --dry-run
            echo "result=not published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rerun after npm published and PyPI failed must not fail here, or the
          # PyPI step below could never be retried.
          if [ "$(npm view "opik-genui@${RELEASE_VERSION}" version 2>/dev/null || true)" = "${RELEASE_VERSION}" ]; then
            echo "::notice title=Publish to npm::opik-genui@${RELEASE_VERSION} is already on npm; skipping."
            echo "result=already published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUBLISH_LOG=$(mktemp)
          trap 'rm -f "$PUBLISH_LOG"' EXIT
          for ATTEMPT in 1 2 3; do
            echo "Publish attempt ${ATTEMPT} of 3"
            # `if pipeline` keeps a failed attempt from ending the step; see
            # .github/actions/typescript-sdk-build-and-publish.
            if timeout 180 npm publish -w opik-genui --access public 2>&1 | tee "$PUBLISH_LOG"; then
              echo "result=published" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if grep -q "cannot publish over" "$PUBLISH_LOG"; then
              echo "::notice title=Publish to npm::opik-genui@${RELEASE_VERSION} is already on npm; skipping."
              echo "result=already published" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Publish to npm::npm publish failed after 3 attempts."
          exit 1

      - name: Publish to PyPI
        if: ${{ inputs.is_release }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdks/genui/python/dist
          # PyPI rejects the attestation from a nested reusable-workflow call
          # (pypi/warehouse#11096). See build_and_publish_sdk.yaml.
          attestations: false
          skip-existing: true

      - name: Summary
        env:
          NPM_RESULT: ${{ steps.npm_publish.outputs.result }}
        run: |
          exec >> "$GITHUB_STEP_SUMMARY"
          echo "## Generative UI engine"
          echo ""
          echo "**Version:** ${RELEASE_VERSION}"
          if [ "${IS_RELEASE}" = "true" ]; then
            echo "**npm:** ${NPM_RESULT}, https://www.npmjs.com/package/opik-genui/v/${RELEASE_VERSION}"
            echo "**PyPI:** https://pypi.org/project/opik-genui/${RELEASE_VERSION}/"
          else
            echo "**Not a release:** built and checked, nothing uploaded. PyPI accepted this workflow as a trusted publisher."
          fi
