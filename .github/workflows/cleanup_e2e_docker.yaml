name: Cleanup E2E Docker Images

on:
  # pull_request_target (not pull_request) because fork-originated pull_request
  # runs wait for maintainer approval before any job `if:` is evaluated; nobody
  # approves a cleanup on a closed PR, so those runs expire as failures after 30
  # days. This is safe because the job never checks out or executes PR code: it
  # only calls the packages API with the integer PR number. See the
  # dangerous-triggers audit rationale:
  # https://docs.zizmor.sh/audits/#dangerous-triggers
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
  schedule:
    - cron: "0 3 * * 6"  # Every Saturday at 03:00 UTC
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete CI tags older than this many days (0 = delete all)"
        required: false
        default: 7
        type: number

permissions:
  contents: read
  packages: write

env:
  IMAGES: >-
    opik-backend
    opik-python-backend
    opik-guardrails-backend

jobs:
  cleanup:
    name: Cleanup CI images
    # Fork PRs never push ci-e2e-pr* images (the E2E builds skip forks), so
    # there is nothing to clean up.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete CI images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '7' }}
        run: |
          DELETED=0
          SKIPPED=0
          FAILED=0

          # Build the jq filter and age cutoff based on trigger type
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "Mode: PR close — deleting all ci-e2e-pr${PR_NUMBER}-* images"
            JQ_FILTER=".[] | select(.metadata.container.tags | any(startswith(\"ci-e2e-pr${PR_NUMBER}-\"))) | {id: .id, tags: .metadata.container.tags, created_at: .created_at}"
            CUTOFF=""
          else
            echo "Mode: stale sweep — deleting ci-e2e-* images older than ${MAX_AGE_DAYS} days"
            JQ_FILTER='.[] | select(.metadata.container.tags | any(startswith("ci-e2e-"))) | {id: .id, tags: .metadata.container.tags, created_at: .created_at}'
            CUTOFF=$(date -u -d "${MAX_AGE_DAYS} days ago" +%s 2>/dev/null \
              || date -u -v-"${MAX_AGE_DAYS}"d +%s)
          fi

          PAGES_DIR=$(mktemp -d)
          export PAGES_DIR

          for IMAGE in ${{ env.IMAGES }}; do
            echo "=== Scanning ${IMAGE} ==="
            export VERSIONS_URL="/orgs/comet-ml/packages/container/opik%2F${IMAGE}/versions?per_page=100"
            rm -f "${PAGES_DIR}"/*

            # Packages contain ~40k versions (mostly untagged release manifests) and the API
            # has no tag filter, so sequential paging takes ~12 min per image. Fetch pages in
            # batches of 10 in parallel. Versions are listed newest first, so stop after the
            # batch that reaches the end of the list or, on PR close, goes past the PR's
            # creation (a PR's images can't predate the PR).
            PAGE=1
            LIST_OK=true
            while :; do
              # shellcheck disable=SC2016 # expanded by the child sh from the exported env
              if ! seq "$PAGE" $((PAGE + 9)) | xargs -P 10 -I{} sh -c \
                'gh api "${VERSIONS_URL}&page={}" > "${PAGES_DIR}/{}.json"'; then
                LIST_OK=false
                break
              fi
              LAST_PAGE_FILE="${PAGES_DIR}/$((PAGE + 9)).json"
              PAGE=$((PAGE + 10))
              if [ "$(jq length "$LAST_PAGE_FILE")" -lt 100 ]; then
                break
              fi
              if [ "$EVENT_NAME" = "pull_request" ] \
                && [[ "$(jq -r '.[-1].created_at' "$LAST_PAGE_FILE")" < "$PR_CREATED_AT" ]]; then
                break
              fi
            done

            if [ "$LIST_OK" != true ]; then
              echo "  Failed to list versions for ${IMAGE}"
              FAILED=$((FAILED + 1))
              continue
            fi
            echo "  Scanned $((PAGE - 1)) pages"
            # Pages can shift if an image is pushed mid-scan, listing a version twice.
            VERSIONS=$(cat "${PAGES_DIR}"/*.json | jq -c "$JQ_FILTER" | sort -u)

            if [ -z "$VERSIONS" ]; then
              echo "  No matching versions found"
              continue
            fi

            COUNT=$(echo "$VERSIONS" | wc -l | tr -d ' ')
            echo "  Found ${COUNT} matching versions"

            while read -r VERSION; do
              [ -z "$VERSION" ] && continue
              VERSION_ID=$(echo "$VERSION" | jq -r '.id')
              CI_TAG=$(echo "$VERSION" | jq -r '.tags[] | select(startswith("ci-e2e-"))' | head -1)

              # For stale sweep, check age; for PR close, delete unconditionally
              if [ -n "$CUTOFF" ]; then
                CREATED_AT=$(echo "$VERSION" | jq -r '.created_at')
                CREATED_TS=$(date -u -d "$CREATED_AT" +%s 2>/dev/null \
                  || date -u -j -f "%Y-%m-%dT%H:%M:%S" "${CREATED_AT%%.*}" +%s 2>/dev/null \
                  || echo "")
                if [ -z "$CREATED_TS" ]; then
                  echo "  Skipping ${IMAGE}:${CI_TAG} (could not parse created_at: ${CREATED_AT})"
                  SKIPPED=$((SKIPPED + 1))
                  continue
                fi
                if [ "$CREATED_TS" -ge "$CUTOFF" ]; then
                  SKIPPED=$((SKIPPED + 1))
                  continue
                fi
                echo "  Deleting ${IMAGE}:${CI_TAG} (older than ${MAX_AGE_DAYS} days)"
              else
                echo "  Deleting ${IMAGE}:${CI_TAG}"
              fi

              if gh api --method DELETE \
                "/orgs/comet-ml/packages/container/opik%2F${IMAGE}/versions/${VERSION_ID}"; then
                DELETED=$((DELETED + 1))
              else
                FAILED=$((FAILED + 1))
              fi
            done <<< "$VERSIONS"
          done

          echo ""
          echo "=== Summary ==="
          echo "Deleted: ${DELETED}"
          echo "Skipped: ${SKIPPED}"
          echo "Failed: ${FAILED}"
          [ "$FAILED" -eq 0 ] || exit 1
