name: Cleanup E2E Docker Images

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 3 * * 6"  # Every Saturday at 03:00 UTC
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete CI tags older than this many days (0 = delete all)"
        required: false
        default: 7
        type: number

permissions:
  contents: read
  packages: write

env:
  IMAGES: >-
    opik-backend
    opik-python-backend
    opik-guardrails-backend

jobs:
  cleanup:
    name: Cleanup CI images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete CI images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '7' }}
        run: |
          DELETED=0
          SKIPPED=0
          FAILED=0

          # Build the jq filter and age cutoff based on trigger type
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Mode: PR close — deleting all ci-e2e-pr${PR_NUMBER}-* images"
            JQ_FILTER=".[] | select(.metadata.container.tags | any(startswith(\"ci-e2e-pr${PR_NUMBER}-\"))) | {id: .id, tags: .metadata.container.tags, created_at: .created_at}"
            CUTOFF=""
          else
            echo "Mode: stale sweep — deleting ci-e2e-* images older than ${MAX_AGE_DAYS} days"
            # shellcheck disable=SC2089 # jq program, passed as a single argument
            JQ_FILTER='.[] | select(.metadata.container.tags | any(startswith("ci-e2e-"))) | {id: .id, tags: .metadata.container.tags, created_at: .created_at}'
            CUTOFF=$(date -u -d "${MAX_AGE_DAYS} days ago" +%s 2>/dev/null \
              || date -u -v-"${MAX_AGE_DAYS}"d +%s)
          fi

          PAGES_DIR=$(mktemp -d)
          # shellcheck disable=SC2090
          export JQ_FILTER PAGES_DIR

          for IMAGE in ${{ env.IMAGES }}; do
            echo "=== Scanning ${IMAGE} ==="
            VERSIONS_URL="/orgs/comet-ml/packages/container/opik%2F${IMAGE}/versions?per_page=100"
            rm -f "${PAGES_DIR}"/*

            if [ -n "$PR_CREATED_AT" ]; then
              # Versions are listed newest first and a PR's images can't predate the PR,
              # so stop at the first page that reaches past the PR's creation.
              PAGE=1
              LIST_OK=true
              while :; do
                if ! PAGE_JSON=$(gh api "${VERSIONS_URL}&page=${PAGE}"); then
                  LIST_OK=false
                  break
                fi
                echo "$PAGE_JSON" | jq -c "$JQ_FILTER" > "${PAGES_DIR}/${PAGE}"
                OLDEST=$(echo "$PAGE_JSON" | jq -r '.[-1].created_at // empty')
                if [ -z "$OLDEST" ] || [[ "$OLDEST" < "$PR_CREATED_AT" ]]; then
                  break
                fi
                PAGE=$((PAGE + 1))
              done
              echo "  Scanned ${PAGE} pages (stopped at PR creation ${PR_CREATED_AT})"
            else
              # Packages contain ~40k versions (mostly untagged release manifests) and the API
              # has no tag filter, so sequential --paginate takes ~12 min per image.
              # Pages are independent, so fetch them concurrently.
              LIST_OK=true
              if PROBE=$(gh api --include "${VERSIONS_URL}&page=1"); then
                # Fall back to a single page only when the probe succeeded without a Link
                # header; a failed probe must not silently shrink the scan to 100 versions.
                LAST_PAGE=$(echo "$PROBE" | grep -i '^link:' \
                  | sed -n 's/.*[?&]page=\([0-9]*\)>; rel="last".*/\1/p')
                LAST_PAGE=${LAST_PAGE:-1}
                echo "  Fetching ${LAST_PAGE} pages"

                export VERSIONS_URL
                # shellcheck disable=SC2016 # expanded by the child sh from the exported env
                seq 1 "$LAST_PAGE" | xargs -P 10 -I{} sh -c \
                  'gh api "${VERSIONS_URL}&page={}" --jq "$JQ_FILTER" > "${PAGES_DIR}/{}"' \
                  || LIST_OK=false
              else
                LIST_OK=false
              fi
            fi

            if [ "$LIST_OK" != true ]; then
              echo "  Failed to list versions for ${IMAGE}"
              FAILED=$((FAILED + 1))
              continue
            fi
            VERSIONS=$(cat "${PAGES_DIR}"/*)

            if [ -z "$VERSIONS" ]; then
              echo "  No matching versions found"
              continue
            fi

            COUNT=$(echo "$VERSIONS" | wc -l | tr -d ' ')
            echo "  Found ${COUNT} matching versions"

            while read -r VERSION; do
              [ -z "$VERSION" ] && continue
              VERSION_ID=$(echo "$VERSION" | jq -r '.id')
              CI_TAG=$(echo "$VERSION" | jq -r '.tags[] | select(startswith("ci-e2e-"))' | head -1)

              # For stale sweep, check age; for PR close, delete unconditionally
              if [ -n "$CUTOFF" ]; then
                CREATED_AT=$(echo "$VERSION" | jq -r '.created_at')
                CREATED_TS=$(date -u -d "$CREATED_AT" +%s 2>/dev/null \
                  || date -u -j -f "%Y-%m-%dT%H:%M:%S" "${CREATED_AT%%.*}" +%s 2>/dev/null \
                  || echo "")
                if [ -z "$CREATED_TS" ]; then
                  echo "  Skipping ${IMAGE}:${CI_TAG} (could not parse created_at: ${CREATED_AT})"
                  SKIPPED=$((SKIPPED + 1))
                  continue
                fi
                if [ "$CREATED_TS" -ge "$CUTOFF" ]; then
                  SKIPPED=$((SKIPPED + 1))
                  continue
                fi
                echo "  Deleting ${IMAGE}:${CI_TAG} (older than ${MAX_AGE_DAYS} days)"
              else
                echo "  Deleting ${IMAGE}:${CI_TAG}"
              fi

              if gh api --method DELETE \
                "/orgs/comet-ml/packages/container/opik%2F${IMAGE}/versions/${VERSION_ID}"; then
                DELETED=$((DELETED + 1))
              else
                FAILED=$((FAILED + 1))
              fi
            done <<< "$VERSIONS"
          done

          echo ""
          echo "=== Summary ==="
          echo "Deleted: ${DELETED}"
          echo "Skipped: ${SKIPPED}"
          echo "Failed: ${FAILED}"
