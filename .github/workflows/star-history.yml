# Regenerates the README star-history chart and publishes it to cdn.comet.com.
#
# Needs no GitHub token: the total star count is public. Needs no long-lived
# AWS key: credentials come from OIDC role assumption. Writes nothing back to
# the repository -- the data and the rendered SVGs live on the CDN.
#
# The published data.json is the source of truth. If it cannot be read the job
# fails rather than rebuilding from the committed seed, because publishing a
# reseeded series would silently overwrite every point gathered since the seed
# was taken. Seeding is a deliberate one-off: dispatch with bootstrap = true.
#
# Setup and operator notes: .github/scripts/STAR_HISTORY.md
# See DND-1580.
name: star-history

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run only: seed the series from the committed snapshot. Overwrites whatever is published."
        type: boolean
        default: false

concurrency:
  group: star-history
  cancel-in-progress: false

env:
  S3_PREFIX: ${{ vars.AWS_OPIK_CDN_BUCKET }}/star-history
  CDN_PATHS: /opik/star-history/*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CDN_PUBLISH_ROLE_ARN }}
          role-session-name: star-history
          aws-region: us-east-1

      # No `|| true` here on purpose: any read failure must stop the job before
      # the publish step can overwrite the series with a reseeded one.
      - name: Fetch current series
        if: ${{ inputs.bootstrap != true }}
        run: aws s3 cp "$S3_PREFIX/data.json" data.json

      - name: Render
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          args=(--data data.json --out out)
          if [ "$BOOTSTRAP" = "true" ]; then args+=(--bootstrap); fi
          python3 .github/scripts/star_history.py "${args[@]}"

      - name: Publish
        env:
          DISTRIBUTION_ID: ${{ vars.CDN_DISTRIBUTION_ID }}
        run: |
          # SVGs first, data.json last: it is the series pointer the next run
          # reads, so it must not claim a point whose chart failed to upload.
          for theme in light dark; do
            aws s3 cp "out/star-history-$theme.svg" "$S3_PREFIX/star-history-$theme.svg" \
              --content-type image/svg+xml --cache-control max-age=300
          done
          aws s3 cp out/data.json "$S3_PREFIX/data.json" \
            --content-type application/json --cache-control max-age=300
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "$CDN_PATHS"

  notify-slack:
    name: "📢 Slack Notification"
    runs-on: ubuntu-latest
    needs: publish
    # Gated on main, and the notifier is checked out from main rather than the
    # dispatched ref: this step holds a webhook secret, so it must never run
    # code from a ref the dispatcher chose. publish fails by construction off
    # main (the OIDC role trusts refs/heads/main only), which would otherwise
    # hand any writer a reliable path to this step.
    if: always() && needs.publish.result == 'failure' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Send Slack failure notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ACTION_MONITORING_SLACK }}
        run: .github/scripts/notify-slack-test-failure.sh "Star History Chart Publish"
