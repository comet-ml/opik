# Workflow to run Langchain tests
#
# Please read inputs to provide correct values.
#
name: SDK Lib LLama Index Tests
run-name: "SDK Lib LLama Index Tests ${{ github.ref_name }} by @${{ github.actor }}"
permissions:
  contents: read
env:
  # Retry transient PyPI/network failures longer before failing the build.
  PIP_RETRIES: 8
  PIP_DEFAULT_TIMEOUT: 30
  UV_HTTP_TIMEOUT: 30
  UV_HTTP_RETRIES: 8
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_ORG_ID:  ${{ secrets.OPENAI_ORG_ID }}
  OPIK_ENABLE_LITELLM_MODELS_MONITORING: False
  OPIK_SENTRY_ENABLE: False
  OPIK_ANALYTICS_ENABLE: False
on:
  workflow_call:

jobs:
  tests:
    name: LLamaIndex Python ${{matrix.python_version}}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/python

    strategy:
      fail-fast: true
      matrix:
        # Lowest and highest supported Python only: these suites make paid
        # LLM calls and the intermediate versions add cost without coverage.
        python_version: ["3.10", "3.14"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Python ${{matrix.python_version}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python_version}}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install opik
        run: uv pip install --system .

      - name: Install test tools
        run: |
          cd ./tests
          uv pip install --system -r test_requirements.txt

      - name: Install lib
        # NLTK >=3.10.4 refuses hardlinked data files, uv's default link mode, which
        # includes the stopwords llama-index bundles in its NLTK cache.
        env:
          UV_LINK_MODE: copy
        run: |
          cd ./tests
          uv pip install --system -r library_integration/llama_index/requirements.txt

      - name: Make llama-index's NLTK cache private
        # NLTK >=3.10.4 also refuses a data directory that is group- or world-writable,
        # and the installed cache directory is group-writable on the runner.
        run: |
          nltk_cache="$(python -c 'import os, llama_index.core as core; print(os.path.join(os.path.dirname(core.__file__), "_static", "nltk_cache"))')"
          echo "uid $(id -u), umask $(umask)"
          stat -c '%a %U:%G %n' "$nltk_cache" "$nltk_cache/corpora" "$nltk_cache/corpora/stopwords"
          getfacl -p "$nltk_cache" || true
          chmod -R go-w "$nltk_cache"
          stat -c '%a %U:%G %n' "$nltk_cache" "$nltk_cache/corpora" "$nltk_cache/corpora/stopwords"

      - name: Run tests
        run: |
          cd ./tests/library_integration/llama_index/
          python -m pytest  -vv .