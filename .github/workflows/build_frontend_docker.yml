name: Frontend Docker Build
run-name: "Frontend Docker Build ${{ github.ref_name }} by @${{ github.actor }}"
permissions:
  contents: read
on:
  pull_request:
    paths:
      - "apps/opik-frontend/**"
      - ".github/workflows/build_frontend_docker.yml"
  # Also on main: catches a break that lands despite green PRs -- e.g. two PRs that
  # each build fine alone but not merged together.
  push:
    branches:
      - 'main'
    paths:
      - "apps/opik-frontend/**"
      - ".github/workflows/build_frontend_docker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only: the source tree checks (eslint, typecheck, unit tests) all run
      # against the working tree, so they miss anything that only breaks in a clean
      # Docker build context -- e.g. a COPY of a directory that git dropped because
      # it went empty. amd64 only: the Dockerfile has no arch-conditional logic, so
      # a second arch doubles runtime without covering a distinct failure mode.
      # Multi-arch stays on the release path in build_apps.yml.
      #
      # No layer cache: this job only runs when apps/opik-frontend/** changed, so the
      # Dockerfile's `COPY . .` is invalidated every time by construction and the
      # `npm run build` below it always re-runs. The only restorable layer is
      # `npm ci` (72s), while exporting the cache cost 77.8s on every run -- a net
      # loss, and worse on PRs that touch package.json.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: apps/opik-frontend
          file: apps/opik-frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
