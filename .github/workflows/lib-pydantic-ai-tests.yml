# Workflow to run Pydantic AI tests
#
# Please read inputs to provide correct values.
#
name: SDK Lib Pydantic AI Tests
run-name: "SDK Lib Pydantic AI Tests ${{ github.ref_name }} by @${{ github.actor }}"
permissions:
  contents: read
env:
  OPIK_SENTRY_ENABLE: False
on:
  workflow_call:

jobs:
  tests:
    name: Pydantic AI Python ${{ matrix.python_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/python

    strategy:
      fail-fast: true
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install opik
        run: uv pip install --system .

      - name: Install test tools
        run: uv pip install --system -r tests/test_requirements.txt

      - name: Install lib
        run: uv pip install --system -r tests/library_integration/pydantic_ai/requirements.txt

      - name: Run tests
        run: python -m pytest -vv tests/library_integration/pydantic_ai/
