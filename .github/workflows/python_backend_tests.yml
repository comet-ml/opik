name: "Python Backend Tests"
run-name: "Python Backend Tests on ${{ github.ref_name }} by @${{ github.actor }}"
permissions:
  contents: read
  checks: write
  pull-requests: write
env:
  # Retry transient PyPI/network failures longer before failing the build.
  PIP_RETRIES: 8
  PIP_DEFAULT_TIMEOUT: 30
  UV_HTTP_TIMEOUT: 30
  UV_HTTP_RETRIES: 8

on:
  pull_request:
    paths:
      - "apps/opik-python-backend/**"
      - ".github/workflows/python_backend_tests.yml"
  push:
    branches:
      - 'main'
    paths:
      - "apps/opik-python-backend/**"
      - ".github/workflows/python_backend_tests.yml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  run-python-backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/opik-python-backend/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt -r tests/test_requirements.txt
          uv pip install --system .
      
      - name: Run unit tests
        env:
          PYTHON_CODE_EXECUTOR_STRATEGY: process
          PYTHON_CODE_EXECUTOR_EXEC_TIMEOUT_IN_SECS: 10
        run: |
          cd tests && pytest unit -v --durations=0 --junitxml=../test-results.xml
      
      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action/linux@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        if: always()
        with:
          action_fail: true
          comment_mode: failures
          check_name: Python Backend Tests Results
          files: apps/opik-python-backend/test-results.xml
