permissions:
  contents: read
  pull-requests: write
name: PR Linter

# This workflow runs on pull requests that are opened, edited, or have new commits pushed.
on:
  pull_request:
    types: [opened, edited, synchronize]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint-pr:
    # Dependabot and Renovate (comet-ci-bot) PRs have a bot-generated title/body that can't follow the PR
    # template — skip the linter for them rather than surface a permanent red check.
    # Key off the PR author, not github.actor: a human editing the PR would make
    # github.actor the human and let the lint run on a bot PR anyway.
    if: ${{ !contains(fromJSON('["dependabot[bot]", "comet-ci-bot[bot]"]'), github.event.pull_request.user.login) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # The commitlint step runs the PR's own commitlint.config.mjs; don't
          # leave the token in .git/config for that code.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-commitlint-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Lint the PR title and every commit in the PR with the same commitlint hook
      # that runs locally at commit-msg, so commitlint.config.mjs and its pinned
      # version in .pre-commit-config.yaml are the only definition of the format.
      # A failing title / commit subjects are written to files that the next step
      # turns into the linter comment; commitlint's full output goes to this job's
      # log. This step itself never fails the job.
      - name: Lint PR Title and Commits (commitlint)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          : > "$RUNNER_TEMP/commitlint-title-failed"
          : > "$RUNNER_TEMP/commitlint-bad-commits.txt"
          lint() {
            uvx pre-commit run commitlint --hook-stage commit-msg --commit-msg-filename "$1"
          }

          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          echo "::group::PR title"
          if ! OPIK_COMMITLINT_PR_TITLE=1 lint "$RUNNER_TEMP/title.txt"; then
            echo failed > "$RUNNER_TEMP/commitlint-title-failed"
          fi
          echo "::endgroup::"

          # The PR commits endpoint returns at most 250 commits, which covers any PR we review.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | "\(.sha) \(.commit.message | @base64)"' > "$RUNNER_TEMP/commits.txt"
          while read -r sha message; do
            printf '%s' "$message" | base64 -d > "$RUNNER_TEMP/msg.txt"
            echo "::group::commit ${sha:0:10}"
            if ! lint "$RUNNER_TEMP/msg.txt"; then
              printf '%s %s\n' "${sha:0:10}" "$(head -n1 "$RUNNER_TEMP/msg.txt")" >> "$RUNNER_TEMP/commitlint-bad-commits.txt"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/commits.txt"

      - name: Validate PR Title, Description, and Commits
        uses: actions/github-script@v9
        with:
          script: |
            // Get the PR context
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("Could not get PR from context.");
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            let errors = [];

            // 1. PR title and commit messages, as linted by commitlint in the previous step
            const fs = require("fs");
            const title = pr.title;
            const formatDocs = "The format is defined in [`commitlint.config.mjs`](https://github.com/comet-ml/opik/blob/main/commitlint.config.mjs); see [Commit and PR conventions](https://github.com/comet-ml/opik/blob/main/CONTRIBUTING.md#commit-and-pr-conventions). The **Lint PR Title and Commits** step log has commitlint's full output.";
            if (fs.readFileSync(`${process.env.RUNNER_TEMP}/commitlint-title-failed`, "utf8").trim()) {
              errors.push(
                "❌ **Invalid Title Format.** Your PR title must include a ticket/issue number and may optionally include component tags (`[FE]`, `[BE]`, etc.).\n\n" +
                "  - **Internal contributors: Open a JIRA ticket and link to it:** `[OPIK-xxxx]` or `[CUST-xxxx]` or `[DND-xxxx]` or `[DEV-xxxx] [COMPONENT] Your change`\n" +
                "  - **External contributors: Open a Github Issue and link to it via its number:** `[issue-xxxx] [COMPONENT] Your change`\n" +
                "  - **No ticket:** Use `[NA] [COMPONENT] Your change` (Issues section not required)\n\n" +
                "  *Example: `[issue-3108] [BE] [FE] fix: authentication bug` or `[OPIK-1234] fix: bug` or `[NA] docs: update README`*\n\n" +
                formatDocs
              );
            }
            const badCommits = fs.readFileSync(`${process.env.RUNNER_TEMP}/commitlint-bad-commits.txt`, "utf8").trim();
            if (badCommits) {
              errors.push(
                "❌ **Invalid Commit Message.** These commits don't match any accepted header form:\n\n" +
                badCommits.split("\n").map(line => {
                  const [sha, ...subject] = line.split(" ");
                  return `  - ${sha}: \`${subject.join(" ").replace(/`/g, "'")}\``;
                }).join("\n") + "\n\n" +
                "  Accepted forms:\n" +
                "  - `[TICKET] [COMPONENT] type: description` (first commit; becomes the PR title)\n" +
                "  - `type(scope): description` (follow-up commits)\n" +
                "  - `Revision N: description` (last resort)\n\n" +
                "  Fix them with `git rebase -i` (reword) and force-push. Run `make hooks` to check messages locally at commit time.\n\n" +
                formatDocs
              );
            }

            // 2. Validate PR Description
            const body = pr.body || "";
            const requiredHeadings = ["## Details", "## Change checklist", "## Issues", "## Testing", "## Documentation"];
            if (body.length === 0) {
              errors.push("❌ **Missing Description.** The PR description cannot be empty.");
            } else {
              for (const heading of requiredHeadings) {
                if (!body.includes(heading)) {
                  errors.push(`❌ **Missing Section.** The description is missing the \`${heading}\` section.`);
                }
              }

              // Helper function to get content of a markdown section
              const getSectionContent = (sectionTitle) => {
                const startIndex = body.indexOf(sectionTitle);
                if (startIndex === -1) return null;
                const nextHeaderIndex = body.indexOf("## ", startIndex + sectionTitle.length);
                const endIndex = nextHeaderIndex !== -1 ? nextHeaderIndex : body.length;
                return body.substring(startIndex + sectionTitle.length, endIndex).trim();
              };
              
              const detailsContent = getSectionContent("## Details");
              if (detailsContent !== null && detailsContent.length === 0) {
                  errors.push("❌ **Incomplete Details Section.** The `## Details` section cannot be empty.");
              }

              const issuesContent = getSectionContent("## Issues");
              const issuesRegex = /(#\d+|OPIK-\d+|DND-\d+|DEV-\d+|CUST-\d+)/;
              const isNATicket = title.startsWith("[NA]");
              if (issuesContent !== null && !isNATicket && !issuesRegex.test(issuesContent)) {
                 errors.push(
                   "❌ **Incomplete Issues Section.** You must reference at least one GitHub issue (`#xxxx`), Jira ticket (`OPIK-xxxx`), CUST ticket (`CUST-xxxx`), DEV ticket (`DEV-xxxx`), or DND ticket (`DND-xxxx`) under the `## Issues` section."
                 );
              }
            }
            
            // 3. Find all existing linter comments across all pages
            const COMMENT_MARKER = "<!-- pr-linter-comment -->";
            const allComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const markerComments = allComments.filter(c => c.body && c.body.includes(COMMENT_MARKER));

            // 4. Final step: upsert/delete comment and/or fail the job
            if (errors.length > 0) {
              const commentBody = COMMENT_MARKER + "\n### 📋 PR Linter Failed\n\n" + errors.join("\n\n---\n\n");

              const logMessage = "PR Linter Failed:\n\n" + errors.join("\n\n")
                  .replace(/❌ \*\*/g, '❌ ')
                  .replace(/\*\*`/g, '`')
                  .replace(/`\*\*/g, '`')
                  .replace(/###\s/g, '')
                  .replace(/---\n\n/g, '');

              if (markerComments.length > 0) {
                // Keep the newest, delete any duplicates
                const [keep, ...duplicates] = [...markerComments].sort((a, b) => b.id - a.id);
                await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body: commentBody });
                await Promise.all(duplicates.map(c => github.rest.issues.deleteComment({ owner, repo, comment_id: c.id })));
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: commentBody });
              }

              core.setFailed(logMessage);
            } else {
              await Promise.all(markerComments.map(c => github.rest.issues.deleteComment({ owner, repo, comment_id: c.id })));
              console.log("✅ PR linting passed!");
            }
