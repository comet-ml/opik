name: Docker Multi-Arch PR Build
run-name: "Docker Multi-Arch PR Build ${{ github.ref_name }} by @${{ github.actor }}"
permissions:
  contents: read
# Builds images the way build_apps.yml does on main, through build_and_push_docker.yaml
# (amd64 and arm64 on native runners), without pushing. Only when an input that resolves
# per arch changes: a base image digest, or a dependency's wheel or native binary. Source
# changes are covered by the amd64 PR builds.
on:
  pull_request:
    paths:
      - "apps/opik-backend/Dockerfile"
      - "apps/opik-frontend/Dockerfile"
      - "apps/opik-frontend/package.json"
      - "apps/opik-frontend/package-lock.json"
      - "apps/opik-python-backend/Dockerfile"
      - "apps/opik-python-backend/requirements.txt"
      - "apps/opik-sandbox-executor-python/Dockerfile"
      - "apps/opik-sandbox-executor-python/requirements.txt"
      - ".github/workflows/build_docker_pr.yml"
      - ".github/workflows/build_and_push_docker.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Select images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    defaults:
      run:
        shell: bash
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - name: Select images whose arch-sensitive inputs changed
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # opik-guardrails-backend is left out: build_apps.yml does not build it.
          all=(opik-backend opik-frontend opik-python-backend opik-sandbox-executor-python)
          files=""
          if [[ "$EVENT" == "pull_request" ]]; then
            files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          fi
          selected=()
          for image in "${all[@]}"; do
            if [[ "$EVENT" != "pull_request" ]] \
              || grep -qE '^\.github/workflows/(build_docker_pr\.yml|build_and_push_docker\.yaml)$' <<<"$files" \
              || grep -qE "^apps/${image}/(Dockerfile|package(-lock)?\.json|requirements\.txt)$" <<<"$files"; then
              selected+=("$image")
            fi
          done
          echo "images=$(jq -cn '$ARGS.positional' --args "${selected[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }}
    needs: detect
    if: needs.detect.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    # The called workflow's jobs declare packages: write; with push: false nothing is written.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_and_push_docker.yaml
    with:
      image: ${{ matrix.image }}
      version: ${{ github.sha }}
      build_from: ${{ github.sha }}
      build_comet_image: false
      is_release: false
      push: false
