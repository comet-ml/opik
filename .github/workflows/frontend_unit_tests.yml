name: Frontend Unit Tests
run-name: "Frontend Unit Tests ${{ github.ref_name }} by @${{ github.actor }}"
permissions:
  contents: read
on:
  pull_request:
    paths:
      - "apps/opik-frontend/**"
      # A new changelog entry makes the committed release-notes manifest stale, so it has to
      # trigger this workflow even though it touches no frontend file.
      - "apps/opik-documentation/documentation/fern/docs-v2/changelog/**"
  push:
    branches:
      - 'main'
    paths:
      - "apps/opik-frontend/**"
      - "apps/opik-documentation/documentation/fern/docs-v2/changelog/**"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/opik-frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Release notes manifest is up to date
        run: npm run release-notes:check

      - name: Unit tests
        run: npm run test
