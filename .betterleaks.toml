# Betterleaks secret-scanning config, run by the `betterleaks` pre-commit hook
# (.pre-commit-config.yaml) locally and in the 🐙 Code Quality workflow.
#
# Extends the upstream default rule set. This file never lists a value that
# looks like a real secret, even one that is safe to publish. Suppress those
# where they occur instead: an inline `betterleaks:allow` comment on the flagged
# line, or a fingerprint in .betterleaksignore when the line can't hold a comment.
#
# The allowlists below cover only obvious placeholder words, each anchored
# (^...$) and scoped to the rules that flag it, so a new real secret never
# matches. Don't add directory-wide exclusions (e.g. all tests or docs): they
# fail open on every future file.
#
# Exclusions use the v1 `[[allowlists]]` form on purpose: in betterleaks v1 they
# are OR-ed into the default global filter, whereas a top-level `filter` here
# would replace it. Convert them to a `filter` when moving to v2, where global
# filters are additive.

[extend]
useDefault = true

[[allowlists]]
description = "Placeholder passwords in local-dev config, docs and tests"
targetRules = ["generic-api-key", "generic-credential-uri", "generic-password"]
regexes = [
  '''^(opik|opikmon|changeit|miniopassword)$''',
  '''^(redis-password|sentinel-password|my_secure_password)$''',
  '''^(password|pass456|secret|s3cr3t|s3cret|name)$''',
  '''^(sentinel-pass|data@pass|data%40pass)$''',
  '''^(pass%40word|pass%3Eword|name:pass>word|my%40pass%3Aword|password<with>special&chars)$''',  # URL-encoding cases
]

[[allowlists]]
description = "Helm chart README, generated by helm-docs from values.yaml, which is scanned and annotated at the source line"
targetRules = ["generic-credential-uri"]
paths = ['''^deployment/helm_chart/opik/README\.md$''']
