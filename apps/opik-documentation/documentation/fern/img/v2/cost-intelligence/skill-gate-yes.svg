<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-labelledby="ci-gate-yes">
  <title id="ci-gate-yes">When a skill fits: the skill gate sends the prompt and the hidden skills to a decision model, which answers yes: docs. The docs skill description is injected into the prompt, and Claude uses the skill.</title>
  <rect x="0" y="0" width="1000" height="370" fill="#ffffff"/><rect x="12" y="14" width="976" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect x="12" y="170" width="976" height="186" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="30" y="58" font-size="11" fill="#64748b" text-anchor="start" font-weight="700" letter-spacing="1.5">DECISION</text><text x="30" y="74" font-size="11" fill="#64748b" text-anchor="start" font-weight="700" letter-spacing="1.5">MODEL</text><text x="30" y="252" font-size="11" fill="#64748b" text-anchor="start" font-weight="700" letter-spacing="1.5">CLAUDE</text><text x="30" y="268" font-size="11" fill="#64748b" text-anchor="start" font-weight="700" letter-spacing="1.5">CODE</text><rect x="380" y="30" width="370" height="64" rx="10" fill="#1f2937"/><text x="565" y="57" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">Decision model</text><text x="565" y="79" font-size="13" fill="#cbd5e1" text-anchor="middle">Does a hidden skill fit this prompt?</text><text x="130" y="212" font-size="11" fill="#64748b" text-anchor="start" font-weight="700" letter-spacing="1.5">DEVELOPER</text><rect x="130" y="222" width="190" height="77" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="144" y="244" font-size="13" fill="#1f2937" text-anchor="start">Turn these meeting</text><text x="144" y="263" font-size="13" fill="#1f2937" text-anchor="start">notes into a doc the</text><text x="144" y="282" font-size="13" fill="#1f2937" text-anchor="start">team can comment on.</text><rect x="400" y="243.5" width="120" height="34" rx="17" fill="#ffffff" stroke="#2e8555" stroke-width="1.8"/><text x="460" y="265.5" font-size="14" fill="#2e8555" text-anchor="middle" font-weight="700">Skill gate</text><path d="M320 260.5 H398" stroke="#94a3b8" stroke-width="2"/><path d="M391 255.5 L400 260.5 L391 265.5" fill="#94a3b8"/><path d="M460 243.5 V94" stroke="#94a3b8" stroke-width="2"/><path d="M454 103 L460 94 L466 103" fill="#94a3b8"/><text x="472" y="140" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700">prompt + hidden skills</text><path d="M670 94 V192" stroke="#2e8555" stroke-width="2"/><path d="M664 183 L670 192 L676 183" fill="#2e8555"/><text x="682" y="140" font-size="13" fill="#2e8555" text-anchor="start" font-weight="700">yes: docs</text><rect x="580" y="196" width="180" height="77" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="594" y="218" font-size="13" fill="#1f2937" text-anchor="start">Turn these meeting</text><text x="594" y="237" font-size="13" fill="#1f2937" text-anchor="start">notes into a doc the</text><text x="594" y="256" font-size="13" fill="#1f2937" text-anchor="start">team can comment on.</text><rect x="580" y="281" width="180" height="66" rx="8" fill="#e8f5ee" stroke="#2e8555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="594" y="299" font-size="11" fill="#2e8555" text-anchor="start" font-weight="700" letter-spacing="1.5">INJECTED</text><text x="594" y="317" font-size="12" fill="#1f2937" text-anchor="start">docs: Editable docs</text><text x="594" y="336" font-size="12" fill="#1f2937" text-anchor="start">people share…</text><path d="M520 260.5 H578" stroke="#94a3b8" stroke-width="2"/><path d="M571 255.5 L580 260.5 L571 265.5" fill="#94a3b8"/><rect x="800" y="212" width="172" height="72" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/><text x="814" y="236" font-size="15" fill="#1f2937" text-anchor="start" font-weight="700">Claude</text><text x="814" y="256" font-size="12.5" fill="#64748b" text-anchor="start">Uses the docs skill.</text><text x="814" y="273" font-size="12.5" fill="#64748b" text-anchor="start">Writes the doc.</text><path d="M760 248 H798" stroke="#94a3b8" stroke-width="2"/><path d="M791 243 L800 248 L791 253" fill="#94a3b8"/>
</svg>
