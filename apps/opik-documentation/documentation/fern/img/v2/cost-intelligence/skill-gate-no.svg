<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-labelledby="ci-gate-no">
  <title id="ci-gate-no">When no skill fits: the decision model answers no. Nothing is injected, and the prompt reaches Claude unchanged.</title>
