port 26379
# Sentinels are configured with the docker network aliases of the redis nodes rather than their IPs, and they announce
# those same hostnames back to the client, so the NAT mapper in the test can translate them to the host mapped ports.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
# A quorum of 1 is enough, as a single sentinel is started
sentinel monitor mymaster redis-master 6379 1
sentinel down-after-milliseconds mymaster 2000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1

