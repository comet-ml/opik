defaults:
  openai: {profile: openai, reasoningProfile: openai-reasoning}
  anthropic: {profile: anthropic}
profiles:
  openai:
    temperature: {min: 0, max: 2, default: 0}
    maxOutputTokens: {min: 1, max: 128000, default: 4000}
    effort: {accepted: false}
    routes:
      responses_api:
        maxOutputTokens: {min: 16}
  openai-reasoning:
    temperature: {accepted: false}
  anthropic:
    temperature: {accepted: false, min: 0, max: 1, default: 0}
    effort: {levels: [low, medium, high], default: high}
  anthropic-sampling:
    temperature: {accepted: true}
models:
  openai:
    - id: o3
      params:
        effort: {accepted: true, levels: [low, medium, high], default: high}
  anthropic:
    - id: claude-sonnet-4-6
      profile: anthropic-sampling
      params:
        effort: {levels: [low, medium, high, max]}
    - id: claude-not-yet-synced
      awaitingSync: true
      params:
        effort: {levels: [low]}
