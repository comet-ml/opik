# Written by people and reviewed in PRs; wins over llm-models-default.yaml, which the sync writes.
# A model takes its provider's profile, then the reasoning profile when the registry flags it, then
# its own profile, then its own params; each layer sets only what it changes.
defaults:
  openai: {profile: openai, reasoningProfile: openai-reasoning}
  anthropic: {profile: anthropic}
  # The frontend's supportsGeminiSamplingParams draws the same line, so a model the sync adds without a row gets the
  # same answer on both sides: Gemini 1.x and 2.x, gemini-pro-vision and every id outside the gemini- family (Gemma)
  # take sampling, and any other gemini- id takes the gemini profile, which refuses it.
  gemini:
    profile: gemini
    idProfiles:
    - {match: '^(?!gemini-)', profile: gemini-sampling}
    - {match: '^gemini-(1\.0|1\.5|2\.0|2\.5)(-|$)', profile: gemini-sampling}
    - {match: '^gemini-pro-vision$', profile: gemini-sampling}
  vertex-ai:
    profile: gemini
    idProfiles:
    - {match: '^(?!gemini-)', profile: gemini-sampling}
    - {match: '^gemini-(1\.0|1\.5|2\.0|2\.5)(-|$)', profile: gemini-sampling}
    - {match: '^gemini-pro-vision$', profile: gemini-sampling}
profiles:
  openai:
    temperature: {min: 0, max: 2, default: 0}
    topP: {min: 0, max: 1, default: 1}
    frequencyPenalty: {min: -2, max: 2, default: 0}
    presencePenalty: {min: -2, max: 2, default: 0}
    maxOutputTokens: {min: 1, max: 128000, default: 4000}
    effort: {accepted: false}
    routes:
      responses_api:
        frequencyPenalty: {accepted: false}
        presencePenalty: {accepted: false}
        stop: {accepted: false}
        seed: {accepted: false}
        maxOutputTokens: {min: 16}
  openai-reasoning:
    temperature: {accepted: false}
    topP: {accepted: false}
    frequencyPenalty: {accepted: false}
    presencePenalty: {accepted: false}
    # Reasoning tokens count against the limit, so a limit of 1 gets a 400 ("max_tokens or model output limit was
    # reached") on Chat Completions. 16 is the Responses route's floor, where the same models pass.
    maxOutputTokens: {min: 16}
  # A Claude id without a row takes no sampling params and thinks: newer models increasingly refuse sampling, and
  # omitting a param beats the 400 a refused one gets. So the rows below name the models that do take them.
  anthropic:
    temperature: {accepted: false, min: 0, max: 1, default: 0}
    topP: {accepted: false, min: 0, max: 1, default: 1}
    topK: {accepted: false}
    samplingExclusive: true
    thinksByDefault: true
    maxOutputTokens: {min: 1, max: 64000, default: 4000}
    effort:
      levels: [low, medium, high, xhigh, max]
      default: high
  anthropic-sampling:
    temperature: {accepted: true}
    topP: {accepted: true}
    topK: {accepted: true}
  # Gemini 3.x and 4.x ignore temperature and top-P, and answer frequency or presence penalty with a 400, so a gemini-
  # id takes none of them unless the defaults above place it in an older generation.
  gemini:
    temperature: {accepted: false, min: 0, max: 2, default: 0}
    topP: {accepted: false, min: 0, max: 1, default: 1}
    frequencyPenalty: {accepted: false}
    presencePenalty: {accepted: false}
    maxOutputTokens: {min: 1, max: 65535, default: 4000}
    effort: {accepted: false}
  gemini-sampling:
    temperature: {accepted: true}
    topP: {accepted: true}
    frequencyPenalty: {accepted: true}
    presencePenalty: {accepted: true}
  gemini-no-sampling:
    temperature: {accepted: false}
    topP: {accepted: false}
    frequencyPenalty: {accepted: false}
    presencePenalty: {accepted: false}
